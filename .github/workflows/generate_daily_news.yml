name: Generate Daily News (Active PRO Regions)

on:
  schedule:
    # Runs once daily at 04:00 UTC (06:00 AM Kyiv / 07:00 AM Moscow / 09:00 AM Almaty)
    # Generates today's editions simultaneously for ALL active PRO regions.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_countries:
        description: 'Optional comma-separated COUNTRY:lang+lang (e.g. KZ:ru+kk,UA:uk+ru,US:en)'
        required: false
        default: ''

jobs:
  generate-daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate regional daily news for active countries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: english-breakfast-181ba
          FORCE_COUNTRIES: ${{ github.event.inputs.force_countries || '' }}
        run: node scripts/generate_daily_news.mjs
