name: Generate Daily News (Active PRO Regions)

on:
  schedule:
    # Primary daily run at 04:17 UTC (:17 bypasses top-of-the-hour GitHub queue delays)
    # (06:17 AM Kyiv / 07:17 AM Moscow / 09:17 AM Almaty)
    - cron: '17 4 * * *'
    # Backup/recovery run at 05:17 UTC in case GitHub delayed or dropped the 04:17 run.
    # If today's edition is already generated, it exits cleanly in 2 seconds without spending API calls.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      force_countries:
        description: 'Optional comma-separated COUNTRY:lang+lang (e.g. KZ:ru+kk,UA:uk+ru,US:en)'
        required: false
        default: ''

jobs:
  generate-daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate regional daily news for active countries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: english-breakfast-181ba
          FORCE_COUNTRIES: ${{ github.event.inputs.force_countries || '' }}
        run: node scripts/generate_daily_news.mjs
