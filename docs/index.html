      (function() {

          var isAndroid = !!(
            window.androidBridge ||
            window.Capacitor?.isNativePlatform?.() ||
            window.Capacitor?.getPlatform?.() === 'android' ||
            (window.location && window.location.hostname === 'localhost' && /Android/i.test(navigator.userAgent))
          );
          if (isAndroid) {
            document.documentElement.classList.add('is-android-app');
          }
        } catch (e) {}
        try {
          var userLang = (localStorage.getItem('myduo_interface_lang') || '').toLowerCase();
          if (!userLang && navigator.languages && navigator.languages.length > 0) {
            userLang = (navigator.languages[0] || '').toLowerCase().split(/[-_]/)[0];
          }
          if (userLang === 'ar' || userLang === 'fa' || userLang === 'ur') {
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', userLang);
            document.documentElement.classList.add('is-rtl');
          } else {
            document.documentElement.setAttribute('dir', 'ltr');
            if (userLang) document.documentElement.setAttribute('lang', userLang);
            document.documentElement.classList.remove('is-rtl');
          }
        } catch (e) {}
        try {
          var t = localStorage.getItem('myduo_theme') || 'dark';
          var isWide = typeof window !== 'undefined' && window.innerWidth > 680;
          var initBg = t === 'dark' ? (isWide ? '#09131d' : '#0f1c2a') : (isWide ? '#eaf3fc' : '#f8fbff');
          if (t === 'dark') {
            document.documentElement.classList.add('dark-theme');
          }
          document.documentElement.style.backgroundColor = initBg;
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.setWindowThemeColor === 'function') {
            window.AndroidThemeBridge.setWindowThemeColor(t);
          }
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.getStatusBarHeightDp === 'function') {
            var sbHeight = window.AndroidThemeBridge.getStatusBarHeightDp();
            if (sbHeight > 0) {
              document.documentElement.style.setProperty('--safe-top', sbHeight + 'px');
            }
          }
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.getNavigationBarHeightDp === 'function') {
            var nbHeight = window.AndroidThemeBridge.getNavigationBarHeightDp();
            if (nbHeight > 0) {
              document.documentElement.style.setProperty('--safe-bottom', nbHeight + 'px');
            }
          }
        } catch (e) {}
        var prevBuild = localStorage.getItem('myduo_app_build');
        if (prevBuild !== APP_BUILD) {
          localStorage.setItem('myduo_app_build', APP_BUILD);
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);

          var splash = document.getElementById('app-splash-screen');
          if (splash) {
            splash.style.pointerEvents = 'none';

            window.hideAppSplashScreen();

        if ('serviceWorker' in navigator && !document.documentElement.classList.contains('is-android-app')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js?v=423.0').catch(function() {});

      // One-time cleanup of phantom words that were never actively learned in Cards
      (function cleanPhantomWords() {
        try {
          const user = getCurrentUser();
          const uId = user ? user.id : 'guest';
          const progKey = 'progress_' + uId;
          const localProg = JSON.parse(localStorage.getItem(progKey) || '{}');
          let changed = false;
          Object.keys(localProg).forEach((id) => {
            const p = localProg[id];
            // If word is not mastered, has no typing inputs, no quiz successes, but accumulated pairs, clear it
            if (p && !p.mastered && (p.inputCorrect || 0) === 0 && (p.quizCorrect || 0) === 0 && (p.pairsCorrect || 0) > 0) {
              delete localProg[id];
              changed = true;
            }
          });
          if (changed) {
            localStorage.setItem(progKey, JSON.stringify(localProg));

              w.translation = w.translations[initialLang];

            if (w && w.all_notes && typeof w.all_notes === 'object') {

          });

              preloadNextWotdVideo();

      function getDailyVideoDateKey() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;

      function preloadNextWotdVideo() {
        try {
          let currentIdx = parseInt(localStorage.getItem('myduo_wotd_video_idx') || '0', 10);
          if (isNaN(currentIdx) || currentIdx < 0) currentIdx = 0;
          const selectedVideo = wotdPlaylist[currentIdx % wotdPlaylist.length];

          // Preload via background video element into memory buffer (clean, no console warnings)
          if (!window._wotdPreloadVideo) {
            window._wotdPreloadVideo = document.createElement('video');
            window._wotdPreloadVideo.preload = 'auto';
            window._wotdPreloadVideo.muted = true;
            window._wotdPreloadVideo.playsInline = true;
          }

          resolveVideoUrl(selectedVideo).then((videoUrl) => {
            if (window._wotdPreloadVideo.src !== videoUrl && !window._wotdPreloadVideo.src.endsWith(videoUrl)) {
              window._wotdPreloadVideo.src = videoUrl;
              window._wotdPreloadVideo.load();
            }
          }).catch(() => {});
        } catch (e) {}
      }

      function handleFavoriteToggle(wordId, isFav) {
        const idStr = String(wordId);
        if (isFav) favoriteIds.add(idStr);
        else favoriteIds.delete(idStr);

        // If unfavoriting during "Repeat Favorites" practice — remove card from the list
        const isPracticingMyFavorites = !window._activePracticeCollectionId || window._activePracticeCollectionId === 'my_favorites';
        if (isPracticingMyFavorites && !isFav && favoritePracticeWords && favoritePracticeWords.length > 0) {
          const prevLen = favoritePracticeWords.length;
          favoritePracticeWords = favoritePracticeWords.filter(
            (w) => String(w.id) !== idStr
          );
          if (favoritePracticeWords.length < prevLen) {
            // Keep index in bounds
            if (currentWordIndex >= favoritePracticeWords.length) {
              currentWordIndex = Math.max(0, favoritePracticeWords.length - 1);
            }
            if (favoritePracticeWords.length === 0) {
              // No more favorites — exit practice mode
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              currentWordIndex = 0;
            }
            renderTrainingTab();
            return;
          }
        }

        if (activeTab === 'favorites') {
          if (window._isInsideCollectionCards) {
            return;
          }
          renderTab(activeTab);
        }
      }

          words.forEach((w) => {

      function initMilestoneBaseline() {
        try {
          const mastered = getMasteredWordsCount();
          const currentPassedMilestone = Math.floor(mastered / 50) * 50;
          const rawSaved = localStorage.getItem('myduo_milestone_highest_unlocked');

          // Initialize baseline ONLY on first run when myduo_milestone_highest_unlocked is not yet set,
          // so new milestones crossed during training are detected and announced at round completion.
          if (rawSaved === null) {
            localStorage.setItem('myduo_milestone_highest_unlocked', String(currentPassedMilestone));
            for (let m = 50; m <= currentPassedMilestone; m += 50) {
              localStorage.setItem(`myduo_milestone_story_${m}_shown`, 'true');
            }
          }
        } catch (_) {}
      }

      function recordMilestoneProgressIfNeeded() {
        try {
          initMilestoneBaseline();
          const mastered = getMasteredWordsCount();
          const currentPassedMilestone = Math.floor(mastered / 50) * 50;
          const savedHighest = Number(localStorage.getItem('myduo_milestone_highest_unlocked')) || 0;
          if (currentPassedMilestone > savedHighest && currentPassedMilestone <= 1850) {
            localStorage.setItem('myduo_pending_milestone_unlock', String(currentPassedMilestone));
          }
        } catch (_) {}
      }

      function checkMilestoneStoryTrigger(delay = 600) {
        try {
          initMilestoneBaseline();
          const mastered = getMasteredWordsCount();
          const currentPassedMilestone = Math.floor(mastered / 50) * 50;
          const savedHighest = Number(localStorage.getItem('myduo_milestone_highest_unlocked')) || 0;
          const pendingMilestone = Number(localStorage.getItem('myduo_pending_milestone_unlock')) || 0;
          const targetMilestone = Math.max(
            currentPassedMilestone > savedHighest ? currentPassedMilestone : 0,
            pendingMilestone > savedHighest ? pendingMilestone : 0
          );

          // Trigger ONLY if the user just crossed a brand new milestone > savedHighest
          if (targetMilestone >= 50 && targetMilestone > savedHighest && targetMilestone <= 1850) {
            localStorage.setItem('myduo_milestone_highest_unlocked', String(targetMilestone));
            localStorage.removeItem('myduo_pending_milestone_unlock');
            localStorage.setItem(`myduo_milestone_story_${targetMilestone}_shown`, 'true');
            setTimeout(() => {
              window.showMilestoneUnlockedModal(targetMilestone);
            }, delay);
          }
        } catch (_) {}
      }

        function sanitizeCategory(cat) {
          if (!cat) return 'Elementary';
          const s = String(cat).replace(/\s*[•\-–—]?\s*[A-C][1-2].*$/i, '').trim();
          const clean = s.toLowerCase();
          if (clean === 'it' || clean === 'idioms' || clean === 'finance') return null;
          if (clean.includes('elementary')) return 'Elementary';
          if (clean.includes('irregular')) return 'Irregular verbs';
          if (clean.includes('pattern')) return 'Pattern';
          if (clean.includes('intermediate')) return 'Intermediate';
          if (clean.includes('advanced')) return 'Advanced';
          return 'Elementary';
        }

        const CANONICAL_CATEGORY_ORDER = ['Elementary', 'Irregular verb', 'Pattern', 'Intermediate', 'Advanced'];

        function getCategoryOrderIndex(catName) {
          const clean = String(catName || '').toLowerCase().trim();
          if (clean.includes('elementary')) return 0;
          if (clean.includes('irregular')) return 1;
          if (clean.includes('pattern')) return 2;
          if (clean.includes('intermediate')) return 3;
          if (clean.includes('advanced')) return 4;
          return 999;
        }

        function getNextSequentialCategory(currentCat, availableCats) {
          const currentIdx = getCategoryOrderIndex(currentCat);
          if (currentIdx === 999) return null;
          for (let i = currentIdx + 1; i < CANONICAL_CATEGORY_ORDER.length; i++) {
            const found = availableCats.find((c) => getCategoryOrderIndex(c) === i);
            if (found) return found;
          }
          return null;
        }

        const categories = Array.from(new Set(allWords.map((w) => sanitizeCategory(w.category)).filter(Boolean)))
          .sort((a, b) => {
            const diff = getCategoryOrderIndex(a) - getCategoryOrderIndex(b);
            if (diff !== 0) return diff;
            return a.localeCompare(b);
          });
        let selectedCategory = userSettings.category || 'Elementary';
        if (selectedCategory === 'All' || selectedCategory === 'Все категории') {
          selectedCategory = 'Elementary';
          userSettings.category = 'Elementary';
          saveUserSettings(userSettings);
        }

        let categoryWords = allWords;
        if (selectedCategory && selectedCategory !== 'All' && selectedCategory !== 'Все категории') {
          const filtered = allWords.filter(
            (w) => sanitizeCategory(w.category) === sanitizeCategory(selectedCategory)
          );
          if (filtered.length > 0) {
            categoryWords = filtered;
          }
        }
        categoryWords.sort((a, b) => (Number(b.zipf) || 0) - (Number(a.zipf) || 0));

        let userProgress = getUserProgress();
        const favList = getUserFavorites();
        const favSet = new Set(favList.map(String));
        favoriteIds = favSet;

        // Check if practicing favorites mode is active
        const isFavPracticeActive = Boolean(favoritePracticeWords && favoritePracticeWords.length > 0);
        let currentMethod = isFavPracticeActive
          ? (favoritePracticeMethod || 'cards')
          : (userSettings.preferredMethod || 'cards');
        currentTrainingMethod = (!isFavPracticeActive && window._showHubScreen) ? null : currentMethod;
        if (isFavPracticeActive) {
          categoryWords = favoritePracticeWords;
        }

        const dailyGoal = Number(userSettings.dailyGoal) || 10;
        const totalLearningWords = categoryWords.filter((w) => isWordLearning(userProgress[w.id]));
        const learningCount = totalLearningWords.length;

        const favListForMixing = isFavPracticeActive ? [] : favList;

        // When practicing collections, NEVER call getQueueForCards/Quiz/Pairs/Test with collection words!
        // Doing so would corrupt the persistent conveyor batch (conveyor_batch_*) in localStorage.
        const cardsQueue = isFavPracticeActive ? favoritePracticeWords : getQueueForCards(categoryWords, userProgress, favList);
        const quizQueue = isFavPracticeActive ? favoritePracticeWords : getQueueForQuiz(categoryWords, userProgress, favList);
        const pairsQueue = isFavPracticeActive ? favoritePracticeWords : getQueueForPairs(categoryWords, userProgress, favList);
        const testQueue = isFavPracticeActive ? favoritePracticeWords : getQueueForTest(categoryWords, userProgress, favList);

        function isMethodAvailable(method) {
          if (method === 'cards') return !isFavPracticeActive && cardsQueue.length > 0;
          if (method === 'quiz') return quizQueue.length > 0;
          if (method === 'pairs') return pairsQueue.length > 0;
          if (method === 'input') return testQueue.length > 0;
          return false;
        }

        // SMART ACTIVE MODE RESOLUTION:
        // Automatically advance along the training conveyor: Cards -> Quiz -> Pairs -> Test.
        // If window._showHubScreen is true or round is finished, show the clean Hub screen.
        if (!isFavPracticeActive) {
          if (window._showHubScreen) {
            currentMethod = 'input';
          } else if (!isMethodAvailable(currentMethod)) {
            const prevMethod = currentMethod;
            // STRICT FORWARD-ONLY CONVEYOR PROGRESSION:
            // Cards -> Quiz -> Pairs -> Test -> Finished (Hub)
            if (currentMethod === 'cards') {
              if (quizQueue.length > 0) currentMethod = 'quiz';
              else if (pairsQueue.length > 0) currentMethod = 'pairs';
              else if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            } else if (currentMethod === 'quiz') {
              if (pairsQueue.length > 0) currentMethod = 'pairs';
              else if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            } else if (currentMethod === 'pairs') {
              // After Pairs, STRICTLY proceed ONLY to Test! Never regress to Quiz or Cards!
              if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            } else if (currentMethod === 'input') {
              if (testQueue.length === 0) {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            }
            if (currentMethod !== prevMethod) {
              currentWordIndex = 0;
            }
          }

          // Keep userSettings.preferredMethod strictly synchronized with the current active conveyor mode
          // (Never overwrite preferredMethod with 'input' when merely displaying the Hub screen)
          if (!window._showHubScreen && userSettings.preferredMethod !== currentMethod) {
            userSettings.preferredMethod = currentMethod;
            saveUserSettings(userSettings);
          }
          if (!window._showHubScreen) {
            currentTrainingMethod = currentMethod;
          }
        }

        // Filter words strictly based on the active training method queue
        let activeWords = [];
        if (window._showHubScreen && !isFavPracticeActive) {
          // Hub choice screen requested: force empty activeWords to display Hub options!
          activeWords = [];
          currentMethod = 'input';
        } else if (isFavPracticeActive) {
          activeWords = favoritePracticeWords;
        } else if (currentMethod === 'cards') {
          activeWords = getQueueForCards(categoryWords, userProgress);
        } else if (currentMethod === 'quiz') {
          activeWords = quizQueue;
        } else if (currentMethod === 'pairs') {
          activeWords = pairsQueue;
        } else if (currentMethod === 'input') {
          // Exactly the full batch of 20 words for Test
          activeWords = testQueue;

        // Check if all words in category are mastered (3x in Test) — Favorites practice is exempt (can be repeated infinitely)
        const unmasteredCount = categoryWords.filter((w) => !isWordMastered(userProgress[w.id])).length;
        if (!window._showHubScreen && !isFavPracticeActive && unmasteredCount === 0 && categoryWords.length > 0) {

                  const px = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                  const py = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

                  const tiltY = (px - 0.5) * 14;
                  const tiltX = (0.5 - py) * 10;

                  tiltContainer.style.setProperty('--tiltY', `${tiltY.toFixed(2)}deg`);
                  tiltContainer.style.setProperty('--glare-x', `${(px * 100).toFixed(1)}%`);
                  tiltContainer.style.setProperty('--glare-y', `${(py * 100).toFixed(1)}%`);
                };

                const resetCardTilt = () => {
                  tiltContainer.style.setProperty('--tiltX', '0deg');
                  tiltContainer.style.setProperty('--tiltY', '0deg');
                  tiltContainer.style.setProperty('--glare-x', '50%');
                  tiltContainer.style.setProperty('--glare-y', '20%');
                  tiltContainer.classList.remove('is-hovering');

                tiltContainer.addEventListener('mouseleave', resetCardTilt);

                tiltContainer.addEventListener('touchstart', () => tiltContainer.classList.add('is-hovering'), { passive: true });

                  if (e.touches && e.touches.length) handleCardMove(e.touches[0].clientX, e.touches[0].clientY);

              if (canPlayDailyVideo) {
                if (cardVideo) {
                  resolveVideoUrl(currentWotdVideo).then((url) => {
                    if (url && cardVideo.src !== url && !cardVideo.src.endsWith(url)) {
                      cardVideo.src = url;
                    }
                    cardVideo.load();
                  }).catch(() => { if (cardVideo) cardVideo.load(); });
                }
                if (cardVideoWhat && isMemeActive) cardVideoWhat.load();
              }

              let memeTimeout = null;

              flashcard.addEventListener('click', (e) => {
                if (e.target.closest('.card-fav') || e.target.closest('#wotd-fav-front') || e.target.closest('#wotd-fav-back')) {
                  return;
                }

                isFlipped = !isFlipped;
                flashcard.classList.toggle('is-flipped', isFlipped);

                if (isFlipped) {
                  // Only launch cat video if user hasn't watched today's video yet (or trial meme active)!
                  const todayKey = getDailyVideoDateKey();
                  const canPlayToday = (localStorage.getItem('myduo_wotd_video_last_date') !== todayKey) || isMemeActive;

                  if (canPlayToday && !videoStarted && cardVideo && videoContainer) {
                    videoStarted = true;
                    if (!isTrialMeme && !isWeeklyMemePending) {
                      localStorage.setItem('myduo_wotd_video_last_date', todayKey);
                    }

                    const hintEl = flashcard.querySelector('#wotd-card-hint');
                    if (hintEl) hintEl.textContent = 'TOUCH TO FLIP BACK';

                    if (isMemeActive) {
                      currentWotdVideo = 'meme_monday_look.mp4';
                      cardVideo.src = 'assets/video/meme_monday_look.mp4';
                    } else {
                      let currentIdx = parseInt(localStorage.getItem('myduo_wotd_video_idx') || '0', 10);
                      if (isNaN(currentIdx) || currentIdx < 0) currentIdx = 0;
                      localStorage.setItem('myduo_wotd_video_idx', String((currentIdx + 1) % wotdPlaylist.length));
                      resolveVideoUrl(currentWotdVideo).then((url) => {
                        if (url && cardVideo.src !== url && !cardVideo.src.endsWith(url)) {
                          cardVideo.src = url;
                        }
                      }).catch(() => {});
                      preloadNextWotdVideo();
                    }

                    if (window.trackEvent) {
                      window.trackEvent('cat_video_started', {
                        video_name: currentWotdVideo,
                        round_word: wotd ? wotd.word : ''
                      });
                    }

                    let isVideoRevealed = false;
                    const flipStartTime = Date.now();
                    const revealVideo = () => {
                      if (isVideoRevealed || !isFlipped) return;
                      const elapsed = Date.now() - flipStartTime;
                      const waitRemaining = Math.max(0, 950 - elapsed);
                      setTimeout(() => {
                        if (isVideoRevealed || !isFlipped) return;
                        isVideoRevealed = true;
                        videoContainer.style.display = 'block';
                        requestAnimationFrame(() => {
                          videoContainer.style.opacity = '1';
                        });
                      }, waitRemaining);
                    };

                    const dismissVideo = () => {
                      videoContainer.style.opacity = '0';
                      setTimeout(() => {
                        const v1Ended = !cardVideo || cardVideo.ended || cardVideo.paused;
                        const v2Ended = !cardVideoWhat || cardVideoWhat.ended || cardVideoWhat.paused;
                        if (!isFlipped || (v1Ended && v2Ended)) {
                          videoContainer.style.display = 'none';
                          if (cardVideoWhat) cardVideoWhat.style.display = 'none';
                        }
                      }, 350);
                    };

                    const top4Cut = document.getElementById('wotd-top4-cut');
                    if (isMemeActive && top4Cut) {
                      lazyMod('./components/leaderboard/LeaderboardView.js?v=423.0')
                        .then(({ renderMondayMemeTop4Cut }) => renderMondayMemeTop4Cut(top4Cut, completedWeekKey))
                        .catch(() => {});
                    }

                    // Reveal video strictly when first real frame starts playing (prevents black screen!)
                    cardVideo.addEventListener('playing', revealVideo, { once: true });
                    cardVideo.addEventListener('timeupdate', () => {
                      if (cardVideo.currentTime > 0.05) revealVideo();
                    }, { once: true });

                    if (isMemeActive) {
                      // STEP 1: Video 1 (Cat looks at screen)
                      cardVideo.addEventListener('ended', () => {
                        if (!isFlipped) return;

                        // STEP 2: Show Top 4 Leaders screen cut for 1.8 seconds
                        cardVideo.style.display = 'none';
                        if (top4Cut) {
                          lazyMod('./components/leaderboard/LeaderboardView.js?v=423.0')
                            .then(({ renderMondayMemeTop4Cut }) => renderMondayMemeTop4Cut(top4Cut, completedWeekKey))
                            .catch(() => {});
                          top4Cut.style.display = 'flex';
                        }

                        memeTimeout = setTimeout(() => {
                          memeTimeout = null;
                          if (!isFlipped) return;

                          // STEP 3: Cat screams "WHAT?!"
                          const targetVideo2 = cardVideoWhat || cardVideo;
                          targetVideo2.style.display = 'block';
                          targetVideo2.muted = false;
                          targetVideo2.volume = 1.0;

                          let hasRevealedVideo2 = false;
                          const revealVideo2 = () => {
                            if (hasRevealedVideo2) return;
                            hasRevealedVideo2 = true;
                            if (top4Cut) top4Cut.style.display = 'none';
                          };

                          // Seamlessly transition: hide Top 4 cut ONLY after Video 2 is actually painting frames
                          targetVideo2.addEventListener('playing', revealVideo2, { once: true });
                          targetVideo2.addEventListener('timeupdate', () => {
                            if (targetVideo2.currentTime > 0.04) revealVideo2();
                          }, { once: true });

                          // Safety fallback so cut is never stuck
                          setTimeout(revealVideo2, 350);

                          const play2 = targetVideo2.play();
                          if (play2 !== undefined) {
                            play2.then(() => {
                              setTimeout(revealVideo2, 60);
                            }).catch((err) => {
                              console.warn('Video 2 audio autoplay restricted, falling back to muted:', err);
                              targetVideo2.muted = true;
                              targetVideo2.play().then(() => {
                                setTimeout(revealVideo2, 60);
                              }).catch(() => revealVideo2());
                            });
                          }

                          targetVideo2.addEventListener('ended', () => {
                            dismissVideo();
                            localStorage.setItem(memeSeenKey, '1');
                            localStorage.setItem('myduo_wotd_video_last_date', todayKey);
                            localStorage.removeItem('myduo_trial_monday_meme');
                            if (window.trackEvent) {
                              window.trackEvent('cat_video_completed', {
                                video_name: 'meme_monday_sequence'
                              });
                            }
                          }, { once: true });
                        }, 1800);
                      }, { once: true });
                    } else {
                      cardVideo.addEventListener('ended', () => {
                        dismissVideo();
                        if (window.trackEvent) {
                          window.trackEvent('cat_video_completed', {
                            video_name: currentWotdVideo
                          });
                        }
                      }, { once: true });
                    }

                    cardVideo.addEventListener('error', () => {
                      dismissVideo();
                    }, { once: true });

                    // Watchdog: give mobile network 8s to buffer before falling back to translation
                    setTimeout(() => {
                      if (!isVideoRevealed) {
                        dismissVideo();
                      }
                    }, 8000);

                    cardVideo.muted = false;
                    cardVideo.volume = 1.0;

                    const playPromise = cardVideo.play();
                    if (playPromise !== undefined) {
                      playPromise.catch((err) => {
                        console.warn('Playback with sound prevented by browser policy, falling back to muted autoplay:', err);
                        cardVideo.muted = true;
                        cardVideo.play().catch((e) => {
                          console.error('Video play error:', e);
                          dismissVideo();
                        });
                      });
                    }
                  }
                } else {
                  if (memeTimeout) {
                    clearTimeout(memeTimeout);
                    memeTimeout = null;
                  }
                  const top4Cut = document.getElementById('wotd-top4-cut');
                  if (top4Cut) {
                    top4Cut.style.display = 'none';
                  }
                  if (cardVideo && !cardVideo.paused) {
                    cardVideo.pause();
                  }
                  if (cardVideoWhat && !cardVideoWhat.paused) {
                    cardVideoWhat.pause();
                  }
                  if (cardVideoWhat) {
                    cardVideoWhat.style.display = 'none';
                  }
                  if (videoContainer) {
                    videoContainer.style.opacity = '0';
                    videoContainer.style.display = 'none';
                  }
                  speakWord(wotd.word);
                }
              });

              const speakButtons = content.querySelectorAll('#wotd-sound-front, #wotd-sound-back');
              speakButtons.forEach((btn) => {
                btn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  speakWord(wotd.word);
                });
              });

              const favButtons = content.querySelectorAll('#wotd-fav-front, #wotd-fav-back');
              favButtons.forEach((btn) => {
                const handleQuickToggle = async () => {
                  isWotdFav = !favoriteIds.has(String(wotd.id));
                  if (window.trackEvent) {
                    window.trackEvent('wotd_favorite_toggle', { word: wotd ? wotd.word : '', active: isWotdFav });
                  }
                  favButtons.forEach((b) => {
                    b.classList.toggle('is-active', isWotdFav);
                    b.classList.toggle('is-off', !isWotdFav);
                  });
                  await toggleFavoriteApi(wotd.id, isWotdFav);
                  handleFavoriteToggle(wotd.id, isWotdFav);
                };
                btn.addEventListener('click', handleQuickToggle);
              });
            }
          }

          function renderCategorySelectorScreen() {
            if (typeof window._openGrammarHubScreen === 'function') {
              window._openGrammarHubScreen();
            }
          }

          const continueCardsBtn = content.querySelector('#go-continue-cards-btn');
          if (continueCardsBtn) {
            continueCardsBtn.addEventListener('click', () => {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._activePracticeCollectionId = null;
              window._activePracticeCollectionTitle = null;
              window._showHubScreen = false;
              window._trainingRoundJustCompleted = false;

              // Ensure batch is active or initialize fresh batch
              getActiveConveyorBatch(categoryWords, getUserProgress(), favList);
              const curCards = getQueueForCards(categoryWords, getUserProgress(), favList);
              const curQuiz = getQueueForQuiz(categoryWords, getUserProgress(), favList);
              const curPairs = getQueueForPairs(categoryWords, getUserProgress(), favList);
              const curTest = getQueueForTest(categoryWords, getUserProgress(), favList);

              const paused = window._pausedRoundState;
              const queueByMethod = { cards: curCards, quiz: curQuiz, pairs: curPairs, input: curTest };

              if (paused && paused.category === selectedCategory && queueByMethod[paused.method] && queueByMethod[paused.method].length > 0) {
                userSettings.preferredMethod = paused.method;
                currentWordIndex = Math.min(paused.wordIndex || 0, Math.max(0, queueByMethod[paused.method].length - 1));
              } else if (curCards.length > 0) {
                userSettings.preferredMethod = 'cards';
                currentWordIndex = 0;
              } else if (curQuiz.length > 0) {
                userSettings.preferredMethod = 'quiz';
                currentWordIndex = 0;
              } else if (curPairs.length > 0) {
                userSettings.preferredMethod = 'pairs';
                currentWordIndex = 0;
              } else if (curTest.length > 0) {
                userSettings.preferredMethod = 'input';
                currentWordIndex = 0;
              } else {
                // If all queues are empty, clear and create fresh batch to start with cards
                clearActiveConveyorBatch();
                window._pausedRoundState = null;
                getActiveConveyorBatch(categoryWords, getUserProgress(), favList);
                userSettings.preferredMethod = 'cards';
                currentWordIndex = 0;
              }

              saveUserSettings(userSettings);
              renderTrainingTab();
            });
          }

          const goBtn = content.querySelector('#go-next-mode-btn');
          if (goBtn) {
            goBtn.addEventListener('click', async () => {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._activePracticeCollectionId = null;
              window._activePracticeCollectionTitle = null;
              if (nextMode === 'select_category') {
                renderCategorySelectorScreen();
                return;
              }
              window._showHubScreen = false;
              if (nextMode === 'cards') {
                window._explicitCardsOpened = true;
              } else {
                window._explicitCardsOpened = false;
              }
              window._trainingRoundJustCompleted = false;
              userSettings.preferredMethod = nextMode;
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }

          const repeatFavsBtn = content.querySelector('#go-repeat-favs-btn');
          if (repeatFavsBtn) {
            repeatFavsBtn.addEventListener('click', () => {
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              const tabBtn = document.querySelector('.nav-tab[data-tab="favorites"]');
              if (tabBtn) {
                tabBtn.click();
              } else {
                renderTab('favorites');
              }
            });
          }
          return;
        }

        let trainEl = content.querySelector('#training');
        if (!trainEl) {
          content.innerHTML = '<div id="training"></div>';
        }
        // Calculate remaining unfinished words in this round to detect if second word exists
        const unfinishedInQueue = activeWords.filter((w) => {
          const p = userProgress[w.id] || userProgress[String(w.id)];
          if (!p) return true;
          if (currentMethod === 'quiz') return (p.quizCorrect || 0) < 4 && !p.roundQuizDone && !isWordMastered(p);
          if (currentMethod === 'pairs') return (p.pairsCorrect || 0) < 1 && !p.roundPairsDone;
          if (currentMethod === 'input') return ((p.inputCorrect || 0) < 1 || p.needsTestRepeat) && !p.roundTestDone && !isWordMastered(p);
          return true;
        });
        const isSingleRemainingWord =
          unfinishedInQueue.length <= 1 ||
          (currentMethod === 'input' && testQueue.length <= 1) ||
          (currentMethod === 'quiz' && quizQueue.length <= 1);

        const getBlocksWordsForInput = (progMap) => {
          if (currentMethod !== 'input') return [];
          const list = isFavPracticeActive
            ? activeWords.filter((w) => {
                const p = progMap[w.id] || progMap[String(w.id)];
                return Boolean(
                  p &&
                    ((p.roundQuizMistakes || 0) > 0 ||
                      (p.roundPairsMistakes || 0) > 0 ||
                      (p.roundInputMistakes || 0) > 0) &&
                    p.roundBlocksDone !== true,
                );
              })
            : activeWords.filter((w) => isWordProblematicForBlocks(w, progMap[w.id] || progMap[String(w.id)]));

          if (window._priorityBlocksWordId != null) {
            const pIdx = list.findIndex((w) => String(w.id) === String(window._priorityBlocksWordId));
            if (pIdx > 0) {
              const [priorityWord] = list.splice(pIdx, 1);
              list.unshift(priorityWord);
            }
          }
          return list;
        };

        if (isFavPracticeActive && currentWordIndex >= activeWords.length) {
          if (window.__favsAutoplayRunning) {
            // Endless loop mode for background player: wrap to first word and continue
            currentWordIndex = 0;
            renderTrainingTab();
            return;
          }
          if (currentMethod === 'cards') {
            favoritePracticeMethod = 'quiz';
            currentWordIndex = 0;
            renderTrainingTab();
            return;
          }
          if (currentMethod === 'quiz') {
            const favQuizOrder = (typeof isSfxMuted === 'function' && isSfxMuted()) ? [0, 2, 3] : [0, 1, 2, 3];
            const nextPassIdx = (window._favQuizPassIndex || 0) + 1;
            if (nextPassIdx < favQuizOrder.length) {
              window._favQuizPassIndex = nextPassIdx;
              currentWordIndex = 0;
              renderTrainingTab();
              return;
            }
            window._favQuizPassIndex = 0;
            favoritePracticeMethod = 'pairs';
            currentWordIndex = 0;
            renderTrainingTab();
            return;
          }
          if (currentMethod === 'pairs') {
            favoritePracticeMethod = 'input';
            currentWordIndex = 0;
            renderTrainingTab();
            return;
          }
          if (currentMethod === 'input' && getBlocksWordsForInput(userProgress).length === 0) {
            const freshProgMap = getUserProgress() || {};
            const remainingUnmastered = activeWords.filter((w) => {
              if (!w || w.id == null) return false;
              const p = freshProgMap[w.id] || freshProgMap[String(w.id)];
              return !isWordMastered(p);
            });
            if (remainingUnmastered.length > 0 && (window._favTestRetryGuard || 0) < 3) {
              window._favTestRetryGuard = (window._favTestRetryGuard || 0) + 1;
              favoritePracticeWords = remainingUnmastered;
              currentWordIndex = 0;
              renderTrainingTab();
              return;
            }
            try {
              const finishedColId = window._activePracticeCollectionId;
              const fullColWords = Array.isArray(window._favFullCollectionWords) && window._favFullCollectionWords.length > 0
                ? window._favFullCollectionWords
                : (Array.isArray(window._favOriginalPracticeWords) && window._favOriginalPracticeWords.length > 0
                  ? window._favOriginalPracticeWords
                  : activeWords);
              const allOrigMastered = fullColWords.length > 0 && fullColWords.every((w) => {
                const p = freshProgMap[w.id] || freshProgMap[String(w.id)];
                return isWordMastered(p);
              });
              if (finishedColId && allOrigMastered) {
                const rawDone = localStorage.getItem('myduo_completed_collections');
                const parsedDone = rawDone ? JSON.parse(rawDone) : [];
                const doneSet = new Set(Array.isArray(parsedDone) ? parsedDone.map(String) : []);
                doneSet.add(String(finishedColId));
                localStorage.setItem('myduo_completed_collections', JSON.stringify([...doneSet]));

                // Also mark Grammar Reference group done (e.g. gref_conjunctions_coordinating -> conjunctions:coordinating)
                const grefMatch = /^gref_(prepositions|pronouns|conjunctions)_(.+)$/.exec(String(finishedColId));
                if (grefMatch) {
                  const grefKey = `${grefMatch[1]}:${grefMatch[2]}`;
                  const rawGref = localStorage.getItem('myduo_grammar_ref_done');
                  const parsedGref = rawGref ? JSON.parse(rawGref) : [];
                  const grefSet = new Set(Array.isArray(parsedGref) ? parsedGref.map(String) : []);
                  grefSet.add(grefKey);
                  localStorage.setItem('myduo_grammar_ref_done', JSON.stringify([...grefSet]));
                }
              }
            } catch (_) {}
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            playFanfareSound();
            if (window._favPracticeCompletedNonCardWord) {
              window._favPracticeCompletedNonCardWord = false;
            }
            favoritePracticeWords = null;
            favoritePracticeMethod = 'cards';
            window._favQuizPassIndex = 0;
            window._favTestRetryGuard = 0;
            window._favOriginalPracticeWords = null;
            window._favFullCollectionWords = null;
            window._activePracticeCollectionId = null;
            window._activePracticeCollectionTitle = null;
            currentWordIndex = 0;
            activeTab = 'favorites';
            window._activeTab = 'favorites';
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'favorites'));
            const wasSmartPathReturn = Boolean(window._returnToSmartPath);
            if (typeof hasNavReturn === 'function' && hasNavReturn()) {
              popNavReturn();
            } else if (wasSmartPathReturn) {
              window._returnToSmartPath = false;
              window._showHubScreen = true;
              activeTab = 'training';
              window._activeTab = 'training';
              tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'training'));
              renderTrainingTab();
              setTimeout(() => {
                try { window._openSmartPathModal?.(); } catch (_) {}
              }, 80);
            } else {
              renderTab('favorites', true);
            }
            if (!wasSmartPathReturn) {
              setTimeout(() => {
                try {
                  if (typeof window._checkCefrMilestoneNudge === 'function') {
                    window._checkCefrMilestoneNudge();
                  }
                } catch (_) {}
              }, 450);
            }
            return;
          }
        }

        if (!isFavPracticeActive && currentMethod === 'input' && currentWordIndex >= activeWords.length) {
          if (testQueue.length === 0 || unfinishedInQueue.length === 0) {
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            const shouldReopenSmartPath = Boolean(window._returnToSmartPath);
            window._returnToSmartPath = false;
            window._trainingRoundJustCompleted = true;
            window._showHubScreen = true;
            currentWordIndex = 0;
            renderTrainingTab();
            if (shouldReopenSmartPath) {
              setTimeout(() => {
                try { window._openSmartPathModal?.(); } catch (_) {}
              }, 120);
            }
            return;
          } else {
            currentWordIndex = 0;
          }
        }

        if (!isFavPracticeActive && currentMethod === 'quiz' && currentWordIndex >= activeWords.length) {
          if (quizQueue.length === 0 || unfinishedInQueue.length === 0) {
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            window._trainingRoundJustCompleted = false;
            window._showHubScreen = false;
            currentWordIndex = 0;
            renderTrainingTab();
            return;
          } else {
            currentWordIndex = 0;
          }
        }

        const problemWordsForBlocks = getBlocksWordsForInput(userProgress);

        const isBlocksStage = currentMethod === 'input' && problemWordsForBlocks.length > 0;
        if (isBlocksStage) {
          if (!window._totalBlocksForRound || window._totalBlocksForRound < problemWordsForBlocks.length) {
            window._totalBlocksForRound = problemWordsForBlocks.length;
          }
        } else if (currentMethod !== 'input') {
          window._totalBlocksForRound = null;
        }

        const totalBlocksCount = window._totalBlocksForRound || problemWordsForBlocks.length;
        const blocksIndex = Math.max(0, totalBlocksCount - problemWordsForBlocks.length);
        const currentBlocksWord = isBlocksStage ? problemWordsForBlocks[0] : null;

        const currentWord = currentBlocksWord || activeWords[currentWordIndex % activeWords.length];

        const isFav =
          Boolean(currentWord) &&
          (favSet.has(String(currentWord.id)) ||
            (currentWord.word && favSet.has(String(currentWord.word).toLowerCase().trim())));

        const availableModes = isFavPracticeActive
          ? { cards: true, quiz: true, pairs: true, input: true }
          : {
              cards: currentMethod === 'cards',
              quiz: currentMethod === 'quiz',
              pairs: currentMethod === 'pairs',
              input: currentMethod === 'input',
            };

        if (!window._showHubScreen && !isFavPracticeActive) {
          window._pausedRoundState = {
            category: selectedCategory,
            method: currentMethod,
            wordIndex: currentWordIndex,
          };
        }

        renderTrainingCard(currentWord, allWords, {
          currentMethod,
          selectedCategory,
          categories,
          activeWords,
          currentWordIndex,
          isLastWord: currentWordIndex >= activeWords.length - 1 || isSingleRemainingWord,
          isSingleRemaining: isSingleRemainingWord,
          learningCount,
          dailyGoal,
          availableModes,
          isFavPractice: isFavPracticeActive,
          favQuizStage: (isFavPracticeActive && currentMethod === 'quiz')
            ? (((typeof isSfxMuted === 'function' && isSfxMuted()) ? [0, 2, 3] : [0, 1, 2, 3])[Math.min(window._favQuizPassIndex || 0, ((typeof isSfxMuted === 'function' && isSfxMuted()) ? 2 : 3))])
            : null,
          favCollectionTitle: isFavPracticeActive ? (window._activePracticeCollectionTitle || getCollectionTitle(getActiveCollectionId())) : '',
          isBlocksMode: isBlocksStage,
          blocksWord: currentBlocksWord,
          blocksIndex,
          totalBlocksCount,
          onBlocksWordSolved: async (solvedWord) => {
            if (window._priorityBlocksWordId != null && String(window._priorityBlocksWordId) === String(solvedWord.id)) {
              window._priorityBlocksWordId = null;
            }
            try {
              await saveProgress(solvedWord.id, true, 'blocks', { isFavPractice: isFavPracticeActive });
            } catch (err) {
              console.error('Failed to save blocks progress:', err);
            }
            userProgress = getUserProgress();
            const remaining = getBlocksWordsForInput(userProgress);
            if (remaining.length === 0) {
              window._totalBlocksForRound = null;
              if (!isFavPracticeActive && currentWordIndex >= activeWords.length) {
                currentWordIndex = 0;
              }
            }
            renderTrainingTab();
          },
          onCategoryBadgeClick: () => {
            renderCategorySelectorScreen();
          },
          onMethodChange: (newMethod) => {
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            window.__favsAutoplayRunning = false;
            releaseScreenWakeLock();
            stopNativeBackgroundPlayback();
            if (window.__favsAutoplayTimer) clearTimeout(window.__favsAutoplayTimer);
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
              try { window.speechSynthesis.cancel(); } catch (e) {}
            }
            if (window.trackScreen) {
              window.trackScreen('training_' + newMethod, 'TrainingMode');
            }
            if (window.trackEvent) {
              window.trackEvent('training_mode_select', { mode: newMethod });
            }
            if (isFavPracticeActive) {
              favoritePracticeMethod = newMethod;
              if (newMethod === 'quiz') window._favQuizPassIndex = 0;
              if (newMethod === 'input') window._favTestRetryGuard = 0;
            } else {
              userSettings.preferredMethod = newMethod;
              saveUserSettings(userSettings);
            }
            currentWordIndex = 0;
            renderTrainingTab();
          },
          onCategoryChange: (newCategory) => {
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            window.__favsAutoplayRunning = false;
            releaseScreenWakeLock();
            stopNativeBackgroundPlayback();
            if (window.__favsAutoplayTimer) clearTimeout(window.__favsAutoplayTimer);
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {

            }
            favoritePracticeWords = null;
            favoritePracticeMethod = 'cards';
            clearActiveConveyorBatch();
            window._pausedRoundState = null;
            userSettings.category = newCategory;
            saveUserSettings(userSettings);
            currentWordIndex = 0;
            renderTrainingTab();
          },
          isFavorite: isFav,
          onFavoriteToggle: handleFavoriteToggle,
          canGoPrev: currentWordIndex > 0,
          onPrev: () => {
            if (currentWordIndex > 0) {
              currentWordIndex -= 1;
              renderTrainingTab();
            }

          onNext: (opts = {}) => {
            incrementGuestTrainingCount();
            incrementWebTrainedCount();

            if (isWeb100WordsLimitReached()) {

              renderTrainingTab();

            if (isFavPracticeActive && currentMethod !== 'cards') {

            if (window.trackEvent) {
              window.trackEvent('word_studied', {
                method: currentMethod,
                is_favorite_practice: Boolean(isFavPracticeActive),
              });
            }

            if (!(opts && opts.repeatSoon) && currentMethod === 'input' && (isSingleRemainingWord || unfinishedInQueue.length <= 1)) {
              window._trainingRoundJustCompleted = true;
            }

            if (opts && opts.repeatSoon) {
              // Re-insert hard word 3 positions later so the user repeats it soon in this session
              const insertPos = Math.min(currentWordIndex + 3, activeWords.length);
              activeWords.splice(insertPos, 0, currentWord);
            }

            if (currentMethod === 'cards' && !isFavPracticeActive) {
              currentWordIndex = 0;
            } else if (currentMethod === 'pairs' && !isFavPracticeActive) {
              currentWordIndex = 0;
            } else if (currentMethod === 'pairs' && isFavPracticeActive) {
              currentWordIndex += 5;
            } else {
              currentWordIndex += 1;
            }

            recordMilestoneProgressIfNeeded();

            renderTrainingTab();
          },
        });

      async function startPracticeHandler(practiceWords, colId = null, colTitle = null) {
        window._explicitCardsOpened = true;
        window._trainingRoundJustCompleted = false;
        window._showHubScreen = false;
        window._isInsideCollectionCards = false;
        window._currentOpenCollectionId = null;

        const targetId = colId || 'my_favorites';
        window._activePracticeCollectionId = targetId;
        window._activePracticeCollectionTitle = colTitle || getCollectionTitle(targetId);
        window._favPracticeCompletedNonCardWord = false;

        const rawPracticeList = (practiceWords && practiceWords.length > 0)
          ? practiceWords
          : getCollectionWords(targetId, allWords);

        // Split large collections / grammar groups into digestible 10-word batches (unmastered first)
        const FAV_BATCH_SIZE = 10;
        let practiceList = rawPracticeList;
        if (Array.isArray(rawPracticeList) && rawPracticeList.length > FAV_BATCH_SIZE) {
          const progMapForBatch = getUserProgress() || {};
          const unmastered = rawPracticeList.filter((w) => {
            if (!w || w.id == null) return true;
            const p = progMapForBatch[w.id] || progMapForBatch[String(w.id)];
            return !isWordMastered(p);
          });
          if (unmastered.length > 0) {
            practiceList = unmastered.slice(0, FAV_BATCH_SIZE);
          } else {
            // All words mastered: rotate 10-word review batches per collection
            const rotMap = window._favReviewBatchOffsets || (window._favReviewBatchOffsets = {});
            const offset = Number(rotMap[targetId] || 0) % rawPracticeList.length;
            const rotated = [...rawPracticeList.slice(offset), ...rawPracticeList.slice(0, offset)];
            practiceList = rotated.slice(0, FAV_BATCH_SIZE);
            rotMap[targetId] = (offset + FAV_BATCH_SIZE) % rawPracticeList.length;
          }
        }

        if (practiceList && practiceList.length > 0) {
          try {
            const progKey = `progress_${getEffectiveUserId()}`;
            const progMap = getUserProgress();
            let progChanged = false;
            practiceList.forEach((w) => {
              const wid = w && w.id != null ? String(w.id) : null;
              const p = wid ? (progMap[w.id] || progMap[wid]) : null;
              if (p) {
                p.roundQuizMistakes = 0;
                p.roundPairsMistakes = 0;
                p.roundInputMistakes = 0;
                p.roundBlocksDone = false;
                p.needsTestRepeat = false;
                progChanged = true;
              }
            });
            if (progChanged) {
              localStorage.setItem(progKey, JSON.stringify(progMap));
            }
          } catch (e) {}
          favoritePracticeWords = [...practiceList];
          window._favOriginalPracticeWords = [...practiceList];
          window._favFullCollectionWords = [...rawPracticeList];
          window._favQuizPassIndex = 0;
          window._favTestRetryGuard = 0;
          favoritePracticeMethod = 'cards';
        } else {
          favoritePracticeWords = null;
          window._favFullCollectionWords = null;
          favoritePracticeMethod = 'cards';
        }
        currentWordIndex = 0;

        if (window.trackEvent) {
          window.trackEvent('collection_practice_start', {
            collection_id: targetId,
            words_count: practiceList ? practiceList.length : 0,
          });
        }

        activeTab = 'training';
        window._activeTab = 'training';
        const tabs = document.querySelectorAll('.nav-tab');
        tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'training'));
        await renderTab('training', true);
      }

        if (isLbOpen && direction === 'left') {
          if (typeof window.closeLeaderboardDrawer === 'function') {
            window.closeLeaderboardDrawer();

        if (isBurgerOpen && direction === 'right') {

        let isUnderCard = false;
        if (wotdCard) {
          const rect = wotdCard.getBoundingClientRect();
          isUnderCard = (startY >= rect.top + (rect.height * 0.45));
        } else {
          isUnderCard = (startY >= 80);
        }

        if (!isUnderCard) return;

        if (direction === 'left') {
          if (typeof window.openDrawer === 'function') {
            window.openDrawer();
          }
        } else if (direction === 'right') {

        const elapsed = Date.now() - _touchStartTime;
        const absX = Math.abs(deltaX);
        const absY = Math.abs(deltaY);

        const burgerDrawer = document.querySelector('#burger-drawer');
