    const LANG_NAMES = {"ar":"العربية","bn":"বাংলা","bg":"Български","zh":"中文","hr":"Hrvatski","cs":"Čeština","da":"Dansk","en":"English","et":"Eesti","fi":"Suomi","fr":"Français","de":"Deutsch","el":"Ελληνικά","hi":"हिन्दी","hu":"Magyar","id":"Bahasa Indonesia","it":"Italiano","ja":"日本語","kk":"Қазақша","ko":"한국어","lv":"Latviešu","lt":"Lietuvių","fa":"فارسی","pl":"Polski","pt":"Português","ro":"Română","ru":"Русский","sk":"Slovenčina","sl":"Slovenščina","es":"Español","sv":"Svenska","th":"ไทย","tr":"Türkçe","uk":"Українська","ur":"اردو","vi":"Tiếng Việt"};

    function initLangSelect() {
      const select = document.getElementById('langSelect');
      select.innerHTML = '';
      for (const [code, name] of Object.entries(LANG_NAMES)) {
        if (TERMS_DATA[code]) {
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = name;
          select.appendChild(opt);
        }
      }
      const rawLang = (localStorage.getItem('myduo_interface_lang') || localStorage.getItem('terms_lang') || navigator.language || 'en').slice(0, 2).toLowerCase();
      const initialLang = TERMS_DATA[rawLang] ? rawLang : 'en';
      select.value = initialLang;
      render(initialLang);
    }

    function render(lang) {
      const data = TERMS_DATA[lang] || TERMS_DATA.en;
      const content = document.getElementById('content');
      const isRtl = lang === 'ar' || lang === 'fa' || lang === 'ur';
      content.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
      document.documentElement.lang = lang;

      let html = '<h2>' + data.title + '</h2>';
      html += '<div class="updated">' + data.updated + '</div>';
      html += '<p>' + data.intro + '</p>';
      data.sections.forEach(s => {
        html += '<h2>' + s.title + '</h2><p>' + s.text + '</p>';
      });
      content.innerHTML = html;

      const backLink = document.getElementById('back-to-app-link');
      if (backLink && data.backBtn) {
        backLink.textContent = '← ' + data.backBtn;
      }
    }

    function changeLang(lang) {
      try {
        localStorage.setItem('terms_lang', lang);
        localStorage.setItem('myduo_interface_lang', lang);
      } catch (e) {}
      render(lang);
    }

    window.addEventListener('DOMContentLoaded', initLangSelect);
  </script>
