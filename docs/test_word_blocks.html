<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тест «Кубики-слова» | English Breakfast</title>
  <link rel="stylesheet" href="./assets/css/main.css?v=386.0">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-main, #f8fafc);
      color: var(--text-main, #0f172a);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .test-page-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .test-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .test-header-bar h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-picker-group {
      display: flex;
      gap: 6px;
    }

    .theme-btn {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border-color, #cbd5e1);
      background: var(--card-bg, #ffffff);
      color: var(--text-main, #334155);
      cursor: pointer;
    }

    .theme-btn.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #2563eb;
    }

    .controls-panel {
      background: var(--card-bg, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .presets-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .preset-chip {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      border: 1px solid var(--border-color, #cbd5e1);
      background: rgba(0, 0, 0, 0.02);
      color: var(--text-main, #1e293b);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-chip:hover {
      background: #e0f2fe;
      border-color: #7dd3fc;
    }

    .preset-chip.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }

    .custom-word-row {
      display: flex;
      gap: 8px;
    }

    .custom-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color, #cbd5e1);
      background: var(--card-bg, #ffffff);
      color: var(--text-main, #1e293b);
      outline: none;
    }

    .run-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      background: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .game-card-wrapper {
      background: var(--card-bg, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 18px;
      padding: 20px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-target-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .game-target-word {
      font-size: 26px;
      font-weight: 800;
      margin: 0;
      color: var(--text-main, #0f172a);
    }

    .sound-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-color, #cbd5e1);
      background: var(--card-bg, #ffffff);
      cursor: pointer;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .sound-icon-btn:active {
      transform: scale(0.92);
    }

    .game-stage-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .debug-console {
      background: #0f172a;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      border-radius: 12px;
      padding: 12px 14px;
      line-height: 1.5;
      overflow-x: auto;
    }

    .debug-console .log-title {
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .debug-console .log-entry {
      color: #94a3b8;
    }

    .debug-console .log-entry.success {
      color: #4ade80;
    }

    .debug-console .log-entry.warn {
      color: #facc15;
    }
  </style>
</head>
<body>
  <div class="test-page-container">
    <!-- Header -->
    <div class="test-header-bar">
      <h1>🧩 Кубики-слова (Word Blocks)</h1>
      <div class="theme-picker-group">
        <button type="button" class="theme-btn active" data-theme="light">Светлая</button>
        <button type="button" class="theme-btn" data-theme="dark">Тёмная</button>
        <button type="button" class="theme-btn" data-theme="notebook">Тетрадь</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
      <div style="font-size: 13px; font-weight: 700; color: var(--text-muted, #64748b);">Выберите слово для теста:</div>
      <div class="presets-row" id="presets-row"></div>

      <div style="font-size: 13px; font-weight: 700; color: var(--text-muted, #64748b); margin-top: 4px;">Или задайте своё слово:</div>
      <div class="custom-word-row">
        <input type="text" id="custom-word-en" class="custom-input" placeholder="English word (e.g. guitar)" spellcheck="false" autocomplete="off">
        <input type="text" id="custom-word-ru" class="custom-input" placeholder="Перевод (например, гитара)" spellcheck="false" autocomplete="off">
        <button type="button" id="custom-word-run" class="run-btn">Старт</button>
      </div>
    </div>

    <!-- Game Card -->
    <div class="game-card-wrapper">
      <div class="game-stage-badge">
        <span>🧩</span>
        <span>Тест • Кубики-слова (Повторение ошибок)</span>
      </div>

      <div class="game-target-header">
        <h2 class="game-target-word" id="current-target-word">окно</h2>
        <button type="button" class="sound-icon-btn" id="pronounce-btn" title="Озвучить слово">🔊</button>
      </div>

      <!-- Mounted exercise area -->
      <div id="exercise-mount-point" style="width: 100%;"></div>
    </div>

    <!-- Debug Log Panel -->
    <div class="debug-console">
      <div class="log-title">
        <span>Отладочная информация</span>
        <span id="log-clear-btn" style="cursor: pointer; color: #94a3b8; text-decoration: underline;">Очистить</span>
      </div>
      <div id="debug-log-body"></div>
    </div>
  </div>

  <script type="module">
    import { renderWordBlocksExercise, getTrapLetters, evaluateWordleStatuses } from './components/exercises/WordBlocksExercise.js?v=386.0';
    import { speakWord } from './services/audioService.js?v=386.0';

    const PRESET_WORDS = [
      { id: 101, word: 'window', translation: 'окно' },
      { id: 102, word: 'apple', translation: 'яблоко' },
      { id: 103, word: 'beautiful', translation: 'красивый' },
      { id: 104, word: 'weather', translation: 'погода' },
      { id: 105, word: 'ice cream', translation: 'мороженое' },
      { id: 106, word: "can't", translation: 'не могу' },
    ];

    let currentWordObj = PRESET_WORDS[0];

    const presetsContainer = document.querySelector('#presets-row');
    const targetWordTitle = document.querySelector('#current-target-word');
    const pronounceBtn = document.querySelector('#pronounce-btn');
    const mountPoint = document.querySelector('#exercise-mount-point');
    const logBody = document.querySelector('#debug-log-body');
    const customWordEn = document.querySelector('#custom-word-en');
    const customWordRu = document.querySelector('#custom-word-ru');
    const customWordRun = document.querySelector('#custom-word-run');

    function log(msg, type = 'info') {
      const line = document.createElement('div');
      line.className = `log-entry ${type}`;
      const time = new Date().toLocaleTimeString();
      line.textContent = `[${time}] ${msg}`;
      logBody.appendChild(line);
      logBody.scrollTop = logBody.scrollHeight;
    }

    document.querySelector('#log-clear-btn').addEventListener('click', () => {
      logBody.innerHTML = '';
    });

    // Theme Switcher
    document.querySelectorAll('.theme-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const theme = btn.dataset.theme;

        document.body.classList.remove('dark-theme', 'notebook-theme');
        document.documentElement.removeAttribute('data-theme');

        if (theme === 'dark') {
          document.body.classList.add('dark-theme');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else if (theme === 'notebook') {
          document.body.classList.add('notebook-theme');
        }
        log(`Переключена тема оформления: ${theme}`);
      });
    });

    function startExercise(wordObj) {
      currentWordObj = wordObj;
      targetWordTitle.textContent = wordObj.translation || wordObj.word;

      // Update preset active classes
      document.querySelectorAll('.preset-chip').forEach((c) => {
        c.classList.toggle('active', c.dataset.wordId === String(wordObj.id));
      });

      const traps = getTrapLetters(wordObj.word, PRESET_WORDS);
      log(`Запуск слова: "${wordObj.word}" (перевод: "${wordObj.translation}")`);
      log(`Буквы целевого слова: [${wordObj.word.toUpperCase().split('').join(', ')}]`);
      log(`3 сгенерированные ловушки: [${traps.join(', ')}]`);

      mountPoint.innerHTML = '';

      renderWordBlocksExercise(
        mountPoint,
        wordObj,
        PRESET_WORDS,
        (solved) => {
          log(`🎉 Слово "${solved.word}" УСПЕШНО СОБРАНО!`, 'success');
          setTimeout(() => {
            log('Переход к следующему слову...');
            const nextIdx = (PRESET_WORDS.findIndex((w) => w.id === wordObj.id) + 1) % PRESET_WORDS.length;
            startExercise(PRESET_WORDS[nextIdx]);
          }, 1500);
        }
      );
    }

    // Pronounce button
    pronounceBtn.addEventListener('click', () => {
      if (currentWordObj && currentWordObj.word) {
        speakWord(currentWordObj.word, currentWordObj.id);
        log(`🔊 Воспроизведение аудио: "${currentWordObj.word}"`);
      }
    });

    // Render presets chips
    PRESET_WORDS.forEach((item) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'preset-chip';
      chip.dataset.wordId = String(item.id);
      chip.textContent = `${item.translation} (${item.word})`;
      chip.addEventListener('click', () => {
        startExercise(item);
      });
      presetsContainer.appendChild(chip);
    });

    // Custom word run
    customWordRun.addEventListener('click', () => {
      const en = customWordEn.value.trim();
      const ru = customWordRu.value.trim() || en;
      if (!en) {
        alert('Введите английское слово!');
        return;
      }
      const customObj = { id: Date.now(), word: en, translation: ru };
      startExercise(customObj);
    });

    // Start with default
    startExercise(PRESET_WORDS[0]);
  </script>
</body>
</html>
