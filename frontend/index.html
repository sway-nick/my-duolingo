<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Duolingo</title>
  </head>

  <body>
    <h1>My Duolingo</h1>

    <p id="status">Проверка API...</p>

    <div id="words"></div>

    <script type="module">
      import { getHealth, getWords } from './services/api.js';
      import { renderWordList } from './components/wordList.js';

      async function init() {
        const health = await getHealth();

        document.querySelector('#status').textContent = health.data.status;

        const words = await getWords();

        renderWordList(words.data);
      }

      init();
    </script>
  </body>
</html>
