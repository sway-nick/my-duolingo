<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./assets/css/main.css" />

    <title>My Duolingo</title>
  </head>

  <body>
    <div id="app"></div>

    <script type="module">
      import { getHealth, getWords } from './services/api.js';
      import { renderAppLayout } from './components/layout/AppLayout.js';
      import { renderWordList } from './components/wordList.js';

      async function init() {
        renderAppLayout();

        const health = await getHealth();

        const status = document.createElement('p');
        status.textContent = health.data.status;

        document.querySelector('.app-header').appendChild(status);

        const words = await getWords();

        renderWordList(words.data);
      }

      init();
    </script>
  </body>
</html>
