<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Trainer — Изучайте английский легко</title>
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>

  <body>
    <div id="app"></div>

    <script type="module">
      import { getWords, getUserSettings } from './services/api.js';
      import { getCurrentUser } from './services/authService.js';
      import { renderAppLayout, updateHeaderUser } from './components/layout/AppLayout.js';
      import { renderTrainingCard } from './components/training/TrainingCard.js';
      import { renderStatsView } from './components/stats/StatsView.js';
      import { renderSettingsView } from './components/settings/SettingsView.js';
      import { renderFavoritesView } from './components/favorites/FavoritesView.js';
      import { renderDictionaryView } from './components/dictionary/DictionaryView.js';

      let allWords = [];
      let favoriteIds = new Set();
      let currentWordIndex = 0;
      let activeTab = 'training';
      let userSettings = { enabledMethods: 'quiz,cards,input' };

      async function loadData() {
        try {
          const wordsRes = await getWords();
          if (wordsRes && wordsRes.data && wordsRes.data.length > 0) {
            allWords = wordsRes.data;
          }
        } catch (e) {
          console.warn('Failed to load words:', e);
        }

        try {
          userSettings = await getUserSettings();
        } catch (e) {
          console.warn('Failed to load settings:', e);
        }
      }

      function handleFavoriteToggle(wordId, isFav) {
        if (isFav) favoriteIds.add(wordId);
        else favoriteIds.delete(wordId);

        // If on favorites tab, re-render
        if (activeTab === 'favorites') {
          renderTab(activeTab);
        }
      }

      function renderTrainingTab() {
        const content = document.querySelector('#app-content');
        if (!content) return;
        content.innerHTML = '<div id="training"></div>';

        if (allWords.length === 0) {
          content.innerHTML = '<p class="empty-state">Нет доступных слов для тренировки.</p>';
          return;
        }

        const currentWord = allWords[currentWordIndex % allWords.length];
        const enabledMethods = (userSettings.enabledMethods || 'quiz,cards,input').split(',');

        renderTrainingCard(currentWord, allWords, {
          enabledMethods,
          isFavorite: favoriteIds.has(currentWord.id),
          onFavoriteToggle: handleFavoriteToggle,
          onNext: () => {
            currentWordIndex += 1;
            renderTrainingTab();
          },
        });
      }

      async function renderTab(tabName) {
        activeTab = tabName;
        const content = document.querySelector('#app-content');

        if (tabName === 'training') {
          renderTrainingTab();
        } else if (tabName === 'stats') {
          await renderStatsView('#app-content');
        } else if (tabName === 'favorites') {
          const favWords = allWords.filter((w) => favoriteIds.has(w.id));
          renderFavoritesView(favWords, '#app-content', {
            onFavoriteToggle: handleFavoriteToggle,
            onRemoveFavorite: (id) => handleFavoriteToggle(id, false),
            onStartFavoritePractice: (practiceWords) => {
              allWords = practiceWords;
              currentWordIndex = 0;
              const tabBtn = document.querySelector('.nav-tab[data-tab="training"]');
              if (tabBtn) tabBtn.click();
            },
          });
        } else if (tabName === 'dictionary') {
          renderDictionaryView(allWords, '#app-content', {
            favoriteIds: Array.from(favoriteIds),
            onFavoriteToggle: handleFavoriteToggle,
          });
        } else if (tabName === 'settings') {
          await renderSettingsView('#app-content', async () => {
            updateHeaderUser();
            await loadData();
            renderTab(activeTab);
          });
        }
      }

      async function init() {
        await loadData();

        renderAppLayout(
          (tabName) => {
            renderTab(tabName);
          },
          async () => {
            updateHeaderUser();
            await loadData();
            renderTab(activeTab);
          }
        );

        // Initial tab render
        renderTab('training');
      }

      init();
    </script>
  </body>
</html>
