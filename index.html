    <script>
      (function() {
        function sanitize(str) {
          return String(str || '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '_').slice(0, 40);
        }
        window.trackScreen = function(screenName, screenClass, params) {
          try {
            var sName = sanitize(screenName);
            var sClass = screenClass || 'Screen';
            if (window.AndroidAnalyticsBridge && typeof window.AndroidAnalyticsBridge.trackScreen === 'function') {
              window.AndroidAnalyticsBridge.trackScreen(sName, sClass);
              if (params && Object.keys(params).length > 0) {
                window.AndroidAnalyticsBridge.logEvent('screen_' + sName, JSON.stringify(params));
              }
            }
          } catch (e) {}
        };
        window.trackEvent = function(eventName, params) {
          try {
            var eName = sanitize(eventName);
            if (window.AndroidAnalyticsBridge && typeof window.AndroidAnalyticsBridge.logEvent === 'function') {
              window.AndroidAnalyticsBridge.logEvent(eName, JSON.stringify(params || {}));
            }
          } catch (e) {}
        };
      })();
    </script>
    <script>
      // Force instant auto-restart and cache-bust for all users and Android devices
      (function() {
        var APP_BUILD = '20261003_v383_21';
        try {
          var isAndroid = !!(
            window.androidBridge ||
            window.Capacitor?.isNativePlatform?.() ||
            window.Capacitor?.getPlatform?.() === 'android' ||
            (window.location && window.location.hostname === 'localhost' && /Android/i.test(navigator.userAgent))
          );
          if (isAndroid) {
            document.documentElement.classList.add('is-android-app');
          }
        } catch (e) {}
        try {
          var userLang = (localStorage.getItem('myduo_interface_lang') || '').toLowerCase();
          if (!userLang && navigator.languages && navigator.languages.length > 0) {
            userLang = (navigator.languages[0] || '').toLowerCase().split(/[-_]/)[0];
          }
          if (userLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', 'ar');
            document.documentElement.classList.add('is-rtl');
          } else {
            document.documentElement.setAttribute('dir', 'ltr');
            if (userLang) document.documentElement.setAttribute('lang', userLang);
            document.documentElement.classList.remove('is-rtl');
          }
        } catch (e) {}
        try {
          var t = localStorage.getItem('myduo_theme') || 'light';
          var isWide = typeof window !== 'undefined' && window.innerWidth > 680;
          var initBg = t === 'dark' ? (isWide ? '#090d16' : '#0f172a') : (isWide ? '#e2e8f0' : '#f8fafc');
          if (t === 'dark') {
            document.documentElement.classList.add('dark-theme');
          }
          document.documentElement.style.backgroundColor = initBg;
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.setWindowThemeColor === 'function') {
            window.AndroidThemeBridge.setWindowThemeColor(t);
          }
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.getStatusBarHeightDp === 'function') {
            var sbHeight = window.AndroidThemeBridge.getStatusBarHeightDp();
            if (sbHeight > 0) {
              document.documentElement.style.setProperty('--safe-top', sbHeight + 'px');
            }
          }
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.getNavigationBarHeightDp === 'function') {
            var nbHeight = window.AndroidThemeBridge.getNavigationBarHeightDp();
            if (nbHeight > 0) {
              document.documentElement.style.setProperty('--safe-bottom', nbHeight + 'px');
            }
          }
        } catch (e) {}
        var prevBuild = localStorage.getItem('myduo_app_build');
        if (prevBuild !== APP_BUILD) {
          localStorage.setItem('myduo_app_build', APP_BUILD);
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && (k.startsWith('cache_leaderboard_') || k === 'myduo_leaderboard_period')) {
              localStorage.removeItem(k);
            }
          }
        }
        window.hideAppSplashScreen = function() {
          var splash = document.getElementById('app-splash-screen');
          if (splash) {
            splash.style.pointerEvents = 'none';
            splash.style.transition = 'opacity 0.3s ease';
            splash.style.opacity = '0';
            setTimeout(function() {
              if (splash && splash.parentNode) {
                splash.parentNode.removeChild(splash);
              }
            }, 320);
          }
        };
        // Watchdog: guarantee splash screen is dismissed even if unexpected error occurs
        setTimeout(function() {
          if (typeof window.hideAppSplashScreen === 'function') {
            window.hideAppSplashScreen();
          }
        }, 4000);
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js?v=386.0').catch(function() {});
          });
        }
      })();
    </script>

    <script type="module">
      import { getWords, getUserSettings, getUserProgress, getUserFavorites, toggleFavoriteApi, saveUserSettings, isWordMastered, isWordLearning, getQueueForCards, getQueueForQuiz, getQueueForPairs, getQueueForTest, prepareTrainingBatch, getActiveConveyorBatch, clearActiveConveyorBatch, getLeaderboard, getIsoWeekKey, fetchUserDataFromCloud, pushUserDataToCloud, getGlobalWordOfTheDay, getCloudWordOfTheDayId, syncPendingWidgetFavorites, addWeeklyXP } from './services/api.js?v=386.0';
      import { getRecentWeekKeys } from './services/weekKey.js?v=386.0';
      import { speakWord, preloadWordAudio, playFanfareSound, releaseScreenWakeLock, stopSilentAudioAnchor, stopNativeBackgroundPlayback, isCategoryAudioDownloaded, downloadCategoryVoicePack, verifyCategoryAudioInCache, getSavedVoiceAccent } from './services/audioService.js?v=386.0';
      import { getCurrentUser, isGuestLimitReached, incrementGuestTrainingCount, GUEST_WORD_LIMIT } from './services/authService.js?v=386.0';
      import { renderAppLayout, updateHeaderUser, updateMondayTickerTabVisibility } from './components/layout/AppLayout.js?v=386.0';
      import { t, getInterfaceLanguage, getWordTranslation, getCategoryDetails, getCategoryVoiceModalStrings } from './services/i18n.js?v=386.0';
      import { renderTrainingCard } from './components/training/TrainingCard.js?v=386.0';
      import { renderStatsView } from './components/stats/StatsView.js?v=386.0';
      import { renderSettingsView } from './components/settings/SettingsView.js?v=386.0';
      import { renderFavoritesView } from './components/favorites/FavoritesView.js?v=386.0';
      import { renderCollectionsHubView } from './components/favorites/CollectionsHubView.js?v=386.0';
      import { getCollectionTitle, getActiveCollectionId, syncCollectionToAndroidWidget, getCollectionWords } from './services/collectionsService.js?v=386.0';
      import { renderDictionaryView } from './components/dictionary/DictionaryView.js?v=386.0';
      import { renderLeaderboardView, renderMondayMemeTop4Cut } from './components/leaderboard/LeaderboardView.js?v=386.0';
      import { renderAuthModal } from './components/auth/AuthModal.js?v=386.0';
      import { initPrizePodiumListener } from './components/modals/PrizePodiumModal.js?v=386.0';
      import { AdService } from './services/adService.js?v=386.0';

      // Initialize AdMob service
      try {
        AdService.init().catch(() => {});
      } catch (e) {}

      // Reset irregular verbs and UK audio download flags once so user can test AdMob rewarded video in both places
      try {
        if (!localStorage.getItem('myduo_admob_audio_test_reset_v2')) {
          localStorage.setItem('myduo_admob_audio_test_reset_v2', 'true');
          localStorage.removeItem('myduo_cat_downloaded_us_irregular verb');
          localStorage.removeItem('myduo_cat_downloaded_us_irregular verbs');
          localStorage.removeItem('myduo_cat_downloaded_uk_irregular verb');
          localStorage.removeItem('myduo_cat_downloaded_uk_irregular verbs');
          localStorage.removeItem('myduo_cat_downloaded_uk_elementary');
          localStorage.removeItem('myduo_pack_uk_downloaded');
        }
      } catch (e) {}

      // One-time cleanup of phantom words that were never actively learned in Cards
      (function cleanPhantomWords() {
        try {
          const user = getCurrentUser();
          const uId = user ? user.id : 'guest';
          const progKey = 'progress_' + uId;
          const localProg = JSON.parse(localStorage.getItem(progKey) || '{}');
          let changed = false;
          Object.keys(localProg).forEach((id) => {
            const p = localProg[id];
            // If word is not mastered, has no typing inputs, no quiz successes, but accumulated pairs, clear it
            if (p && !p.mastered && (p.inputCorrect || 0) === 0 && (p.quizCorrect || 0) === 0 && (p.pairsCorrect || 0) > 0) {
              delete localProg[id];
              changed = true;
            }
          });
          if (changed) {
            localStorage.setItem(progKey, JSON.stringify(localProg));
          }
        } catch (e) {}
      })();

      let allWords = [];
      try {
        const cachedWords = JSON.parse(localStorage.getItem('myduo_cached_words') || '[]');
        if (Array.isArray(cachedWords) && cachedWords.length > 0) {
          allWords = cachedWords;
          const initialLang = getInterfaceLanguage();
          allWords.forEach((w) => {
            if (w && w.translations && w.translations[initialLang]) {
              w.translation = w.translations[initialLang];
            }
            if (w && w.all_notes && typeof w.all_notes === 'object') {
              w.notes = w.all_notes[initialLang] || '';
            }
          });
        }
      } catch (e) {}
      let favoriteIds = new Set();
      let favoritePracticeWords = null;
      let favoritePracticeMethod = 'cards';
      let currentWordIndex = 0;
      let activeTab = 'training';
      let currentTrainingMethod = 'cards';
      let userSettings = { enabledMethods: 'quiz,cards,input', dailyGoal: 10 };
      let cloudWordOfTheDayId = null;
      let wotdPlaylist = ["cat1.mp4","cat2.mp4","cat3.mp4","cat4.mp4","cat5.mp4","cat6.mp4","cat7.mp4","cat8.mp4"];

      // Fetch dynamic playlist if available
      try {
        fetch('assets/video/playlist.json?v=' + Date.now())
          .then((r) => r.json())
          .then((list) => {
            if (Array.isArray(list) && list.length > 0) {
              wotdPlaylist = list;
              preloadNextWotdVideo();
            }
          })
          .catch(() => {});
      } catch (e) {}

      function getDailyVideoDateKey() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function preloadNextWotdVideo() {
        try {
          let currentIdx = parseInt(localStorage.getItem('myduo_wotd_video_idx') || '0', 10);
          if (isNaN(currentIdx) || currentIdx < 0) currentIdx = 0;
          const selectedVideo = wotdPlaylist[currentIdx % wotdPlaylist.length];
          const videoUrl = 'assets/video/' + selectedVideo;

          // Preload via background video element into memory buffer (clean, no console warnings)
          if (!window._wotdPreloadVideo) {
            window._wotdPreloadVideo = document.createElement('video');
            window._wotdPreloadVideo.preload = 'auto';
            window._wotdPreloadVideo.muted = true;
            window._wotdPreloadVideo.playsInline = true;
          }
          if (window._wotdPreloadVideo.src !== window.location.origin + '/' + videoUrl && !window._wotdPreloadVideo.src.endsWith(videoUrl)) {
            window._wotdPreloadVideo.src = videoUrl;
            window._wotdPreloadVideo.load();
          }
        } catch (e) {}
      }

      async function loadData() {
        const user = getCurrentUser();

        try {
          await Promise.allSettled([
            (user && user.id && user.id !== 'guest')
              ? fetchUserDataFromCloud(user.id).catch((e) => console.warn('Cloud sync error:', e))
              : Promise.resolve(),
            getWords(false).then((wordsRes) => {
              if (wordsRes && wordsRes.data && wordsRes.data.length > 0) {
                allWords = wordsRes.data;
              }
            }).catch((e) => console.warn('Words load error:', e)),
            getCloudWordOfTheDayId(user ? user.id : 'guest').then((cId) => {
              if (cId) {
                cloudWordOfTheDayId = cId;
              }
            }).catch((e) => console.warn('WOTD load error:', e))
          ]);
        } catch (e) {}

        try {
          userSettings = await getUserSettings();
        } catch (e) {
          console.warn('Failed to load settings:', e);
        }

        try {
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
        } catch (e) {
          console.warn('Failed to load favorites:', e);
        }

        if (cloudWordOfTheDayId && allWords && allWords.length > 0) {
          const w = allWords.find(item => String(item.id) === cloudWordOfTheDayId);
          if (w && w.word) {
            preloadWordAudio(w.word);
          }
        }

        try {
          getLeaderboard().catch(() => {});
          // Global background sync every 1 hour for all players
          if (!window._globalLeaderboardSyncTimer) {
            window._globalLeaderboardSyncTimer = setInterval(() => {
              getLeaderboard().catch(() => {});
            }, 3600000);
          }
        } catch (e) {}
      }

      // Expose a global function so SettingsView can trigger the "download UK Elementary audio" modal
      window.showAccentDownloadModalIfNeeded = async function(accent) {
        if (accent !== 'uk') return false;
        // Elementary is the bundled category — check if its UK audio pack is downloaded
        const ELEMENTARY_CAT = 'Elementary';
        const verifyWords = allWords.filter((w) => (w.category || '').toLowerCase().trim() === ELEMENTARY_CAT.toLowerCase());
        if (isCategoryAudioDownloaded(accent, ELEMENTARY_CAT) && await verifyCategoryAudioInCache(accent, ELEMENTARY_CAT, verifyWords)) return false;

        const catWords = allWords.filter((w) => {
          const wCat = (w.category || '').toLowerCase().trim();
          return wCat === ELEMENTARY_CAT.toLowerCase();
        });
        const count = catWords.length || 2451;
        const sizeMb = Math.max(1, Math.round((count * 8) / 1024));
        const details = getCategoryDetails(ELEMENTARY_CAT);
        const strings = getCategoryVoiceModalStrings(details.title, count, sizeMb);

        const existing = document.querySelector('#cat-voice-download-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'cat-voice-download-modal';
        modal.style.cssText = 'position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 16px; box-sizing: border-box;';
        modal.innerHTML = `
          <div class="modal-content" style="text-align: center; max-width: 350px; width: 100%; padding: 26px 20px; border-radius: 20px; box-sizing: border-box; animation: scaleUp 0.2s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
            <div style="font-size: 44px; margin-bottom: 10px; line-height: 1;">📥</div>
            <h3 style="font-size: 18px; font-weight: 700; margin: 0 0 10px; color: var(--text-main);">
              ${strings.title}
            </h3>
            <p id="cat-modal-desc" style="font-size: 13.5px; color: var(--text-muted); line-height: 1.45; margin: 0 0 18px;">
              ${strings.desc}
            </p>
            <div id="cat-progress-wrap" style="display: none; margin-bottom: 16px;">
              <div style="background: rgba(0,0,0,0.08); border-radius: 99px; height: 10px; overflow: hidden; margin-bottom: 6px;">
                <div id="cat-progress-bar" style="background: var(--btn-green-bg, #22c55e); height: 100%; width: 0%; transition: width 0.15s ease;"></div>
              </div>
              <span id="cat-progress-text" style="font-size: 12px; font-weight: 700; color: var(--text-muted);">0%</span>
            </div>
            <div id="cat-modal-actions" style="display: flex; flex-direction: column; gap: 8px;">
              <button class="primary-button btn-green" id="cat-modal-download-btn" style="min-height: 44px; font-size: 15px; font-weight: 700; width: 100%; border-radius: 12px;">
                ${strings.downloadBtn}
              </button>
              <button class="secondary-button" id="cat-modal-cancel-btn" style="min-height: 38px; font-size: 14px; width: 100%; border-radius: 12px;">
                ${strings.cancelBtn}
              </button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);

        const downloadBtn = modal.querySelector('#cat-modal-download-btn');
        const cancelBtn = modal.querySelector('#cat-modal-cancel-btn');
        const progressWrap = modal.querySelector('#cat-progress-wrap');
        const progressBar = modal.querySelector('#cat-progress-bar');
        const progressText = modal.querySelector('#cat-progress-text');
        const descEl = modal.querySelector('#cat-modal-desc');
        const actionsWrap = modal.querySelector('#cat-modal-actions');

        cancelBtn.addEventListener('click', () => { modal.remove(); });

        downloadBtn.addEventListener('click', async () => {
          downloadBtn.disabled = true;
          const prevBtnText = downloadBtn.innerHTML;
          downloadBtn.innerHTML = '⏳ ' + strings.downloading;

          // 1. Show Rewarded Ad if online
          if (window.AdService && AdService.isOnline()) {
            try {
              const adRes = await AdService.showLanguagePackRewardedAd('UK Accent');
              // If ad was shown but dismissed early without reward
              if (adRes && adRes.success && !adRes.rewardEarned) {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = prevBtnText;
                return;
              }
            } catch (adErr) {
              console.warn('UK accent ad error (proceeding gracefully):', adErr);
            }
          }

          if (actionsWrap) actionsWrap.style.display = 'none';
          progressWrap.style.display = 'block';
          if (descEl) descEl.style.display = 'none';
          try {
            await downloadCategoryVoicePack(accent, ELEMENTARY_CAT, catWords, (percent) => {
              if (progressBar) progressBar.style.width = `${percent}%`;
              if (progressText) progressText.textContent = `${percent}%`;
            });
            modal.remove();
          } catch (err) {
            console.warn('UK accent download failed:', err);
            if (actionsWrap) actionsWrap.style.display = 'flex';
            downloadBtn.disabled = false;
            cancelBtn.style.display = 'block';
            if (descEl) descEl.style.display = 'block';
            downloadBtn.textContent = strings.retryBtn;
          }
        });

        return true;
      };

      function handleFavoriteToggle(wordId, isFav) {
        const idStr = String(wordId);
        if (isFav) favoriteIds.add(idStr);
        else favoriteIds.delete(idStr);

        // If unfavoriting during "Repeat Favorites" practice — remove card from the list
        const isPracticingMyFavorites = !window._activePracticeCollectionId || window._activePracticeCollectionId === 'my_favorites';
        if (isPracticingMyFavorites && !isFav && favoritePracticeWords && favoritePracticeWords.length > 0) {
          const prevLen = favoritePracticeWords.length;
          favoritePracticeWords = favoritePracticeWords.filter(
            (w) => String(w.id) !== idStr
          );
          if (favoritePracticeWords.length < prevLen) {
            // Keep index in bounds
            if (currentWordIndex >= favoritePracticeWords.length) {
              currentWordIndex = Math.max(0, favoritePracticeWords.length - 1);
            }
            if (favoritePracticeWords.length === 0) {
              // No more favorites — exit practice mode
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              currentWordIndex = 0;
            }
            renderTrainingTab();
            return;
          }
        }

        if (activeTab === 'favorites') {
          if (window._isInsideCollectionCards) {
            return;
          }
          renderTab(activeTab);
        }
      }

        function sanitizeCategory(cat) {
          if (!cat) return 'Elementary';
          const s = String(cat).replace(/\s*[•\-–—]?\s*[A-C][1-2].*$/i, '').trim();
          const clean = s.toLowerCase();
          if (clean.includes('elementary')) return 'Elementary';
          if (clean.includes('irregular')) return 'Irregular verbs';
          if (clean.includes('pattern')) return 'Pattern';
          if (clean.includes('intermediate')) return 'Intermediate';
          if (clean.includes('advanced')) return 'Advanced';
          return 'Elementary';
        }

        const CANONICAL_CATEGORY_ORDER = ['Elementary', 'Irregular verb', 'Pattern', 'Intermediate', 'Advanced'];

        function getCategoryOrderIndex(catName) {
          const clean = String(catName || '').toLowerCase().trim();
          if (clean.includes('elementary')) return 0;
          if (clean.includes('irregular')) return 1;
          if (clean.includes('pattern')) return 2;
          if (clean.includes('intermediate')) return 3;
          if (clean.includes('advanced')) return 4;
          return 999;
        }

        function getNextSequentialCategory(currentCat, availableCats) {
          const currentIdx = getCategoryOrderIndex(currentCat);
          if (currentIdx === 999) return null;
          for (let i = currentIdx + 1; i < CANONICAL_CATEGORY_ORDER.length; i++) {
            const found = availableCats.find((c) => getCategoryOrderIndex(c) === i);
            if (found) return found;
          }
          return null;
        }

        const categories = Array.from(new Set(allWords.map((w) => sanitizeCategory(w.category)).filter(Boolean)))
          .sort((a, b) => {
            const diff = getCategoryOrderIndex(a) - getCategoryOrderIndex(b);
            if (diff !== 0) return diff;
            return a.localeCompare(b);
          });
        let selectedCategory = userSettings.category || 'Elementary';
        if (selectedCategory === 'All' || selectedCategory === 'Все категории') {
          selectedCategory = 'Elementary';
          userSettings.category = 'Elementary';
          saveUserSettings(userSettings);
        }

        let categoryWords = allWords;
        if (selectedCategory && selectedCategory !== 'All' && selectedCategory !== 'Все категории') {
          const filtered = allWords.filter(
            (w) => sanitizeCategory(w.category) === sanitizeCategory(selectedCategory)
          );
          if (filtered.length > 0) {
            categoryWords = filtered;
          }
        }
        categoryWords.sort((a, b) => (Number(b.zipf) || 0) - (Number(a.zipf) || 0));

        const userProgress = getUserProgress();
        const favList = getUserFavorites();
        const favSet = new Set(favList.map(String));
        favoriteIds = favSet;

        // Check if practicing favorites mode is active
        const isFavPracticeActive = Boolean(favoritePracticeWords && favoritePracticeWords.length > 0);
        let currentMethod = isFavPracticeActive
          ? (favoritePracticeMethod || 'cards')
          : (userSettings.preferredMethod || 'cards');
        currentTrainingMethod = (!isFavPracticeActive && window._showHubScreen) ? null : currentMethod;
        if (isFavPracticeActive) {
          categoryWords = favoritePracticeWords;
        }

        const dailyGoal = Number(userSettings.dailyGoal) || 10;
        const totalLearningWords = categoryWords.filter((w) => isWordLearning(userProgress[w.id]));
        const learningCount = totalLearningWords.length;

        const favListForMixing = isFavPracticeActive ? [] : favList;

        // When practicing collections, NEVER call getQueueForCards/Quiz/Pairs/Test with collection words!
        // Doing so would corrupt the persistent conveyor batch (conveyor_batch_*) in localStorage.
        const cardsQueue = isFavPracticeActive ? favoritePracticeWords : getQueueForCards(categoryWords, userProgress, favList);
        const quizQueue = isFavPracticeActive ? favoritePracticeWords : getQueueForQuiz(categoryWords, userProgress, favList);
        const pairsQueue = isFavPracticeActive ? favoritePracticeWords : getQueueForPairs(categoryWords, userProgress, favList);
        const testQueue = isFavPracticeActive ? favoritePracticeWords : getQueueForTest(categoryWords, userProgress, favList);

        function isMethodAvailable(method) {
          if (method === 'cards') return !isFavPracticeActive && cardsQueue.length > 0;
          if (method === 'quiz') return quizQueue.length > 0;
          if (method === 'pairs') return pairsQueue.length > 0;
          if (method === 'input') return testQueue.length > 0;
          return false;
        }

        // SMART ACTIVE MODE RESOLUTION:
        // Automatically advance along the training conveyor: Cards -> Quiz -> Pairs -> Test.
        // If window._showHubScreen is true or round is finished, show the clean Hub screen.
        if (!isFavPracticeActive) {
          if (window._showHubScreen) {
            currentMethod = 'input';
          } else if (!isMethodAvailable(currentMethod)) {
            const prevMethod = currentMethod;
            // STRICT FORWARD-ONLY CONVEYOR PROGRESSION:
            // Cards -> Quiz -> Pairs -> Test -> Finished (Hub)
            if (currentMethod === 'cards') {
              if (quizQueue.length > 0) currentMethod = 'quiz';
              else if (pairsQueue.length > 0) currentMethod = 'pairs';
              else if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            } else if (currentMethod === 'quiz') {
              if (pairsQueue.length > 0) currentMethod = 'pairs';
              else if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            } else if (currentMethod === 'pairs') {
              // After Pairs, STRICTLY proceed ONLY to Test! Never regress to Quiz or Cards!
              if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            } else if (currentMethod === 'input') {
              if (testQueue.length === 0) {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            }
            if (currentMethod !== prevMethod) {
              currentWordIndex = 0;
            }
          }

          // Keep userSettings.preferredMethod strictly synchronized with the current active conveyor mode
          // (Never overwrite preferredMethod with 'input' when merely displaying the Hub screen)
          if (!window._showHubScreen && userSettings.preferredMethod !== currentMethod) {
            userSettings.preferredMethod = currentMethod;
            saveUserSettings(userSettings);
          }
          if (!window._showHubScreen) {
            currentTrainingMethod = currentMethod;
            if (currentMethod === 'quiz') {
              try {
                AdService.preloadInterstitial().catch(() => {});
              } catch (e) {}
            }
          }
        }

        // Filter words strictly based on the active training method queue
        let activeWords = [];
        if (window._showHubScreen && !isFavPracticeActive) {
          // Hub choice screen requested: force empty activeWords to display Hub options!
          activeWords = [];
          currentMethod = 'input';
        } else if (isFavPracticeActive) {
          activeWords = favoritePracticeWords;
        } else if (currentMethod === 'cards') {
          activeWords = getQueueForCards(categoryWords, userProgress);
        } else if (currentMethod === 'quiz') {
          activeWords = quizQueue;
        } else if (currentMethod === 'pairs') {
          activeWords = pairsQueue;
        } else if (currentMethod === 'input') {
          // Exactly the full batch of 20 words for Test
          activeWords = testQueue;
        }

        // Check if all words in category are mastered (3x in Test) — Favorites practice is exempt (can be repeated infinitely)
        const unmasteredCount = categoryWords.filter((w) => !isWordMastered(userProgress[w.id])).length;
        if (!window._showHubScreen && !isFavPracticeActive && unmasteredCount === 0 && categoryWords.length > 0) {
          const nextCategory = isFavPracticeActive ? null : getNextSequentialCategory(selectedCategory, categories);
          const title = isFavPracticeActive ? t('train_mastered_all_favs') : t('train_mastered_title');
          const description = isFavPracticeActive ? t('train_mastered_sub_favs') : t('train_mastered_sub_cat');

          let nextCatBtnHtml = '';
          if (nextCategory) {
            nextCatBtnHtml = `
              <button class="primary-button btn-green" id="next-category-btn" style="min-height: 46px; font-weight: 700;">
                ${nextCategory} 🚀
              </button>
            `;
          }

          content.innerHTML = `
            <div class="empty-state-card" style="text-align: center; padding: 40px 20px;">
              <div style="font-size: 56px; margin-bottom: 16px;">🎉</div>
              <h2 style="margin: 0 0 10px;">${title}</h2>
              <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 15px; line-height: 1.45;">
                ${description}
              </p>
              <div style="display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto;">
                ${nextCatBtnHtml}
                <button class="${nextCategory ? 'secondary-button' : 'primary-button btn-green'}" id="review-all-btn" style="min-height: 46px;">
                  ${t('train_review_again')}
                </button>
                ${
                  isFavPracticeActive
                    ? `
                  <button class="secondary-button" id="exit-favs-btn" style="min-height: 46px;">
                    ${t('train_exit_favs')}
                  </button>
                `
                    : ''
                }
              </div>
            </div>
          `;

          const nextCatBtn = content.querySelector('#next-category-btn');
          if (nextCatBtn && nextCategory) {
            nextCatBtn.addEventListener('click', () => {
              clearActiveConveyorBatch();
              window._pausedRoundState = null;
              localStorage.setItem('myduo_dict_category', nextCategory);
              userSettings.category = nextCategory;
              userSettings.preferredMethod = 'cards';
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();

              const videoContainer = flashcard.querySelector('#wotd-video-container');

              // Tilt & Glare interactions
              if (tiltContainer) {
                const handleCardMove = (clientX, clientY) => {
                  const rect = tiltContainer.getBoundingClientRect();
                  const px = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                  const py = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

                  const tiltY = (px - 0.5) * 14;
                  const tiltX = (0.5 - py) * 10;

                  tiltContainer.style.setProperty('--tiltX', `${tiltX.toFixed(2)}deg`);
                  tiltContainer.style.setProperty('--tiltY', `${tiltY.toFixed(2)}deg`);
                  tiltContainer.style.setProperty('--glare-x', `${(px * 100).toFixed(1)}%`);
                  tiltContainer.style.setProperty('--glare-y', `${(py * 100).toFixed(1)}%`);
                };

                const resetCardTilt = () => {
                  tiltContainer.style.setProperty('--tiltX', '0deg');
                  tiltContainer.style.setProperty('--tiltY', '0deg');
                  tiltContainer.style.setProperty('--glare-x', '50%');
                  tiltContainer.style.setProperty('--glare-y', '20%');
                  tiltContainer.classList.remove('is-hovering');

                tiltContainer.addEventListener('mouseenter', () => tiltContainer.classList.add('is-hovering'));

                tiltContainer.addEventListener('touchstart', () => tiltContainer.classList.add('is-hovering'), { passive: true });

                isFlipped = !isFlipped;

                if (isFlipped) {

                  const todayKey = getDailyVideoDateKey();
                  const canPlayToday = (localStorage.getItem('myduo_wotd_video_last_date') !== todayKey) || isMemeActive;

                  if (canPlayToday && !videoStarted && cardVideo && videoContainer) {

                      localStorage.setItem('myduo_wotd_video_last_date', todayKey);

                        round_word: wotd ? wotd.word : ''
                      });
                    }

                    let isVideoRevealed = false;
                    const flipStartTime = Date.now();
                    const revealVideo = () => {
                      if (isVideoRevealed || !isFlipped) return;
                      const elapsed = Date.now() - flipStartTime;
                      const waitRemaining = Math.max(0, 950 - elapsed);
                      setTimeout(() => {
                        if (isVideoRevealed || !isFlipped) return;
                        isVideoRevealed = true;
                        videoContainer.style.display = 'block';
                        requestAnimationFrame(() => {
                          videoContainer.style.opacity = '1';
                        });
                      }, waitRemaining);
                    };

                    const dismissVideo = () => {
                      videoContainer.style.opacity = '0';
                      setTimeout(() => {
                        const v1Ended = !cardVideo || cardVideo.ended || cardVideo.paused;
                        const v2Ended = !cardVideoWhat || cardVideoWhat.ended || cardVideoWhat.paused;
                        if (!isFlipped || (v1Ended && v2Ended)) {
                          videoContainer.style.display = 'none';
                          if (cardVideoWhat) cardVideoWhat.style.display = 'none';
                        }
                      }, 350);

                      renderMondayMemeTop4Cut(top4Cut, completedWeekKey);

                    // Reveal video strictly when first real frame starts playing (prevents black screen!)

                    cardVideo.addEventListener('timeupdate', () => {
                      if (cardVideo.currentTime > 0.05) revealVideo();
                    }, { once: true });

                    if (isMemeActive) {
                      // STEP 1: Video 1 (Cat looks at screen)
                      cardVideo.addEventListener('ended', () => {
                        if (!isFlipped) return;

                        // STEP 2: Show Top 4 Leaders screen cut for 1.8 seconds
                        cardVideo.style.display = 'none';
                        if (top4Cut) {
                          renderMondayMemeTop4Cut(top4Cut, completedWeekKey);
                          top4Cut.style.display = 'flex';
                        }

                        memeTimeout = setTimeout(() => {
                          memeTimeout = null;
                          if (!isFlipped) return;

                          // STEP 3: Cat screams "WHAT?!"
                          const targetVideo2 = cardVideoWhat || cardVideo;
                          targetVideo2.style.display = 'block';
                          targetVideo2.muted = false;
                          targetVideo2.volume = 1.0;

                          let hasRevealedVideo2 = false;
                          const revealVideo2 = () => {
                            if (hasRevealedVideo2) return;
                            hasRevealedVideo2 = true;
                            if (top4Cut) top4Cut.style.display = 'none';
                          };

                          // Seamlessly transition: hide Top 4 cut ONLY after Video 2 is actually painting frames
                          targetVideo2.addEventListener('playing', revealVideo2, { once: true });
                          targetVideo2.addEventListener('timeupdate', () => {
                            if (targetVideo2.currentTime > 0.04) revealVideo2();
                          }, { once: true });

                          // Safety fallback so cut is never stuck
                          setTimeout(revealVideo2, 350);

                          const play2 = targetVideo2.play();
                          if (play2 !== undefined) {
                            play2.then(() => {
                              setTimeout(revealVideo2, 60);
                            }).catch((err) => {
                              console.warn('Video 2 audio autoplay restricted, falling back to muted:', err);
                              targetVideo2.muted = true;
                              targetVideo2.play().then(() => {
                                setTimeout(revealVideo2, 60);
                              }).catch(() => revealVideo2());
                            });
                          }

                          targetVideo2.addEventListener('ended', () => {
                            dismissVideo();
                            localStorage.setItem(memeSeenKey, '1');
                            localStorage.setItem('myduo_wotd_video_last_date', todayKey);

                    cardVideo.volume = 1.0;

                    const playPromise = cardVideo.play();

                      <div id="cat-modal-actions" style="display: flex; flex-direction: column; gap: 8px;">
                        <button class="primary-button btn-green" id="cat-modal-download-btn" style="min-height: 44px; font-size: 15px; font-weight: 700; width: 100%; border-radius: 12px;">
