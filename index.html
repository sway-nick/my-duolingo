<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Clear legacy Service Worker & CacheStorage to ensure users get latest version instantly
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
    </script>
    <title>English Trainer — Изучайте английский легко</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>" />
    <link rel="stylesheet" href="./assets/css/main.css?v=8.0" />
  </head>

  <body>
    <div id="app"></div>

    <script type="module">
      import { getWords, getUserSettings, getUserProgress, saveUserSettings } from './services/api.js?v=8.0';
      import { getCurrentUser, isGuestLimitReached, incrementGuestTrainingCount, GUEST_WORD_LIMIT } from './services/authService.js?v=8.0';
      import { renderAppLayout, updateHeaderUser } from './components/layout/AppLayout.js?v=8.0';
      import { renderTrainingCard } from './components/training/TrainingCard.js?v=8.0';
      import { renderStatsView } from './components/stats/StatsView.js?v=8.0';
      import { renderSettingsView } from './components/settings/SettingsView.js?v=8.0';
      import { renderFavoritesView } from './components/favorites/FavoritesView.js?v=8.0';
      import { renderDictionaryView } from './components/dictionary/DictionaryView.js?v=8.0';
      import { renderAuthModal } from './components/auth/AuthModal.js?v=8.0';

      let allWords = [];
      let favoriteIds = new Set();
      let currentWordIndex = 0;
      let activeTab = 'training';
      let userSettings = { enabledMethods: 'quiz,cards,input' };

      async function loadData() {
        try {
          const wordsRes = await getWords();
          if (wordsRes && wordsRes.data && wordsRes.data.length > 0) {
            allWords = wordsRes.data;
          }
        } catch (e) {
          console.warn('Failed to load words:', e);
        }

        try {
          userSettings = await getUserSettings();
        } catch (e) {
          console.warn('Failed to load settings:', e);
        }
      }

      function handleFavoriteToggle(wordId, isFav) {
        if (isFav) favoriteIds.add(wordId);
        else favoriteIds.delete(wordId);

        if (activeTab === 'favorites') {
          renderTab(activeTab);
        }
      }

      async function renderTrainingTab() {
        const content = document.querySelector('#app-content');
        if (!content) return;

        // Check if Guest limit (100 words) has been reached
        if (isGuestLimitReached()) {
          content.innerHTML = `
            <div class="guest-limit-card" style="text-align: center; padding: 32px 18px; background: #ffffff; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
              <div style="font-size: 52px; margin-bottom: 12px;">🎉</div>
              <h2 style="margin: 0 0 10px; font-size: 20px;">Демо-режим завершен</h2>
              <p style="color: var(--text-muted); font-size: 14px; line-height: 1.45; margin: 0 0 20px;">
                Вы отлично позанимались и прошли <strong>${GUEST_WORD_LIMIT} слов</strong>! Чтобы продолжить обучение <strong>без ограничений</strong> и сохранить весь ваш прогресс — зарегистрируйтесь бесплатно.
              </p>
              <button class="primary-button" id="guest-signup-btn" style="margin-bottom: 10px; padding: 12px 16px; font-size: 15px;">
                ✨ Зарегистрироваться бесплатно
              </button>
              <button class="secondary-button" id="guest-login-btn" style="width: 100%; padding: 10px 16px;">
                Уже есть аккаунт? Войти
              </button>
            </div>
          `;

          const signupBtn = content.querySelector('#guest-signup-btn');
          if (signupBtn) {
            signupBtn.addEventListener('click', () => {
              renderAuthModal(async () => {
                updateHeaderUser();
                await loadData();
                renderTrainingTab();
              });
            });
          }

          const loginBtn = content.querySelector('#guest-login-btn');
          if (loginBtn) {
            loginBtn.addEventListener('click', () => {
              renderAuthModal(async () => {
                updateHeaderUser();
                await loadData();
                renderTrainingTab();
              });
            });
          }
          return;
        }

        if (allWords.length === 0) {
          content.innerHTML = '<p class="empty-state">Нет доступных слов для тренировки.</p>';
          return;
        }

        try {
          userSettings = await getUserSettings();
        } catch (e) {
          console.warn('Failed to load settings:', e);
        }

        const categories = Array.from(new Set(allWords.map((w) => w.category).filter(Boolean)));
        const selectedCategory = userSettings.category || 'All';

        let categoryWords = allWords;
        if (selectedCategory && selectedCategory !== 'All' && selectedCategory !== 'Все категории') {
          const filtered = allWords.filter((w) => w.category === selectedCategory);
          if (filtered.length > 0) {
            categoryWords = filtered;
          }
        }

        // Filter out words mastered 3x in text input mode
        const userProgress = getUserProgress();
        const activeWords = categoryWords.filter((w) => {
          const prog = userProgress[w.id];
          return !(prog && (prog.inputCorrect >= 3 || prog.mastered));
        });

        if (activeWords.length === 0) {
          content.innerHTML = `
            <div class="empty-state-card" style="text-align: center; padding: 40px 20px;">
              <div style="font-size: 56px; margin-bottom: 16px;">🏆</div>
              <h2>Поздравляем!</h2>
              <p style="color: var(--text-muted); margin-bottom: 24px;">
                Все слова в категории <strong>«${selectedCategory === 'All' ? 'Все категории' : selectedCategory}»</strong> успешно выучены (3x в режиме Тест)!
              </p>
              <button class="primary-button" id="review-all-btn" style="max-width: 280px; margin: 0 auto;">
                🔄 Повторить категорию заново
              </button>
            </div>
          `;

          const reviewBtn = content.querySelector('#review-all-btn');
          if (reviewBtn) {
            reviewBtn.addEventListener('click', () => {
              categoryWords.forEach((w) => {
                if (userProgress[w.id]) {
                  userProgress[w.id].inputCorrect = 0;
                  userProgress[w.id].mastered = false;
                }
              });
              const user = getCurrentUser();
              const userId = user ? user.id : 'guest';
              localStorage.setItem(`progress_${userId}`, JSON.stringify(userProgress));
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }
          return;
        }

        content.innerHTML = '<div id="training"></div>';
        const currentWord = activeWords[currentWordIndex % activeWords.length];
        const currentMethod = userSettings.preferredMethod || 'quiz';

        renderTrainingCard(currentWord, allWords, {
          currentMethod,
          selectedCategory,
          categories,
          onMethodChange: async (newMethod) => {
            userSettings.preferredMethod = newMethod;
            await saveUserSettings(userSettings);
            renderTrainingTab();
          },
          onCategoryChange: async (newCategory) => {
            userSettings.category = newCategory;
            await saveUserSettings(userSettings);
            currentWordIndex = 0;
            renderTrainingTab();
          },
          isFavorite: favoriteIds.has(currentWord.id),
          onFavoriteToggle: handleFavoriteToggle,
          onNext: () => {
            incrementGuestTrainingCount();
            updateHeaderUser();
            currentWordIndex += 1;
            renderTrainingTab();
          },
        });
      }

      async function renderTab(tabName) {
        activeTab = tabName;
        const content = document.querySelector('#app-content');

        if (tabName === 'training') {
          await renderTrainingTab();
        } else if (tabName === 'stats') {
          await renderStatsView('#app-content');
        } else if (tabName === 'favorites') {
          const favWords = allWords.filter((w) => favoriteIds.has(w.id));
          renderFavoritesView(favWords, '#app-content', {
            onFavoriteToggle: handleFavoriteToggle,
            onRemoveFavorite: (id) => handleFavoriteToggle(id, false),
            onStartFavoritePractice: (practiceWords) => {
              allWords = practiceWords;
              currentWordIndex = 0;
              const tabBtn = document.querySelector('.nav-tab[data-tab="training"]');
              if (tabBtn) tabBtn.click();
            },
          });
        } else if (tabName === 'dictionary') {
          renderDictionaryView(allWords, '#app-content', {
            favoriteIds: Array.from(favoriteIds),
            onFavoriteToggle: handleFavoriteToggle,
          });
        } else if (tabName === 'settings') {
          await renderSettingsView(
            '#app-content',
            async () => {
              updateHeaderUser();
              await loadData();
            },
            allWords
          );
        }
      }

      async function init() {
        await loadData();

        renderAppLayout(
          (tabName) => {
            renderTab(tabName);
          },
          async () => {
            updateHeaderUser();
            await loadData();
            renderTab(activeTab);
          }
        );

        renderTab('training');
      }

      init();
    </script>
  </body>
</html>
