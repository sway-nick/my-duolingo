<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Премиальное веб-приложение для изучения английского языка">
  <meta name="theme-color" content="#6366f1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/css/app.css?v=6.0">
  <title>English Trainer — Изучение английского языка</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.js?v=6.0"></script>
</body>
</html>
