    <script type="module">
      import { getWords, getUserSettings, getUserProgress, getUserFavorites, saveUserSettings, isWordMastered, isWordLearning, getQueueForCards, getQueueForQuiz, getQueueForPairs, getQueueForTest, prepareTrainingBatch, resetWordsProgressForPractice, getLeaderboard, fetchUserDataFromCloud, pushUserDataToCloud, getGlobalWordOfTheDay, getCloudWordOfTheDayId } from './services/api.js?v=200.0';
      import { speakWord, preloadWordAudio } from './services/audioService.js?v=200.0';
      import { getCurrentUser, isGuestLimitReached, incrementGuestTrainingCount, GUEST_WORD_LIMIT } from './services/authService.js?v=200.0';

      // One-time cleanup of phantom words that were never actively learned in Cards
      (function cleanPhantomWords() {
        try {
          const user = getCurrentUser();
          const uId = user ? user.id : 'guest';
          const progKey = 'progress_' + uId;
          const localProg = JSON.parse(localStorage.getItem(progKey) || '{}');
          let changed = false;
          Object.keys(localProg).forEach((id) => {
            const p = localProg[id];
            // If word is not mastered, has no typing inputs, no quiz successes, but accumulated pairs, clear it
            if (p && !p.mastered && (p.inputCorrect || 0) === 0 && (p.quizCorrect || 0) === 0 && (p.pairsCorrect || 0) > 0) {
              delete localProg[id];
              changed = true;
            }
          });
          if (changed) {
            localStorage.setItem(progKey, JSON.stringify(localProg));
          }
        } catch (e) {}
      })();
      import { renderAppLayout, updateHeaderUser } from './components/layout/AppLayout.js?v=200.0';
      import { t, getInterfaceLanguage, getCategoryDetails } from './services/i18n.js?v=200.0';
      import { renderTrainingCard } from './components/training/TrainingCard.js?v=200.0';
      import { renderStatsView } from './components/stats/StatsView.js?v=200.0';
      import { renderSettingsView } from './components/settings/SettingsView.js?v=200.0';
      import { renderFavoritesView } from './components/favorites/FavoritesView.js?v=200.0';
      import { renderDictionaryView } from './components/dictionary/DictionaryView.js?v=200.0';
      import { renderLeaderboardView } from './components/leaderboard/LeaderboardView.js?v=200.0';
      import { renderAuthModal } from './components/auth/AuthModal.js?v=200.0';
      import { initPrizePodiumListener } from './components/modals/PrizePodiumModal.js?v=200.0';

      let allWords = [];
      try {
        const cachedWords = JSON.parse(localStorage.getItem('myduo_cached_words') || '[]');
        if (Array.isArray(cachedWords) && cachedWords.length > 0) {
          allWords = cachedWords;
        }
      } catch (e) {}
      let favoriteIds = new Set();
      let favoritePracticeWords = null;
      let currentWordIndex = 0;
      let activeTab = 'training';
      let userSettings = { enabledMethods: 'quiz,cards,input', dailyGoal: 10 };
      let cloudWordOfTheDayId = null;
      let wotdPlaylist = ["cat1.mp4","cat2.mp4","cat3.mp4","cat4.mp4","cat5.mp4"];

      // Fetch dynamic playlist if available
      try {
        fetch('assets/video/playlist.json?v=' + Date.now())
          .then((r) => r.json())
          .then((list) => {
            if (Array.isArray(list) && list.length > 0) {
              wotdPlaylist = list;
              preloadNextWotdVideo();
            }
          })
          .catch(() => {});
      } catch (e) {}

      function preloadNextWotdVideo() {
        try {
          let currentIdx = parseInt(localStorage.getItem('myduo_wotd_video_idx') || '0', 10);
          if (isNaN(currentIdx) || currentIdx < 0) currentIdx = 0;
          const selectedVideo = wotdPlaylist[currentIdx % wotdPlaylist.length];
          const videoUrl = 'assets/video/' + selectedVideo;

          // Preload via background video element into memory buffer (clean, no console warnings)
          if (!window._wotdPreloadVideo) {
            window._wotdPreloadVideo = document.createElement('video');
            window._wotdPreloadVideo.preload = 'auto';
            window._wotdPreloadVideo.muted = true;
            window._wotdPreloadVideo.playsInline = true;
          }
          if (window._wotdPreloadVideo.src !== window.location.origin + '/' + videoUrl && !window._wotdPreloadVideo.src.endsWith(videoUrl)) {
            window._wotdPreloadVideo.src = videoUrl;
            window._wotdPreloadVideo.load();
          }
        } catch (e) {}
      }

      async function loadData() {
        const user = getCurrentUser();

        try {
          await Promise.allSettled([
            (user && user.id && user.id !== 'guest')
              ? fetchUserDataFromCloud(user.id).catch((e) => console.warn('Cloud sync error:', e))
              : Promise.resolve(),
            getWords(false).then((wordsRes) => {
              if (wordsRes && wordsRes.data && wordsRes.data.length > 0) {
                allWords = wordsRes.data;
              }
            }).catch((e) => console.warn('Words load error:', e))
          ]);
        } catch (e) {}

        try {
          userSettings = await getUserSettings();
        } catch (e) {
          console.warn('Failed to load settings:', e);
        }

        try {
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
        } catch (e) {
          console.warn('Failed to load favorites:', e);
        }

        try {
          getLeaderboard().catch(() => {});
          // Global background sync every 1 hour for all players
          if (!window._globalLeaderboardSyncTimer) {
            window._globalLeaderboardSyncTimer = setInterval(() => {
              getLeaderboard().catch(() => {});
            }, 3600000);
          }
        } catch (e) {}

        try {
          getCloudWordOfTheDayId(user ? user.id : 'guest').then((cId) => {
            if (cId) {
              cloudWordOfTheDayId = cId;
              const w = allWords.find(item => String(item.id) === cloudWordOfTheDayId);
              if (w) {
                preloadWordAudio(w.word);
              }
            }
          }).catch(() => {});
        } catch (e) {}
      }

      function handleFavoriteToggle(wordId, isFav) {
        const idStr = String(wordId);
        if (isFav) favoriteIds.add(idStr);
        else favoriteIds.delete(idStr);

        if (activeTab === 'favorites') {
          renderTab(activeTab);
        }
      }

      if (typeof window !== 'undefined') {
        window.addEventListener('myduo_words_updated', (e) => {
          allWords = e.detail;
          if (activeTab && typeof renderTab === 'function') {
            try {
              renderTab(activeTab);
            } catch (err) {}
          }
        });
      }

        function sanitizeCategory(cat) {
          if (!cat) return 'Общие';
          return String(cat)
            .replace(/\s*[•\-–—]?\s*[A-C][1-2].*$/i, '')
            .trim() || String(cat).trim();
        }

        const CANONICAL_CATEGORY_ORDER = ['Elementary', 'Irregular verb', 'Pattern', 'Intermediate', 'Advanced'];

        function getCategoryOrderIndex(catName) {
          const clean = String(catName || '').toLowerCase().trim();
          if (clean.includes('elementary')) return 0;
          if (clean.includes('irregular')) return 1;
          if (clean.includes('pattern')) return 2;
          if (clean.includes('intermediate')) return 3;
          if (clean.includes('advanced')) return 4;
          return 999;
        }

        function getNextSequentialCategory(currentCat, availableCats) {
          const currentIdx = getCategoryOrderIndex(currentCat);
          if (currentIdx === 999) return null;
          for (let i = currentIdx + 1; i < CANONICAL_CATEGORY_ORDER.length; i++) {
            const found = availableCats.find((c) => getCategoryOrderIndex(c) === i);
            if (found) return found;
          }
          return null;
        }

        const categories = Array.from(new Set(allWords.map((w) => sanitizeCategory(w.category)).filter(Boolean)))
          .sort((a, b) => {
            const diff = getCategoryOrderIndex(a) - getCategoryOrderIndex(b);
            if (diff !== 0) return diff;
            return a.localeCompare(b);
          });
        let selectedCategory = userSettings.category || 'Elementary';
        if (selectedCategory === 'All' || selectedCategory === 'Все категории') {
          selectedCategory = 'Elementary';
          userSettings.category = 'Elementary';
          saveUserSettings(userSettings);
        }

        let categoryWords = allWords;
        if (selectedCategory && selectedCategory !== 'All' && selectedCategory !== 'Все категории') {
          const filtered = allWords.filter(
            (w) => sanitizeCategory(w.category) === sanitizeCategory(selectedCategory)
          );
          if (filtered.length > 0) {
            categoryWords = filtered;
          }
        }
        categoryWords.sort((a, b) => (Number(b.zipf) || 0) - (Number(a.zipf) || 0));

        const userProgress = getUserProgress();
        let currentMethod = userSettings.preferredMethod || 'cards';
        const favList = getUserFavorites();
        const favSet = new Set(favList.map(String));
        favoriteIds = favSet;

        // Check if practicing favorites mode is active
        const isFavPracticeActive = Boolean(favoritePracticeWords && favoritePracticeWords.length > 0);
        if (isFavPracticeActive) {
          categoryWords = favoritePracticeWords;
        }

        const dailyGoal = Number(userSettings.dailyGoal) || 10;
        const totalLearningWords = categoryWords.filter((w) => isWordLearning(userProgress[w.id]));
        const learningCount = totalLearningWords.length;

        const favListForMixing = isFavPracticeActive ? [] : favList;

        const cardsQueue = getQueueForCards(categoryWords, userProgress);
        const quizQueue = getQueueForQuiz(categoryWords, userProgress);
        const pairsQueue = getQueueForPairs(categoryWords, userProgress);
        const testQueue = getQueueForTest(categoryWords, userProgress);

        function isMethodAvailable(method) {
          if (method === 'cards') return !isFavPracticeActive && (cardsQueue.length > 0 && learningCount < dailyGoal);
          if (method === 'quiz') return quizQueue.length > 0;
          if (method === 'pairs') return pairsQueue.length > 0;
          if (method === 'input') return testQueue.length > 0;
          return false;
        }

        // SMART ACTIVE MODE RESOLUTION:
        // Automatically advance along the training conveyor: Quiz -> Pairs -> Test.
        // If 0 words in learning or window._showHubScreen is true, show the clean Hub screen.
        if (!isFavPracticeActive) {
          if (window._showHubScreen || (learningCount === 0 && !window._explicitCardsOpened)) {
            currentMethod = 'input';
          } else if (currentMethod === 'cards') {
            // While user is in Cards mode, they continue selecting words until reaching dailyGoal (10 words)
            if (cardsQueue.length === 0 && learningCount === 0) {
              currentMethod = 'input';
            }
          } else if (!isMethodAvailable(currentMethod)) {
            // STRICT FORWARD-ONLY CONVEYOR PROGRESSION:
            // Cards -> Quiz -> Pairs -> Test -> Finished (Hub)
            // Once user is in Pairs, next mode is STRICTLY ONLY Test!
            if (currentMethod === 'cards') {
              if (quizQueue.length > 0) currentMethod = 'quiz';
              else if (pairsQueue.length > 0) currentMethod = 'pairs';
              else if (testQueue.length > 0) currentMethod = 'input';
              else currentMethod = 'input';
            } else if (currentMethod === 'quiz') {
              if (pairsQueue.length > 0) currentMethod = 'pairs';
              else if (testQueue.length > 0) currentMethod = 'input';
              else currentMethod = 'input';
            } else if (currentMethod === 'pairs') {
              // After Pairs, STRICTLY proceed ONLY to Test! Never regress to Quiz!
              currentMethod = 'input';
            } else if (currentMethod === 'input') {
              currentMethod = 'input';
            }
          }
        }

        // In Cards mode: if user reached their daily learning limit, show clean message
        if (!isFavPracticeActive && currentMethod === 'cards' && learningCount >= dailyGoal) {
          const congratsText = getInterfaceLanguage() === 'ru' 
            ? `Отлично!<br/>Вы отобрали ${learningCount} слов для изучения`
            : getInterfaceLanguage() === 'uk'
              ? `Відмінно!<br/>Ви відібрали ${learningCount} слів для вивчення`
              : `Excellent!<br/>You selected ${learningCount} words for study`;

          let nextBtnTarget = 'quiz';
          let nextBtnText = getInterfaceLanguage() === 'ru' ? '🎯 Перейти в Квиз' : getInterfaceLanguage() === 'uk' ? '🎯 Перейти до Квізу' : '🎯 Go to Quiz';

          if (quizQueue.length > 0) {
            nextBtnTarget = 'quiz';
            nextBtnText = '🎯 ' + t('train_go_quiz');
          } else if (pairsQueue.length > 0) {
            nextBtnTarget = 'pairs';
            nextBtnText = '🧩 ' + t('train_go_pairs');
          } else if (testQueue.length > 0) {
            nextBtnTarget = 'input';
            nextBtnText = '✍️ ' + t('train_go_test');
          }

          content.innerHTML = `
            <div class="empty-state-card" style="text-align: center; padding: 40px 20px;">
              <div style="font-size: 56px; margin-bottom: 18px;">👍</div>
              <p style="color: var(--text-main); font-size: 19px; font-weight: 700; margin-bottom: 26px; line-height: 1.45;">
                ${congratsText}
              </p>
              <div style="width: 100%; max-width: 340px; margin: 0 auto;">
                <button class="primary-button btn-green" id="go-quiz-btn" style="min-height: 44px; font-weight: 700;">
                  ${nextBtnText}
                </button>
              </div>
            </div>
          `;

          const goQuizBtn = content.querySelector('#go-quiz-btn');
          if (goQuizBtn) {
            goQuizBtn.addEventListener('click', () => {
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              prepareTrainingBatch(categoryWords, getUserProgress(), favList);
              userSettings.preferredMethod = nextBtnTarget;
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }
          return;
        }

        // Filter words strictly based on the active training method queue
        let activeWords = [];
        if (window._showHubScreen) {
          // Hub choice screen requested: force empty activeWords to display Hub options!
          activeWords = [];
          currentMethod = 'input';
        } else if (currentMethod === 'cards') {
          activeWords = getQueueForCards(categoryWords, userProgress);
        } else if (currentMethod === 'quiz') {
          activeWords = quizQueue;
        } else if (currentMethod === 'pairs') {
          activeWords = pairsQueue;
        } else if (currentMethod === 'input') {
          // 10 new words + up to 5 favorites + up to 5 mastered retention = max 20 words!
          activeWords = testQueue.slice(0, 20);
        }

        // Check if all words in category/favorites are mastered (3x in Test)
        const unmasteredCount = categoryWords.filter((w) => !isWordMastered(userProgress[w.id])).length;
        if (unmasteredCount === 0 && categoryWords.length > 0) {
          const nextCategory = isFavPracticeActive ? null : getNextSequentialCategory(selectedCategory, categories);

            ? (getInterfaceLanguage() === 'ru' ? `Вы успешно изучили все <strong>${favoritePracticeWords.length}</strong> избранных слов (2x в режиме Тест)!` : getInterfaceLanguage() === 'uk' ? `Ви успішно вивчили всі <strong>${favoritePracticeWords.length}</strong> обраних слів (2x у режимі Тест)!` : `You have successfully learned all <strong>${favoritePracticeWords.length}</strong> favorite words (2x in Test mode)!`)
            : (getInterfaceLanguage() === 'ru' ? `Все слова в категории <strong>«${selectedCategory === 'All' ? 'Все категории' : selectedCategory}»</strong> успешно выучены (2x в режиме Тест)!` : getInterfaceLanguage() === 'uk' ? `Всі слова в категорії <strong>«${selectedCategory === 'All' ? t('dict_filter_all') : selectedCategory}»</strong> успішно вивчені (2x у режимі Тест)!` : `All words in category <strong>"${selectedCategory === 'All' ? t('dict_filter_all') : selectedCategory}"</strong> have been successfully learned (2x in Test mode)!`);

          let nextCatBtnHtml = '';
          if (nextCategory) {
            const nextBtnLabel = getInterfaceLanguage() === 'ru'
              ? `Перейти к группе «${nextCategory}» 🚀`
              : getInterfaceLanguage() === 'uk'
                ? `Перейти до групи «${nextCategory}» 🚀`
                : `Go to "${nextCategory}" group 🚀`;
            nextCatBtnHtml = `
              <button class="primary-button btn-green" id="next-category-btn" style="min-height: 46px; font-weight: 700;">
                ${nextBtnLabel}
              </button>
            `;
          }

          content.innerHTML = `
            <div class="empty-state-card" style="text-align: center; padding: 40px 20px;">
              <div style="font-size: 56px; margin-bottom: 16px;">🎉</div>
              <h2 style="margin: 0 0 10px;">${title}</h2>

                  ${t('train_review_again')}

                  isFavPracticeActive

                  <button class="secondary-button" id="exit-favs-btn" style="min-height: 46px;">

                  </button>

                    : ''

              </div>
            </div>
          `;

          const nextCatBtn = content.querySelector('#next-category-btn');
          if (nextCatBtn && nextCategory) {
            nextCatBtn.addEventListener('click', () => {
              localStorage.setItem('myduo_dict_category', nextCategory);
              userSettings.category = nextCategory;
              userSettings.preferredMethod = 'cards';
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();

          const exitFavsBtn = content.querySelector('#exit-favs-btn');
          if (exitFavsBtn) {
            exitFavsBtn.addEventListener('click', () => {
              favoritePracticeWords = null;
              currentWordIndex = 0;
              renderTrainingTab();

          }

          const reviewBtn = content.querySelector('#review-all-btn');
          if (reviewBtn) {
            reviewBtn.addEventListener('click', () => {
              categoryWords.forEach((w) => {
                if (userProgress[w.id]) {
                  userProgress[w.id].inputCorrect = 0;
                  userProgress[w.id].quizCorrect = 0;
                  userProgress[w.id].pairsCorrect = 0;
                  userProgress[w.id].seenInCards = true;
                  userProgress[w.id].mastered = false;
                  userProgress[w.id].learning = true;
                }
              });
              const userId = userSettings.userId || 'guest';
              localStorage.setItem(`progress_${userId}`, JSON.stringify(userProgress));
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }
          return;
        }

        // If queue for the current mode is empty, show intuitive step guidance
        if (activeWords.length === 0) {
          const pairsQueue = getQueueForPairs(categoryWords, userProgress, favList);
          const testQueue = getQueueForTest(categoryWords, userProgress, favList);

          // If words completed Quiz -> show completion card with button to Pairs (like Cards mode)
          if (currentMethod === 'quiz' && pairsQueue.length > 0) {

                  ${getInterfaceLanguage() === 'ru' ? 'Отлично!<br/>Все слова в этом режиме изучены!' : getInterfaceLanguage() === 'uk' ? 'Відмінно!<br/>Всі слова в цьому режимі вивчені!' : 'Excellent!<br/>All words in this mode have been mastered!'}
                </p>
                <div style="width: 100%; max-width: 340px; margin: 0 auto;">
                  <button class="primary-button btn-green" id="go-pairs-btn">
                    ${t('train_go_pairs')}
                  </button>
                </div>
              </div>
            `;

            const goPairsBtn = content.querySelector('#go-pairs-btn');
            if (goPairsBtn) {
              goPairsBtn.addEventListener('click', () => {
                userSettings.preferredMethod = 'pairs';
                saveUserSettings(userSettings);
                currentWordIndex = 0;
                renderTrainingTab();
              });
            }
            return;
          }

          // If words completed Pairs -> show completion card with button to Test
          if (currentMethod === 'pairs' && testQueue.length > 0) {
            content.innerHTML = `
              <div class="empty-state-card" style="text-align: center; padding: 40px 20px;">
                <div style="font-size: 56px; margin-bottom: 18px;">👍</div>
                <p style="color: var(--text-main); font-size: 19px; font-weight: 700; margin-bottom: 26px; line-height: 1.45;">
                  ${getInterfaceLanguage() === 'ru' ? 'Отлично!<br/>Все слова в этом режиме изучены!' : getInterfaceLanguage() === 'uk' ? 'Відмінно!<br/>Всі слова в цьому режимі вивчені!' : 'Excellent!<br/>All words in this mode have been mastered!'}
                </p>
                <div style="width: 100%; max-width: 340px; margin: 0 auto;">
                  <button class="primary-button btn-green" id="go-test-btn">
                    ${t('train_go_test')}
                  </button>
                </div>
              </div>
            `;

            const goTestBtn = content.querySelector('#go-test-btn');
            if (goTestBtn) {
              goTestBtn.addEventListener('click', () => {
                userSettings.preferredMethod = 'input';
                saveUserSettings(userSettings);
                currentWordIndex = 0;
                renderTrainingTab();
              });
            }
            return;
          }

          const hasQuiz = quizQueue.length > 0;
          const hasPairs = pairsQueue.length > 0;
          const hasTest = testQueue.length > 0;
          const hasCards = cardsQueue.length > 0 && learningCount < dailyGoal;

          let emptyIcon = '🗂️';
          let emptyTitle = getInterfaceLanguage() === 'ru' ? 'Очередь пуста' : getInterfaceLanguage() === 'uk' ? 'Черга порожня' : 'Queue is empty';
          let emptyMsg = getInterfaceLanguage() === 'ru' ? 'Сначала отберите слова в режиме «Карточки»!' : getInterfaceLanguage() === 'uk' ? 'Спочатку відберіть слова в режимі «Картки»!' : 'Select words in "Cards" mode first!';
          let nextMode = 'cards';
          let nextBtnLabel = getInterfaceLanguage() === 'ru' ? '🗂️ Открыть Карточки' : getInterfaceLanguage() === 'uk' ? '🗂️ Відкрити Картки' : '🗂️ Open Cards';

          if (currentMethod === 'quiz') {
            emptyIcon = '🎯';
            emptyTitle = t('train_no_words_quiz');
            emptyMsg = '';
            if (hasPairs) {
              nextMode = 'pairs';
              nextBtnLabel = '🧩 ' + t('train_go_pairs');
            } else if (hasTest) {
              nextMode = 'input';
              nextBtnLabel = '✍️ ' + t('train_go_test');
            } else {
              nextMode = 'cards';
              nextBtnLabel = getInterfaceLanguage() === 'ru' ? '🗂️ Отобрать слова в Карточках' : getInterfaceLanguage() === 'uk' ? '🗂️ Відібрати слова в Картках' : '🗂️ Select words in Cards';
            }
          } else if (currentMethod === 'pairs') {
            emptyIcon = '🧩';
            emptyTitle = t('train_no_words_pairs');
            emptyMsg = t('train_no_words_pairs_sub');
            // After Pairs, next mode is STRICTLY Test!
            if (hasTest) {
              nextMode = 'input';
              nextBtnLabel = '✍️ ' + t('train_go_test');
            } else {
              nextMode = 'input';
              nextBtnLabel = '✍️ ' + t('train_go_test');
            }
          } else if (currentMethod === 'input' || window._showHubScreen || learningCount === 0) {
            // On Hub Choice Screen: buttons are ALWAYS permanently consistent:
            // 1. Continue round
            // 2. Select category (ALWAYS "Выбрать категорию")
            // 3. Repeat favorites
            emptyIcon = '';
            emptyTitle = '';
            emptyMsg = '';
            nextMode = 'select_category';
            nextBtnLabel = t('train_select_category');

            if (unmasteredCount === 0 && !window._showHubScreen) {
              emptyIcon = '🏆';
              emptyTitle = getInterfaceLanguage() === 'ru' ? 'Отлично!<br>Задача выполнена!' : getInterfaceLanguage() === 'uk' ? 'Відмінно!<br>Завдання виконано!' : 'Excellent!<br>Goal achieved!';
            }
          }

          let wotdHtml = '';
          const wotd = getGlobalWordOfTheDay(allWords, cloudWordOfTheDayId);
          let isWotdFav = false;
          let currentWotdVideo = 'cat1.mp4';
          const isTrainingRoundJustCompleted = Boolean(window._trainingRoundJustCompleted);

          if (wotd && currentMethod === 'input' && (!activeWords || activeWords.length === 0) && isTrainingRoundJustCompleted) {
            try {
              const roundKey = 'myduo_rounds_count_' + getEffectiveUserId();
              localStorage.setItem(roundKey, String(Number(localStorage.getItem(roundKey) || 0) + 1));

            preloadWordAudio(wotd.word);
            const favList = getUserFavorites();
            const favSet = new Set(favList.map(String));
            isWotdFav = favSet.has(String(wotd.id));

            let currentIdx = parseInt(localStorage.getItem('myduo_wotd_video_idx') || '0', 10);
            if (isNaN(currentIdx) || currentIdx < 0) currentIdx = 0;
            currentWotdVideo = wotdPlaylist[currentIdx % wotdPlaylist.length];

            wotdHtml = `
              <div class="wotd-bonus-section" style="margin-top: 30px;">

                     <div class="flashcard-face flashcard-front" style="min-height: 220px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between;">

                            <span class="crown-glint sparkle-active" aria-hidden="true"></span>

                         <span class="wotd-card-badge">${t('word_of_day')}</span>
                         <button type="button" class="flashcard-fav-btn ${isWotdFav ? 'is-favorite' : ''}" id="wotd-fav-front" title="В Избранное">

                         </button>
                       </div>
                       <div class="flashcard-face-body" style="justify-content: center; display: flex; flex-direction: column; flex: 1;">

                       </div>

                       <div class="flashcard-face-top" style="z-index: 2;">

            ? `
              <button class="primary-button btn-green" id="go-continue-cards-btn" style="min-height: ${hasWotdCard ? '46px' : '52px'}; font-size: 16px; font-weight: 700;">
                ${t('train_continue_round')}
              </button>

            : '';

          content.innerHTML = `

                }
              </div>
              ${wotdHtml}
            </div>
          `;

          if (wotd && currentMethod === 'input' && (!activeWords || activeWords.length === 0)) {
            const flashcard = content.querySelector('#wotd-flashcard-3d');
            if (flashcard) {
              let isFlipped = false;
              let videoStarted = false;

              const cardVideo = flashcard.querySelector('#wotd-card-video');
              const videoContainer = flashcard.querySelector('#wotd-video-container');

              // Immediately pre-buffer video into memory
              if (cardVideo) {
                cardVideo.load();
              }

              flashcard.addEventListener('click', (e) => {
                if (e.target.closest('.flashcard-sound-btn') || e.target.closest('.flashcard-crown-btn') || e.target.closest('.flashcard-fav-btn')) {
                  return;
                }

                isFlipped = !isFlipped;
                flashcard.classList.toggle('is-flipped', isFlipped);
                flashcard.classList.remove('gleam-active');
                requestAnimationFrame(() => {
                  flashcard.classList.add('gleam-active');
                });

                // Trigger crown horn sparkle glint on the newly visible side
                const activeFace = isFlipped ? flashcard.querySelector('.flashcard-back') : flashcard.querySelector('.flashcard-front');
                const crownGlint = activeFace ? activeFace.querySelector('.crown-glint') : null;
                if (crownGlint) {
                  crownGlint.classList.remove('sparkle-active');
                  requestAnimationFrame(() => {
                    crownGlint.classList.add('sparkle-active');
                  });
                }

                if (isFlipped) {
                  if (!videoStarted && cardVideo && videoContainer) {
                    videoStarted = true;

                    let currentIdx = parseInt(localStorage.getItem('myduo_wotd_video_idx') || '0', 10);
                    if (isNaN(currentIdx) || currentIdx < 0) currentIdx = 0;

                    // Advance index for next time and preload next video
                    localStorage.setItem('myduo_wotd_video_idx', String((currentIdx + 1) % wotdPlaylist.length));
                    preloadNextWotdVideo();

                    let isVideoRevealed = false;
                    const revealVideo = () => {
                      if (isVideoRevealed || !isFlipped) return;
                      isVideoRevealed = true;
                      videoContainer.style.display = 'block';
                      requestAnimationFrame(() => {
                        videoContainer.style.opacity = '1';
                      });
                    };

                    const dismissVideo = () => {
                      videoContainer.style.opacity = '0';
                      setTimeout(() => {
                        if (!isFlipped || cardVideo.ended || cardVideo.paused) {
                          videoContainer.style.display = 'none';
                        }
                      }, 250);
                    };

                    // Reveal video strictly when first real frame starts playing (prevents black screen!)
                    cardVideo.addEventListener('playing', revealVideo, { once: true });
                    cardVideo.addEventListener('timeupdate', () => {
                      if (cardVideo.currentTime > 0.05) revealVideo();
                    }, { once: true });

                    cardVideo.addEventListener('ended', () => {
                      dismissVideo();
                    }, { once: true });

                    cardVideo.addEventListener('error', () => {
                      dismissVideo();
                    }, { once: true });

                    // Watchdog: give mobile network 8s to buffer before falling back to translation
                    setTimeout(() => {
                      if (!isVideoRevealed) {
                        dismissVideo();
                      }
                    }, 8000);

                    cardVideo.muted = false;
                    cardVideo.volume = 1.0;

                    const playPromise = cardVideo.play();
                    if (playPromise !== undefined) {
                      playPromise.catch((err) => {
                        console.warn('Playback with sound prevented by browser policy, falling back to muted autoplay:', err);
                        cardVideo.muted = true;
                        cardVideo.play().catch((e) => {
                          console.error('Video play error:', e);
                          dismissVideo();
                        });
                      });
                    }
                  }
                } else {
                  if (cardVideo && !cardVideo.paused) {
                    cardVideo.pause();
                  }
                  if (videoContainer) {
                    videoContainer.style.opacity = '0';
                    videoContainer.style.display = 'none';
                  }
                  speakWord(wotd.word);
                }
              });

              const speakButtons = content.querySelectorAll('#wotd-sound-front, #wotd-sound-back');
              speakButtons.forEach((btn) => {
                btn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  speakWord(wotd.word);
                });
              });

              const favButtons = content.querySelectorAll('#wotd-fav-front, #wotd-fav-back');
              favButtons.forEach((btn) => {
                btn.addEventListener('click', async (e) => {
                  e.stopPropagation();
                  isWotdFav = !isWotdFav;
                  handleFavoriteToggle(wotd.id, isWotdFav);
                  favButtons.forEach((b) => {
                    b.classList.toggle('is-favorite', isWotdFav);
                    b.innerHTML = isWotdFav ? '❤️' : '🤍';
                  });
                });
              });
            }
          }

          function renderCategorySelectorScreen() {
            const content = document.querySelector('#app-content');
            if (!content) return;

            // Dynamically extract all unique categories directly from allWords (Google Sheets)
            const rawCategories = Array.from(
              new Set(allWords.map((w) => sanitizeCategory(w.category)).filter(Boolean))
            );

            // Smart sort: foundational levels first, then any custom categories alphabetically
            const categoriesList = rawCategories.sort((a, b) => {
              const getOrderIndex = (catName) => {
                const clean = String(catName || '').toLowerCase().trim();
                if (clean.includes('elementary')) return 0;
                if (clean.includes('irregular')) return 1;
                if (clean.includes('pattern')) return 2;
                if (clean.includes('intermediate')) return 3;
                if (clean.includes('advanced')) return 4;
                return 999;
              };
              const diff = getOrderIndex(a) - getOrderIndex(b);
              if (diff !== 0) return diff;
              return a.localeCompare(b);
            });

            const currentCat = userSettings.category || 'Elementary';

            const tilesHtml = categoriesList.map((catKey) => {
              const details = getCategoryDetails(catKey);
              const catWords = allWords.filter(
                (w) => sanitizeCategory(w.category) === sanitizeCategory(catKey)
              );
              const count = catWords.length;
              const isCurrent = sanitizeCategory(currentCat) === sanitizeCategory(catKey);

              return `
                <div class="dict-card category-tile-card ${isCurrent ? 'active' : ''}" data-category="${catKey}">
                  <div class="dict-card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span class="category-badge">${catKey}</span>
                    <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">${count} ${t('words')}</span>
                  </div>
                  <div class="dict-card-body">
                    <h3 style="margin: 0 0 4px; font-size: 17px; font-weight: 700;">${details.title}</h3>
                    <p class="dict-translation" style="margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.35;">${details.desc}</p>
                  </div>
                </div>
              `;
            }).join('');

            content.innerHTML = `
              <div class="category-select-page" style="width: 100%; max-width: 600px; margin: 0 auto; padding: 10px 4px 24px; box-sizing: border-box;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
                  <div>
                    <h2 style="margin: 0 0 4px; font-size: 21px; font-weight: 800;">${t('train_categories_title')}</h2>
                    <p style="margin: 0; font-size: 13.5px; color: var(--text-muted);">${t('train_categories_sub')}</p>
                  </div>
                  <button type="button" id="cat-select-back-btn" class="secondary-button" style="width: auto; padding: 6px 14px; font-size: 14px; font-weight: 600; border-radius: 8px;">
                    ✕
                  </button>
                </div>

                <div class="dictionary-grid category-tiles-grid" style="width: 100%;">
                  ${tilesHtml}
                </div>
              </div>
            `;

            content.querySelector('#cat-select-back-btn')?.addEventListener('click', () => {
              renderTrainingTab();
            });

            content.querySelectorAll('.category-tile-card').forEach((card) => {
              card.addEventListener('click', () => {
                const chosenCat = card.getAttribute('data-category');
                if (chosenCat) {
                  favoritePracticeWords = null;
                  userSettings.category = chosenCat;
                  userSettings.preferredMethod = 'cards';
                  window._explicitCardsOpened = true;
                  window._trainingRoundJustCompleted = false;
                  saveUserSettings(userSettings);
                  currentWordIndex = 0;
                  renderTrainingTab();
                }
              });
            });
          }

          const continueCardsBtn = content.querySelector('#go-continue-cards-btn');
          if (continueCardsBtn) {
            continueCardsBtn.addEventListener('click', () => {
              window._showHubScreen = false;
              if (learningCount === 0) {
                window._explicitCardsOpened = true;
                userSettings.preferredMethod = 'cards';
              } else {
                window._explicitCardsOpened = false;
                if (quizQueue.length > 0) userSettings.preferredMethod = 'quiz';
                else if (pairsQueue.length > 0) userSettings.preferredMethod = 'pairs';
                else if (testQueue.length > 0) userSettings.preferredMethod = 'input';
                else userSettings.preferredMethod = 'cards';
              }
              window._trainingRoundJustCompleted = false;
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }

          const goBtn = content.querySelector('#go-next-mode-btn');
          if (goBtn) {
            goBtn.addEventListener('click', () => {
              if (nextMode === 'select_category') {
                renderCategorySelectorScreen();
                return;
              }
              if (nextMode === 'cards') {
                window._explicitCardsOpened = true;
              } else {
                window._explicitCardsOpened = false;
              }
              window._trainingRoundJustCompleted = false;
              userSettings.preferredMethod = nextMode;
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }

          const repeatFavsBtn = content.querySelector('#go-repeat-favs-btn');
          if (repeatFavsBtn) {
            repeatFavsBtn.addEventListener('click', () => {
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              const favList = getUserFavorites();
              const favIds = new Set(favList.map(String));
              const favWords = allWords.filter((w) => favIds.has(String(w.id)));
              if (favWords && favWords.length > 0) {
                favoritePracticeWords = [...favWords];
                resetWordsProgressForPractice(favWords);
                userSettings.preferredMethod = 'quiz';
                saveUserSettings(userSettings);
                currentWordIndex = 0;
                renderTrainingTab();
              } else {
                const tabBtn = document.querySelector('.nav-tab[data-tab="favorites"]');
                if (tabBtn) {
                  tabBtn.click();
                } else {
                  renderTab('favorites');
                }
              }
            });
          }
          return;
        }

        content.innerHTML = '<div id="training"></div>';
        const currentWord = activeWords[currentWordIndex % activeWords.length];

        const isFav =
          Boolean(currentWord) &&
          (favSet.has(String(currentWord.id)) ||
            (currentWord.word && favSet.has(String(currentWord.word).toLowerCase().trim())));

        const availableModes = {
          cards: isFavPracticeActive ? false : (cardsQueue.length > 0 && learningCount < dailyGoal),
          quiz: quizQueue.length > 0,
          pairs: pairsQueue.length > 0,
          input: testQueue.length > 0,
        };

        renderTrainingCard(currentWord, allWords, {
          currentMethod,
          selectedCategory,
          categories,
          activeWords,
          learningCount,
          dailyGoal,
          availableModes,
          onCategoryBadgeClick: () => {
            renderCategorySelectorScreen();
          },
          onMethodChange: (newMethod) => {
            userSettings.preferredMethod = newMethod;
            saveUserSettings(userSettings);
            currentWordIndex = 0;
            renderTrainingTab();
          },
          onCategoryChange: (newCategory) => {
            favoritePracticeWords = null;
            userSettings.category = newCategory;
            saveUserSettings(userSettings);
            currentWordIndex = 0;
            renderTrainingTab();
          },
          isFavorite: isFav,
          onFavoriteToggle: handleFavoriteToggle,
          onNext: (opts = {}) => {
            incrementGuestTrainingCount();
            updateHeaderUser();

            if (opts && opts.repeatSoon) {
              // Re-insert hard word 3 positions later so the user repeats it soon in this session
              const insertPos = Math.min(currentWordIndex + 3, activeWords.length);
              activeWords.splice(insertPos, 0, currentWord);
            }

            currentWordIndex += 1;
            renderTrainingTab();
          },
        });
      }

      async function renderTab(tabName) {
        activeTab = tabName;
        const content = document.querySelector('#app-content');

        if (tabName !== 'training') {
          favoritePracticeWords = null;
        }

        if (tabName === 'training') {
          await renderTrainingTab();
        } else if (tabName === 'stats') {
          await renderStatsView(allWords, '#app-content');
        } else if (tabName === 'favorites') {
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
          const favWords = allWords.filter((w) => favoriteIds.has(String(w.id)));
          renderFavoritesView(favWords, '#app-content', {
            onFavoriteToggle: handleFavoriteToggle,
            onRemoveFavorite: (id) => handleFavoriteToggle(id, false),
            onStartFavoritePractice: (practiceWords) => {
              if (practiceWords && practiceWords.length > 0) {
                favoritePracticeWords = [...practiceWords];
                resetWordsProgressForPractice(practiceWords);
              } else {
                favoritePracticeWords = null;
              }
              userSettings.preferredMethod = 'quiz';
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              const tabBtn = document.querySelector('.nav-tab[data-tab="training"]');
              if (tabBtn) {
                tabBtn.click();
              } else {
                renderTab('training');
              }
            },
          });
        } else if (tabName === 'leaderboard') {
          await renderLeaderboardView('#app-content', {
            onUserChange: async () => {
              updateHeaderUser();
              await loadData();
            },
          });
        } else if (tabName === 'dictionary') {
          renderDictionaryView(allWords, '#app-content', {
            favoriteIds: Array.from(favoriteIds),
            onFavoriteToggle: handleFavoriteToggle,
          });
        } else if (tabName === 'settings') {
          await renderSettingsView(
            '#app-content',
            async () => {
              updateHeaderUser();
              await loadData();
            },
            allWords
          );
        }
      }

      async function init() {
        window._explicitCardsOpened = false;
        window._trainingRoundJustCompleted = false;
        initPrizePodiumListener();
        preloadNextWotdVideo();

        // 1. Instant local cache restore (0ms)
        try {
          const cachedRaw = localStorage.getItem('myduo_cached_words');
          if (cachedRaw) {
            const parsed = JSON.parse(cachedRaw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              allWords = parsed;
            }
          }
        } catch (e) {}

        try {
          const localSettings = localStorage.getItem('myduo_user_settings');
          if (localSettings) {
            userSettings = { ...userSettings, ...JSON.parse(localSettings) };
          }
        } catch (e) {}

        try {
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
        } catch (e) {}

        window.addEventListener('myduo:auth_changed', async (e) => {
          const user = e.detail?.user || getCurrentUser();
          if (user && user.id) {
            await fetchUserDataFromCloud(user.id);
            pushUserDataToCloud(user.id);
          }
          updateHeaderUser();
          await loadData();
          renderTab(activeTab);
        });

        window.addEventListener('myduo:cloud_synced', async () => {
          updateHeaderUser();
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
          if (activeTab === 'stats' || activeTab === 'favorites' || activeTab === 'leaderboard') {
            renderTab(activeTab);
          }
        });

        window.addEventListener('myduo:lang_changed', () => {
          const drawer = document.querySelector('#burger-drawer');
          if (drawer) {
            const tabsDef = [
              { tab: 'training', key: 'training' },
              { tab: 'leaderboard', key: 'leaderboard' },
              { tab: 'dictionary', key: 'dictionary' },
              { tab: 'favorites', key: 'favorites' },
              { tab: 'stats', key: 'stats' },
              { tab: 'settings', key: 'settings' }
            ];
            tabsDef.forEach(({ tab, key }) => {
              const tabEl = drawer.querySelector(`.nav-tab[data-tab="${tab}"]`);
              if (tabEl) {
                const textEl = tabEl.querySelector('.drawer-item-text');
                if (textEl) textEl.textContent = t(key);
                tabEl.title = t(key);
              }
            });
            const closeBtn = drawer.querySelector('#drawer-close-btn');
            if (closeBtn) {
              closeBtn.ariaLabel = getInterfaceLanguage() === 'ru' ? 'Закрыть' : getInterfaceLanguage() === 'uk' ? 'Закрити' : 'Close';
            }
          }
          updateHeaderUser();
          renderTab(activeTab);
        });

        // 2. Immediate zero-latency UI mount (renders instantly)
        renderAppLayout(
          (tabName) => {
            renderTab(tabName);
          },
          async () => {
            updateHeaderUser();
            await loadData();
            renderTab(activeTab);
          },
          () => {
            // Click on Logo / Owl -> Switch to Training and activate leftmost available mode
            try {
              const selectedCategory = userSettings.category || 'Elementary';
              const cleanCat = (cat) => {
                if (!cat) return 'Elementary';
                return String(cat).replace(/\s*[•\-–—]?\s*[A-C][1-2].*$/i, '').trim();
              };
              const categoryWords = allWords.filter(
                (w) => selectedCategory === 'All' || cleanCat(w.category) === cleanCat(selectedCategory)
              );
              const favList = getUserFavorites() || [];
              const userProgress = getUserProgress() || {};

              const quizQueue = getQueueForQuiz(categoryWords, userProgress, favList);
              const pairsQueue = getQueueForPairs(categoryWords, userProgress, favList);
              const testQueue = getQueueForTest(categoryWords, userProgress);

              let nextMethod = 'cards';
              if (quizQueue.length > 0) {
                nextMethod = 'quiz';
              } else if (pairsQueue.length > 0) {
                nextMethod = 'pairs';
              } else if (testQueue.length > 0) {
                nextMethod = 'input';
              }

              // Instant UI update: return directly to Hub choice screen
              window._showHubScreen = true;
              currentWordIndex = 0;
              const tabs = document.querySelectorAll('.nav-tab');
              tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'training'));

              renderTab('training');
            } catch (err) {
              console.error('Error in logo click callback:', err);
            }
          }
        );

        // Check if this is the very first start (before registration/first launch)
        const hasLaunched = localStorage.getItem('myduo_has_launched');
        const user = getCurrentUser();
        if (!hasLaunched && (!user || user.id === 'guest')) {
          localStorage.setItem('myduo_has_launched', '1');
          activeTab = 'settings';
        } else {
          activeTab = 'training';
          window._showHubScreen = true;
        }

        renderTab(activeTab);

        // 3. Asynchronous non-blocking background data sync
        loadData().then(() => {
          updateHeaderUser();
          renderTab(activeTab);
        }).catch((err) => console.warn('Background sync error:', err));
      }

      init();
    </script>
  </body>
</html>
