    <script>
      // Force instant auto-restart and cache-bust for all users and Android devices
      (function() {
        var APP_BUILD = '20260913_v364';
        try {
          var isAndroid = !!(
            window.androidBridge ||
            window.Capacitor?.isNativePlatform?.() ||
            window.Capacitor?.getPlatform?.() === 'android' ||
            (window.location && window.location.hostname === 'localhost' && /Android/i.test(navigator.userAgent))
          );
          if (isAndroid) {
            document.documentElement.classList.add('is-android-app');
          }
        } catch (e) {}
        try {
          var t = localStorage.getItem('myduo_theme') || 'light';
          var initBg = '#f8fafc';
          if (t === 'dark') {
            document.documentElement.classList.add('dark-theme');
            document.documentElement.style.backgroundColor = '#0f172a';
            initBg = '#0f172a';
          } else if (t === 'notebook') {
            document.documentElement.classList.add('notebook-theme');
            document.documentElement.style.backgroundColor = '#f5eedc';
            initBg = '#f5eedc';
          } else {
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.setWindowThemeColor === 'function') {
            window.AndroidThemeBridge.setWindowThemeColor(t);
          }
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.getStatusBarHeightDp === 'function') {
            var sbHeight = window.AndroidThemeBridge.getStatusBarHeightDp();
            if (sbHeight > 0) {
              document.documentElement.style.setProperty('--safe-top', sbHeight + 'px');
            }
          }
          if (window.AndroidThemeBridge && typeof window.AndroidThemeBridge.getNavigationBarHeightDp === 'function') {
            var nbHeight = window.AndroidThemeBridge.getNavigationBarHeightDp();
            if (nbHeight > 0) {
              document.documentElement.style.setProperty('--safe-bottom', nbHeight + 'px');
            }
          }
        } catch (e) {}
        var prevBuild = localStorage.getItem('myduo_app_build');
        if (prevBuild !== APP_BUILD) {
          localStorage.setItem('myduo_app_build', APP_BUILD);
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && (k.startsWith('cache_leaderboard_') || k === 'myduo_leaderboard_period')) {
              localStorage.removeItem(k);
            }
          }
        }
        window.hideAppSplashScreen = function() {
          var splash = document.getElementById('app-splash-screen');
          if (splash) {
            splash.style.transition = 'opacity 0.25s ease';
            splash.style.opacity = '0';
            setTimeout(function() { if (splash) splash.remove(); }, 260);
          }
        };
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js').catch(function() {});
          });
        }
      })();
    </script>

    <script type="module">
      import { getWords, getUserSettings, getUserProgress, getUserFavorites, saveUserSettings, isWordMastered, isWordLearning, getQueueForCards, getQueueForQuiz, getQueueForPairs, getQueueForTest, prepareTrainingBatch, getActiveConveyorBatch, clearActiveConveyorBatch, getLeaderboard, fetchUserDataFromCloud, pushUserDataToCloud, getGlobalWordOfTheDay, getCloudWordOfTheDayId } from './services/api.js?v=217.0';
      import { speakWord, preloadWordAudio, playFanfareSound, releaseScreenWakeLock, isCategoryAudioDownloaded, downloadCategoryVoicePack, getSavedVoiceAccent } from './services/audioService.js?v=217.0';
      import { getCurrentUser, isGuestLimitReached, incrementGuestTrainingCount, GUEST_WORD_LIMIT } from './services/authService.js?v=217.0';
      import { renderAppLayout, updateHeaderUser } from './components/layout/AppLayout.js?v=217.0';
      import { t, getInterfaceLanguage, getWordTranslation, getCategoryDetails, getCategoryVoiceModalStrings } from './services/i18n.js?v=217.0';
      import { renderTrainingCard } from './components/training/TrainingCard.js?v=217.0';
      import { renderStatsView } from './components/stats/StatsView.js?v=217.0';
      import { renderSettingsView } from './components/settings/SettingsView.js?v=217.0';
      import { renderFavoritesView } from './components/favorites/FavoritesView.js?v=217.0';
      import { renderDictionaryView } from './components/dictionary/DictionaryView.js?v=217.0';
      import { renderLeaderboardView } from './components/leaderboard/LeaderboardView.js?v=217.0';
      import { renderAuthModal } from './components/auth/AuthModal.js?v=217.0';
      import { initPrizePodiumListener } from './components/modals/PrizePodiumModal.js?v=217.0';

      // One-time cleanup of phantom words that were never actively learned in Cards
      (function cleanPhantomWords() {
        try {
          const user = getCurrentUser();
          const uId = user ? user.id : 'guest';
          const progKey = 'progress_' + uId;
          const localProg = JSON.parse(localStorage.getItem(progKey) || '{}');
          let changed = false;
          Object.keys(localProg).forEach((id) => {
            const p = localProg[id];
            // If word is not mastered, has no typing inputs, no quiz successes, but accumulated pairs, clear it
            if (p && !p.mastered && (p.inputCorrect || 0) === 0 && (p.quizCorrect || 0) === 0 && (p.pairsCorrect || 0) > 0) {
              delete localProg[id];
              changed = true;
            }
          });
          if (changed) {
            localStorage.setItem(progKey, JSON.stringify(localProg));
          }
        } catch (e) {}
      })();

      let allWords = [];
      try {
        const cachedWords = JSON.parse(localStorage.getItem('myduo_cached_words') || '[]');
        if (Array.isArray(cachedWords) && cachedWords.length > 0) {
          allWords = cachedWords;
        }
      } catch (e) {}
      let favoriteIds = new Set();
      let favoritePracticeWords = null;
      let favoritePracticeMethod = 'cards';
      let currentWordIndex = 0;
      let activeTab = 'training';
      let userSettings = { enabledMethods: 'quiz,cards,input', dailyGoal: 10 };
      let cloudWordOfTheDayId = null;
      let wotdPlaylist = ["cat1.mp4","cat2.mp4","cat3.mp4","cat4.mp4","cat5.mp4","cat6.mp4","cat7.mp4","cat8.mp4"];

      // Fetch dynamic playlist if available
      try {
        fetch('assets/video/playlist.json?v=' + Date.now())
          .then((r) => r.json())
          .then((list) => {
            if (Array.isArray(list) && list.length > 0) {
              wotdPlaylist = list;
              preloadNextWotdVideo();
            }
          })
          .catch(() => {});
      } catch (e) {}

      function preloadNextWotdVideo() {
        try {
          let currentIdx = parseInt(localStorage.getItem('myduo_wotd_video_idx') || '0', 10);
          if (isNaN(currentIdx) || currentIdx < 0) currentIdx = 0;
          const selectedVideo = wotdPlaylist[currentIdx % wotdPlaylist.length];
          const videoUrl = 'assets/video/' + selectedVideo;

          // Preload via background video element into memory buffer (clean, no console warnings)
          if (!window._wotdPreloadVideo) {
            window._wotdPreloadVideo = document.createElement('video');
            window._wotdPreloadVideo.preload = 'auto';
            window._wotdPreloadVideo.muted = true;
            window._wotdPreloadVideo.playsInline = true;
          }
          if (window._wotdPreloadVideo.src !== window.location.origin + '/' + videoUrl && !window._wotdPreloadVideo.src.endsWith(videoUrl)) {
            window._wotdPreloadVideo.src = videoUrl;
            window._wotdPreloadVideo.load();
          }
        } catch (e) {}
      }

      async function loadData() {
        const user = getCurrentUser();

        try {
          await Promise.allSettled([
            (user && user.id && user.id !== 'guest')
              ? fetchUserDataFromCloud(user.id).catch((e) => console.warn('Cloud sync error:', e))
              : Promise.resolve(),
            getWords(false).then((wordsRes) => {
              if (wordsRes && wordsRes.data && wordsRes.data.length > 0) {
                allWords = wordsRes.data;
              }
            }).catch((e) => console.warn('Words load error:', e))
          ]);
        } catch (e) {}

        try {
          userSettings = await getUserSettings();
        } catch (e) {
          console.warn('Failed to load settings:', e);
        }

        try {
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
        } catch (e) {
          console.warn('Failed to load favorites:', e);
        }

        try {
          getLeaderboard().catch(() => {});
          // Global background sync every 1 hour for all players
          if (!window._globalLeaderboardSyncTimer) {
            window._globalLeaderboardSyncTimer = setInterval(() => {
              getLeaderboard().catch(() => {});
            }, 3600000);
          }
        } catch (e) {}

        try {
          getCloudWordOfTheDayId(user ? user.id : 'guest').then((cId) => {
            if (cId) {
              cloudWordOfTheDayId = cId;
              const w = allWords.find(item => String(item.id) === cloudWordOfTheDayId);
              if (w) {
                preloadWordAudio(w.word);
              }
            }
          }).catch(() => {});
        } catch (e) {}
      }

      function handleFavoriteToggle(wordId, isFav) {
        const idStr = String(wordId);
        if (isFav) favoriteIds.add(idStr);
        else favoriteIds.delete(idStr);

        if (activeTab === 'favorites') {
          renderTab(activeTab);
        }
      }

      if (typeof window !== 'undefined') {
        window.addEventListener('myduo_words_updated', (e) => {
          allWords = e.detail;
          if (activeTab && typeof renderTab === 'function') {
            try {
              renderTab(activeTab);
            } catch (err) {}
          }
        });
      }

      
      function resetWordsProgressForPractice(words) {
        if (!words || !Array.isArray(words) || words.length === 0) return;
        try {
          const userProg = getUserProgress();
          words.forEach((w) => {
            if (w && w.id) {
              const id = String(w.id);
              if (!userProg[id]) userProg[id] = {};
              userProg[id].inputCorrect = 0;
              userProg[id].quizCorrect = 0;
              userProg[id].pairsCorrect = 0;
              userProg[id].seenInCards = true;
              userProg[id].learning = true;
              userProg[id].mastered = false;
            }
          });
          const currentUser = getCurrentUser();
          const userId = userSettings.userId || (currentUser ? currentUser.id : (localStorage.getItem('myduo_guest_device_id') || 'guest'));
          localStorage.setItem(`progress_${userId}`, JSON.stringify(userProg));
        } catch (e) {
          console.warn('Failed to reset words progress for practice:', e);
        }
      }

      async function renderTrainingTab() {
        preloadNextWotdVideo();
        const content = document.querySelector('#app-content');
        if (!content) return;

        // Check if Guest limit (100 words) has been reached
        if (isGuestLimitReached()) {
          content.innerHTML = `
            <div class="guest-limit-card" style="text-align: center; padding: 32px 18px; background: #ffffff; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
              <div style="font-size: 52px; margin-bottom: 12px;">🎉</div>
              <h2 style="margin: 0 0 10px; font-size: 20px;">${t('guest_limit_title')}</h2>
              <p style="color: var(--text-muted); font-size: 14px; line-height: 1.45; margin: 0 0 20px;">
                ${t('guest_limit_desc', { n: GUEST_WORD_LIMIT })}
              </p>
              <button class="primary-button" id="guest-signup-btn" style="margin-bottom: 10px; padding: 12px 16px; font-size: 15px;">
                ${t('guest_limit_signup')}
              </button>
              <button class="secondary-button" id="guest-login-btn" style="width: 100%; padding: 10px 16px;">
                ${t('guest_limit_login')}
              </button>
            </div>
          `;

          const signupBtn = content.querySelector('#guest-signup-btn');
          if (signupBtn) {
            signupBtn.addEventListener('click', () => {
              renderAuthModal(async () => {
                updateHeaderUser();
                await loadData();
                renderTrainingTab();
              });
            });
          }

          const loginBtn = content.querySelector('#guest-login-btn');
          if (loginBtn) {
            loginBtn.addEventListener('click', () => {
              renderAuthModal(async () => {
                updateHeaderUser();
                await loadData();
                renderTrainingTab();
              });
            });
          }
          return;
        }

        if (allWords.length === 0) {
          content.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 220px; padding: 40px 20px; width: 100%;">
              <div style="font-size: 17px; font-weight: 700; color: var(--text-main, #334155); margin-bottom: 24px; letter-spacing: 0.6px; opacity: 0.85;">Loading...</div>
              <div class="cat-paw-loader" style="position: relative; width: 100%; max-width: 370px; height: 56px; margin: 0 auto;">
                <!-- 1. Заход передними лапами (неспешный шаг) -->

                </div>
                <div class="cat-paw-step" style="position: absolute; left: 52px; top: 26px; opacity: 0; animation: catSlowWalkTrack 11.5s infinite 0.95s;">
                  <svg viewBox="0 0 32 32" width="24" height="24" fill="#94a3b8" style="display: block;"><g transform="rotate(90 16 16)"><ellipse cx="6.5" cy="11.5" rx="2.5" ry="3.4" transform="rotate(-26 6.5 11.5)"/><ellipse cx="12.5" cy="7.2" rx="2.6" ry="3.7" transform="rotate(-8 12.5 7.2)"/><ellipse cx="19.5" cy="7.2" rx="2.6" ry="3.7" transform="rotate(8 19.5 7.2)"/><ellipse cx="25.5" cy="11.5" rx="2.5" ry="3.4" transform="rotate(26 25.5 11.5)"/><path d="M16 14 C12.5 14 9.5 16.5 9 19.5 C8.5 22.5 10 25.5 12.5 25.5 C14 25.5 15 24 16 24 C17 24 18 25.5 19.5 25.5 C22 25.5 23.5 22.5 23 19.5 C22.5 16.5 19.5 14 16 14 Z"/></g></svg>

                <!-- 2. Заходят задние лапы (кот зашёл на лист полностью: видно 4 лапки) -->

        function sanitizeCategory(cat) {
          if (!cat) return 'Общие';
          return String(cat)
            .replace(/\s*[•\-–—]?\s*[A-C][1-2].*$/i, '')
            .trim() || String(cat).trim();
        }

        const CANONICAL_CATEGORY_ORDER = ['Elementary', 'Irregular verb', 'Pattern', 'Intermediate', 'Advanced'];

        function getCategoryOrderIndex(catName) {
          const clean = String(catName || '').toLowerCase().trim();
          if (clean.includes('elementary')) return 0;
          if (clean.includes('irregular')) return 1;
          if (clean.includes('pattern')) return 2;
          if (clean.includes('intermediate')) return 3;
          if (clean.includes('advanced')) return 4;
          return 999;
        }

        function getNextSequentialCategory(currentCat, availableCats) {
          const currentIdx = getCategoryOrderIndex(currentCat);
          if (currentIdx === 999) return null;
          for (let i = currentIdx + 1; i < CANONICAL_CATEGORY_ORDER.length; i++) {
            const found = availableCats.find((c) => getCategoryOrderIndex(c) === i);
            if (found) return found;
          }
          return null;
        }

        const categories = Array.from(new Set(allWords.map((w) => sanitizeCategory(w.category)).filter(Boolean)))
          .sort((a, b) => {
            const diff = getCategoryOrderIndex(a) - getCategoryOrderIndex(b);
            if (diff !== 0) return diff;
            return a.localeCompare(b);
          });
        let selectedCategory = userSettings.category || 'Elementary';
        if (selectedCategory === 'All' || selectedCategory === 'Все категории') {
          selectedCategory = 'Elementary';
          userSettings.category = 'Elementary';
          saveUserSettings(userSettings);
        }

        let categoryWords = allWords;
        if (selectedCategory && selectedCategory !== 'All' && selectedCategory !== 'Все категории') {
          const filtered = allWords.filter(
            (w) => sanitizeCategory(w.category) === sanitizeCategory(selectedCategory)
          );
          if (filtered.length > 0) {
            categoryWords = filtered;
          }
        }
        categoryWords.sort((a, b) => (Number(b.zipf) || 0) - (Number(a.zipf) || 0));

        const userProgress = getUserProgress();
        const favList = getUserFavorites();
        const favSet = new Set(favList.map(String));
        favoriteIds = favSet;

        // Check if practicing favorites mode is active
        const isFavPracticeActive = Boolean(favoritePracticeWords && favoritePracticeWords.length > 0);
        let currentMethod = isFavPracticeActive
          ? (favoritePracticeMethod || 'cards')
          : (userSettings.preferredMethod || 'cards');
        if (isFavPracticeActive) {
          categoryWords = favoritePracticeWords;
        }

        const dailyGoal = Number(userSettings.dailyGoal) || 10;
        const totalLearningWords = categoryWords.filter((w) => isWordLearning(userProgress[w.id]));
        const learningCount = totalLearningWords.length;

        const favListForMixing = isFavPracticeActive ? [] : favList;

        const cardsQueue = getQueueForCards(categoryWords, userProgress, favList);
        const quizQueue = getQueueForQuiz(categoryWords, userProgress, favList);
        const pairsQueue = getQueueForPairs(categoryWords, userProgress, favList);
        const testQueue = getQueueForTest(categoryWords, userProgress, favList);

        function isMethodAvailable(method) {
          if (method === 'cards') return !isFavPracticeActive && cardsQueue.length > 0;
          if (method === 'quiz') return quizQueue.length > 0;
          if (method === 'pairs') return pairsQueue.length > 0;
          if (method === 'input') return testQueue.length > 0;
          return false;
        }

        // SMART ACTIVE MODE RESOLUTION:
        // Automatically advance along the training conveyor: Cards -> Quiz -> Pairs -> Test.
        // If window._showHubScreen is true or round is finished, show the clean Hub screen.
        if (!isFavPracticeActive) {
          if (window._showHubScreen) {
            currentMethod = 'input';
          } else if (!isMethodAvailable(currentMethod)) {
            // STRICT FORWARD-ONLY CONVEYOR PROGRESSION:
            // Cards -> Quiz -> Pairs -> Test -> Finished (Hub)
            if (currentMethod === 'cards') {
              if (quizQueue.length > 0) currentMethod = 'quiz';
              else if (pairsQueue.length > 0) currentMethod = 'pairs';
              else if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            } else if (currentMethod === 'quiz') {
              if (pairsQueue.length > 0) currentMethod = 'pairs';
              else if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }

              // After Pairs, STRICTLY proceed ONLY to Test! Never regress to Quiz or Cards!
              if (testQueue.length > 0) currentMethod = 'input';
              else {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            } else if (currentMethod === 'input') {
              if (testQueue.length === 0) {
                window._showHubScreen = true;
                currentMethod = 'input';
              }
            }
          }

          // Keep userSettings.preferredMethod strictly synchronized with the current active conveyor mode
          if (userSettings.preferredMethod !== currentMethod) {
            userSettings.preferredMethod = currentMethod;
            saveUserSettings(userSettings);

          activeWords = favoritePracticeWords;

        const unmasteredCount = categoryWords.filter((w) => !isWordMastered(userProgress[w.id])).length;

                  userProgress[w.id].inputCorrect = 0;

                  userProgress[w.id].pairsCorrect = 0;
                  userProgress[w.id].seenInCards = true;
                  userProgress[w.id].mastered = false;

              nextMode = 'input';

                  const px = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                  const py = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

                  const tiltY = (px - 0.5) * 14;
                  const tiltX = (0.5 - py) * 10;

                  tiltContainer.style.setProperty('--tiltX', `${tiltX.toFixed(2)}deg`);

                  tiltContainer.style.setProperty('--glare-y', `${(py * 100).toFixed(1)}%`);

                    const revealVideo = () => {
                      if (isVideoRevealed || !isFlipped) return;
                      const elapsed = Date.now() - flipStartTime;
                      const waitRemaining = Math.max(0, 950 - elapsed);
                      setTimeout(() => {
                        if (isVideoRevealed || !isFlipped) return;
                        isVideoRevealed = true;
                        videoContainer.style.display = 'block';
                        requestAnimationFrame(() => {
                          videoContainer.style.opacity = '1';
                        });
                      }, waitRemaining);
                    };

                    const dismissVideo = () => {
                      videoContainer.style.opacity = '0';
                      setTimeout(() => {
                        if (!isFlipped || cardVideo.ended || cardVideo.paused) {
                          videoContainer.style.display = 'none';
                        }
                      }, 350);

                    }, { once: true });

                    }, { once: true });

                    }, { once: true });

            const categoriesList = rawCategories.sort((a, b) => {

                const clean = String(catName || '').toLowerCase().trim();
                if (clean.includes('elementary')) return 0;
                if (clean.includes('irregular')) return 1;
                if (clean.includes('pattern')) return 2;
                if (clean.includes('intermediate')) return 3;
                if (clean.includes('advanced')) return 4;
                return 999;

                (w) => sanitizeCategory(w.category) === sanitizeCategory(catKey)

                const isBundled = normCat.includes('elementary') || normCat.includes('irregular');

                // 1. Elementary & Irregular Verbs are pre-packaged in the APK -> Open immediately

                if (!isDownloaded) {

                  const strings = getCategoryVoiceModalStrings(details.title, count, sizeMb);

                  const modal = document.createElement('div');
                  modal.className = 'modal-overlay';
                  modal.id = 'cat-voice-download-modal';
                  modal.style.cssText = 'position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 16px; box-sizing: border-box;';
                  modal.innerHTML = `
                    <div class="modal-content" style="text-align: center; max-width: 350px; width: 100%; padding: 26px 20px; border-radius: 20px; box-sizing: border-box; animation: scaleUp 0.2s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
                      <div style="font-size: 44px; margin-bottom: 10px; line-height: 1;">📥</div>
                      <h3 style="font-size: 18px; font-weight: 700; margin: 0 0 10px; color: var(--text-main);">
                        ${strings.title}
                      </h3>
                      <p id="cat-modal-desc" style="font-size: 13.5px; color: var(--text-muted); line-height: 1.45; margin: 0 0 18px;">
                        ${strings.desc}
                      </p>
                      <div id="cat-progress-wrap" style="display: none; margin-bottom: 16px;">
                        <div style="background: rgba(0,0,0,0.08); border-radius: 99px; height: 10px; overflow: hidden; margin-bottom: 6px;">
                          <div id="cat-progress-bar" style="background: var(--btn-green-bg, #22c55e); height: 100%; width: 0%; transition: width 0.15s ease;"></div>
                        </div>
                        <span id="cat-progress-text" style="font-size: 12px; font-weight: 700; color: var(--text-muted);">0%</span>
                      </div>
                      <div style="display: flex; flex-direction: column; gap: 8px;">
                        <button class="primary-button btn-green" id="cat-modal-download-btn" style="min-height: 44px; font-size: 15px; font-weight: 700; width: 100%; border-radius: 12px;">
                          ${strings.downloadBtn}
                        </button>
                        <button class="secondary-button" id="cat-modal-cancel-btn" style="min-height: 38px; font-size: 14px; width: 100%; border-radius: 12px;">
                          ${strings.cancelBtn}
                        </button>
                      </div>
                    </div>
                  `;
                  document.body.appendChild(modal);

                  const downloadBtn = modal.querySelector('#cat-modal-download-btn');
                  const cancelBtn = modal.querySelector('#cat-modal-cancel-btn');
                  const progressWrap = modal.querySelector('#cat-progress-wrap');
                  const progressBar = modal.querySelector('#cat-progress-bar');
                  const progressText = modal.querySelector('#cat-progress-text');
                  const descEl = modal.querySelector('#cat-modal-desc');

                  cancelBtn.addEventListener('click', () => {
                    modal.remove();
                  });

                  downloadBtn.addEventListener('click', async () => {
                    downloadBtn.disabled = true;
                    cancelBtn.style.display = 'none';
                    progressWrap.style.display = 'block';
                    if (descEl) descEl.textContent = strings.downloading;
                    try {
                      await downloadCategoryVoicePack(currentAccent, chosenCat, catWords, (percent) => {
                        if (progressBar) progressBar.style.width = `${percent}%`;
                        if (progressText) progressText.textContent = `${percent}%`;
                      });

                      modal.remove();
                      window._isCategorySelectOpen = false;
                      favoritePracticeWords = null;
                      userSettings.category = chosenCat;
                      userSettings.preferredMethod = 'cards';
                      window._explicitCardsOpened = true;
                      window._trainingRoundJustCompleted = false;
                      saveUserSettings(userSettings);
                      currentWordIndex = 0;
                      renderTrainingTab();
                    } catch (err) {
                      console.warn('Category voice download failed:', err);
                      downloadBtn.disabled = false;
                      cancelBtn.style.display = 'block';
                      downloadBtn.textContent = strings.retryBtn;
                    }
                  });
                  return;
                }

                // If already downloaded:
                window._isCategorySelectOpen = false;
                favoritePracticeWords = null;
                userSettings.category = chosenCat;
                userSettings.preferredMethod = 'cards';
                window._explicitCardsOpened = true;
                window._trainingRoundJustCompleted = false;
                saveUserSettings(userSettings);
                currentWordIndex = 0;
                renderTrainingTab();
              });
            });
          }

          const continueCardsBtn = content.querySelector('#go-continue-cards-btn');
          if (continueCardsBtn) {
            continueCardsBtn.addEventListener('click', () => {
              window._showHubScreen = false;
              window._trainingRoundJustCompleted = false;

              // Ensure batch is active or initialize fresh batch
              getActiveConveyorBatch(categoryWords, getUserProgress(), favList);
              const curCards = getQueueForCards(categoryWords, getUserProgress(), favList);
              const curQuiz = getQueueForQuiz(categoryWords, getUserProgress(), favList);
              const curPairs = getQueueForPairs(categoryWords, getUserProgress(), favList);
              const curTest = getQueueForTest(categoryWords, getUserProgress(), favList);

              if (curCards.length > 0) {
                userSettings.preferredMethod = 'cards';
              } else if (curQuiz.length > 0) {
                userSettings.preferredMethod = 'quiz';
              } else if (curPairs.length > 0) {
                userSettings.preferredMethod = 'pairs';
              } else if (curTest.length > 0) {
                userSettings.preferredMethod = 'input';
              } else {
                // If all queues are empty, clear and create fresh batch to start with cards
                clearActiveConveyorBatch();
                getActiveConveyorBatch(categoryWords, getUserProgress(), favList);
                userSettings.preferredMethod = 'cards';
              }

              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }

          const goBtn = content.querySelector('#go-next-mode-btn');
          if (goBtn) {
            goBtn.addEventListener('click', () => {
              if (nextMode === 'select_category') {
                renderCategorySelectorScreen();
                return;
              }
              if (nextMode === 'cards') {
                window._explicitCardsOpened = true;
              } else {
                window._explicitCardsOpened = false;
              }
              window._trainingRoundJustCompleted = false;
              userSettings.preferredMethod = nextMode;
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }

          const repeatFavsBtn = content.querySelector('#go-repeat-favs-btn');
          if (repeatFavsBtn) {
            repeatFavsBtn.addEventListener('click', () => {
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              const favList = getUserFavorites();
              const favIds = new Set(favList.map(String));
              const favWords = allWords.filter((w) => favIds.has(String(w.id)));
              if (favWords && favWords.length > 0) {
                favoritePracticeWords = [...favWords];
                favoritePracticeMethod = 'cards';
                currentWordIndex = 0;
                renderTrainingTab();
              } else {
                const tabBtn = document.querySelector('.nav-tab[data-tab="favorites"]');
                if (tabBtn) {
                  tabBtn.click();
                } else {
                  renderTab('favorites');
                }
              }
            });
          }
          return;
        }

        let trainEl = content.querySelector('#training');
        if (!trainEl) {
          content.innerHTML = '<div id="training"></div>';
        }
        // Calculate remaining unfinished words in this round to detect if second word exists
        const unfinishedInQueue = activeWords.filter((w) => {
          const p = userProgress[w.id] || userProgress[String(w.id)];
          if (!p) return true;
          if (currentMethod === 'quiz') return (p.quizCorrect || 0) < 5 && !p.roundQuizDone && !isWordMastered(p);
          if (currentMethod === 'pairs') return (p.pairsCorrect || 0) < 1 && !p.roundPairsDone;
          if (currentMethod === 'input') return (p.inputCorrect || 0) < 2 && !p.roundTestDone && !isWordMastered(p);
          return true;
        });
        const isSingleRemainingWord = unfinishedInQueue.length <= 1;

        if (isFavPracticeActive && currentWordIndex >= activeWords.length) {
          favoritePracticeWords = null;
          favoritePracticeMethod = 'cards';
          currentWordIndex = 0;
          renderTrainingTab();
          return;
        }

        const currentWord = activeWords[currentWordIndex % activeWords.length];

        const isFav =
          Boolean(currentWord) &&
          (favSet.has(String(currentWord.id)) ||
            (currentWord.word && favSet.has(String(currentWord.word).toLowerCase().trim())));

        const availableModes = isFavPracticeActive
          ? { cards: true, quiz: true, pairs: true, input: true }
          : {
              cards: currentMethod === 'cards',
              quiz: currentMethod === 'quiz',
              pairs: currentMethod === 'pairs',
              input: currentMethod === 'input',
            };

        renderTrainingCard(currentWord, allWords, {
          currentMethod,
          selectedCategory,
          categories,
          activeWords,
          currentWordIndex,
          isLastWord: currentWordIndex >= activeWords.length - 1 || isSingleRemainingWord,
          isSingleRemaining: isSingleRemainingWord,
          learningCount,
          dailyGoal,
          availableModes,
          isFavPractice: isFavPracticeActive,
          onCategoryBadgeClick: () => {
            renderCategorySelectorScreen();
          },
          onMethodChange: (newMethod) => {
            window.__favsAutoplayRunning = false;
            releaseScreenWakeLock();
            if (window.__favsAutoplayTimer) clearTimeout(window.__favsAutoplayTimer);
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
              try { window.speechSynthesis.cancel(); } catch (e) {}
            }
            if (isFavPracticeActive) {
              favoritePracticeMethod = newMethod;
            } else {
              userSettings.preferredMethod = newMethod;
              saveUserSettings(userSettings);
            }
            currentWordIndex = 0;
            renderTrainingTab();
          },
          onCategoryChange: (newCategory) => {
            window.__favsAutoplayRunning = false;
            releaseScreenWakeLock();
            if (window.__favsAutoplayTimer) clearTimeout(window.__favsAutoplayTimer);
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
              try { window.speechSynthesis.cancel(); } catch (e) {}
            }
            favoritePracticeWords = null;
            favoritePracticeMethod = 'cards';
            userSettings.category = newCategory;
            saveUserSettings(userSettings);
            currentWordIndex = 0;
            renderTrainingTab();
          },
          isFavorite: isFav,
          onFavoriteToggle: handleFavoriteToggle,
          canGoPrev: currentWordIndex > 0,
          onPrev: () => {
            if (currentWordIndex > 0) {
              currentWordIndex -= 1;
              renderTrainingTab();
            }
          },
          onNext: (opts = {}) => {
            incrementGuestTrainingCount();
            updateHeaderUser();

            if (currentMethod === 'input' && (isSingleRemainingWord || currentWordIndex >= activeWords.length - 1)) {
              window._trainingRoundJustCompleted = true;
            }

            if (opts && opts.repeatSoon) {
              // Re-insert hard word 3 positions later so the user repeats it soon in this session
              const insertPos = Math.min(currentWordIndex + 3, activeWords.length);
              activeWords.splice(insertPos, 0, currentWord);
            }

            if (currentMethod === 'cards' && !isFavPracticeActive) {
              currentWordIndex = 0;
            } else {
              currentWordIndex += 1;
            }
            renderTrainingTab();
          },
        });
      }

      async function renderTab(tabName) {
        activeTab = tabName;
        window._activeTab = tabName;
        const navTabs = document.querySelectorAll('.nav-tab');
        navTabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === tabName));
        const content = document.querySelector('#app-content');

        if (tabName !== 'training') {
          favoritePracticeWords = null;
          favoritePracticeMethod = 'cards';
          window.__favsAutoplayRunning = false;
          releaseScreenWakeLock();
          if (window.__favsAutoplayTimer) clearTimeout(window.__favsAutoplayTimer);
          if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
          }
        }

        if (tabName === 'training') {
          await renderTrainingTab();
        } else if (tabName === 'stats') {
          await renderStatsView(allWords, '#app-content');
        } else if (tabName === 'favorites') {
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
          const favWords = allWords.filter((w) => w && (favoriteIds.has(String(w.id)) || favoriteIds.has(String(w.word || '').toLowerCase().trim())));
          renderFavoritesView(favWords, '#app-content', {
            onFavoriteToggle: handleFavoriteToggle,
            onRemoveFavorite: (id) => handleFavoriteToggle(id, false),
            onClearAllFavorites: () => {
              favoriteIds.clear();
            },
            onStartFavoritePractice: (practiceWords) => {
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              window._showHubScreen = false;
              if (practiceWords && practiceWords.length > 0) {
                favoritePracticeWords = [...practiceWords];
                favoritePracticeMethod = 'cards';
              } else {
                favoritePracticeWords = null;
                favoritePracticeMethod = 'cards';
              }
              currentWordIndex = 0;
              const tabs = document.querySelectorAll('.nav-tab');
              tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'training'));
              renderTab('training');
            },
          });
        } else if (tabName === 'leaderboard') {
          try {
            await renderLeaderboardView('#app-content', {
              onUserChange: async () => {
                updateHeaderUser();
                await loadData();
              },
            });
          } catch (leadErr) {
            console.error('Failed to render leaderboard:', leadErr);
          }
        } else if (tabName === 'dictionary') {
          renderDictionaryView(allWords, '#app-content', {
            favoriteIds: Array.from(favoriteIds),
            onFavoriteToggle: handleFavoriteToggle,
          });
        } else if (tabName === 'settings') {
          await renderSettingsView(
            '#app-content',
            async () => {
              updateHeaderUser();
              await loadData();
            },
            allWords
          );
        }
      }

      async function init() {
        window._explicitCardsOpened = false;
        window._trainingRoundJustCompleted = false;
        initPrizePodiumListener();
        preloadNextWotdVideo();

        // 1. Instant local cache restore (0ms)
        try {
          const cachedRaw = localStorage.getItem('myduo_cached_words');
          if (cachedRaw) {
            const parsed = JSON.parse(cachedRaw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              allWords = parsed;
            }
          }
        } catch (e) {}

        try {
          const localSettings = localStorage.getItem('myduo_user_settings');
          if (localSettings) {
            userSettings = { ...userSettings, ...JSON.parse(localSettings) };
          }
        } catch (e) {}

        try {
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
        } catch (e) {}

        window.addEventListener('myduo:auth_changed', async (e) => {
          const user = e.detail?.user || getCurrentUser();
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
          updateHeaderUser();
          if (user && user.id) {
            try {
              await fetchUserDataFromCloud(user.id);
            } catch (e) {}
            pushUserDataToCloud(user.id, null, false);
          }
          await loadData();
          if (!window._isCategorySelectOpen) {
            renderTab(activeTab);
          }
        });

        window.addEventListener('myduo_favorites_updated', (e) => {
          const favs = e.detail || getUserFavorites();
          favoriteIds = new Set(favs.map(String));
          if (!window._isCategorySelectOpen && (activeTab === 'favorites' || activeTab === 'dictionary')) {
            renderTab(activeTab);
          }
        });

        window.addEventListener('myduo:progress_updated', () => {
          if (!window._isCategorySelectOpen) {
            renderTab(activeTab);
          }
        });

        window.addEventListener('myduo:cloud_synced', async () => {
          updateHeaderUser();
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
          if (!window._isCategorySelectOpen) {
            renderTab(activeTab);
          }
        });

        window.addEventListener('myduo:lang_changed', () => {
          const drawer = document.querySelector('#burger-drawer');
          if (drawer) {
            const tabsDef = [
              { tab: 'training', key: 'training' },
              { tab: 'leaderboard', key: 'leaderboard' },
              { tab: 'dictionary', key: 'dictionary' },
              { tab: 'favorites', key: 'favorites' },
              { tab: 'stats', key: 'stats' },
              { tab: 'settings', key: 'settings' }
            ];
            tabsDef.forEach(({ tab, key }) => {
              const tabEl = drawer.querySelector(`.nav-tab[data-tab="${tab}"]`);
              if (tabEl) {
                const textEl = tabEl.querySelector('.drawer-item-text');
                if (textEl) textEl.textContent = t(key);
                tabEl.title = t(key);
              }
            });
            const feedbackBtn = drawer.querySelector('#drawer-feedback-btn');
            if (feedbackBtn) {
              feedbackBtn.innerHTML = `
                <span class="drawer-feedback-icon">💡</span>
                <span class="drawer-feedback-title">${t('feedback_title')}</span>
              `;
            }

            const closeBtn = drawer.querySelector('#drawer-close-btn');
            if (closeBtn) {
              closeBtn.ariaLabel = t('word_notes_close') || 'Close';
            }
          }
          updateHeaderUser();
          renderTab(activeTab);
        });

        // 2. Immediate zero-latency UI mount (renders instantly)
        renderAppLayout(
          (tabName) => {
            if (tabName === 'training') {
              favoritePracticeWords = null;
              window._showHubScreen = true;
            }
            renderTab(tabName);
          },
          async () => {
            updateHeaderUser();
            await loadData();
            renderTab(activeTab);
          },
          () => {
            // Click on Logo / Brand -> Exit any practice / mode and return cleanly to Main Hub / Training
            try {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._showHubScreen = true;
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              currentWordIndex = 0;
              const tabs = document.querySelectorAll('.nav-tab');
              tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'training'));

              renderTab('training');
            } catch (err) {
              console.error('Error in logo click callback:', err);
            }
          }
        );

        // Check if this is the very first start (before registration/first launch)
        const hasLaunched = localStorage.getItem('myduo_has_launched');
        const user = getCurrentUser();
        if (!hasLaunched && (!user || user.id === 'guest')) {
          localStorage.setItem('myduo_has_launched', '1');
          activeTab = 'settings';
        } else {
          activeTab = 'training';
          window._showHubScreen = true;
        }

        try {
          renderTab(activeTab);
        } catch (err) {
          console.error('Initial tab render error:', err);
        } finally {
          if (typeof window.hideAppSplashScreen === 'function') {
            window.hideAppSplashScreen();
          }
        }

        // 3. Asynchronous non-blocking background data sync
        loadData().then(() => {
          updateHeaderUser();
          renderTab(activeTab);
        }).catch((err) => console.warn('Background sync error:', err));

        // 4. Native Android Back Button & Gesture Navigation handler
        window.handleAndroidBackButton = function() {
          try {
            // Priority 1: Close burger drawer if open
            const drawer = document.querySelector('#burger-drawer');
            const drawerOverlay = document.querySelector('#drawer-overlay');
            if (drawer && drawer.classList.contains('open')) {
              drawer.classList.remove('open');
              if (drawerOverlay) drawerOverlay.classList.remove('open');
              return true;
            }

            // Priority 2: Close any open modal dialogs or overlays
            const openModals = document.querySelectorAll('.modal-backdrop, .modal-overlay[style*="display: flex"], .modal-overlay[style*="display: block"], .modal-overlay.open, #auth-modal, #avatar-picker-modal, #doc-scanner-modal, #add-word-modal, #top100-congrats-modal, #share-app-modal, #share-dialog-overlay');
            if (openModals && openModals.length > 0) {
              const topModal = openModals[openModals.length - 1];
              const closeBtn = topModal.querySelector('.modal-close, .modal-close-btn, #modal-close-btn, .close-btn, [data-action="close"]');
              if (closeBtn) {
                closeBtn.click();
              } else {
                topModal.remove();
              }
              return true;
            }

            // Priority 3: If inside exercises or sub-screens, return to hub
            if (activeTab === 'training' && !window._showHubScreen) {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._showHubScreen = true;
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              currentWordIndex = 0;
              renderTrainingTab();
              return true;
            }

            // Priority 4: If on secondary tabs, return to main training tab
            if (activeTab !== 'training') {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._showHubScreen = true;
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              currentWordIndex = 0;
              activeTab = 'training';
              const tabs = document.querySelectorAll('.nav-tab');
              tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'training'));
              renderTab('training');
              return true;
            }

            // Priority 5: Already on the Main Hub with nothing open -> return false (triggers native toast / exit)
            return false;
          } catch (e) {
            console.error('Error handling back button:', e);
            return false;
          }
        };

        // Also wire to Capacitor App plugin if dynamically loaded
        if (window.Capacitor?.Plugins?.App) {
          window.Capacitor.Plugins.App.addListener('backButton', () => {
            const handled = window.handleAndroidBackButton();
            if (!handled) {
              window.Capacitor.Plugins.App.exitApp();
            }
          });
        }
      }

      init();
    </script>
  </body>
</html>
