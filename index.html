                        <button class="secondary-button" id="cat-modal-cancel-btn" style="min-height: 38px; font-size: 14px; width: 100%; border-radius: 12px;">
                          ${strings.cancelBtn}
                        </button>
                      </div>
                    </div>
                  `;
                  document.body.appendChild(modal);

                  const downloadBtn = modal.querySelector('#cat-modal-download-btn');
                  const cancelBtn = modal.querySelector('#cat-modal-cancel-btn');
                  const progressWrap = modal.querySelector('#cat-progress-wrap');
                  const progressBar = modal.querySelector('#cat-progress-bar');
                  const progressText = modal.querySelector('#cat-progress-text');
                  const descEl = modal.querySelector('#cat-modal-desc');
                  const actionsWrap = modal.querySelector('#cat-modal-actions');

                  cancelBtn.addEventListener('click', () => {
                    modal.remove();
                  });

                  downloadBtn.addEventListener('click', async () => {
                    downloadBtn.disabled = true;
                    const prevBtnText = downloadBtn.innerHTML;
                    downloadBtn.innerHTML = '⏳ ' + strings.downloading;

                    // 1. Show Rewarded Ad if online
                    if (window.AdService && AdService.isOnline()) {
                      try {
                        const adRes = await AdService.showLanguagePackRewardedAd(details.title || chosenCat);
                        // If ad was shown but dismissed early without reward
                        if (adRes && adRes.success && !adRes.rewardEarned) {
                          downloadBtn.disabled = false;
                          downloadBtn.innerHTML = prevBtnText;
                          return;
                        }
                      } catch (adErr) {
                        console.warn('Category voice ad error (proceeding gracefully):', adErr);
                      }
                    }

                    if (actionsWrap) actionsWrap.style.display = 'none';
                    progressWrap.style.display = 'block';
                    if (descEl) descEl.style.display = 'none';
                    try {
                      await downloadCategoryVoicePack(currentAccent, chosenCat, catWords, (percent) => {
                        if (progressBar) progressBar.style.width = `${percent}%`;
                        if (progressText) progressText.textContent = `${percent}%`;
                      });

                      modal.remove();
                      window._isCategorySelectOpen = false;
                      window._showHubScreen = false;
                      favoritePracticeWords = null;
                      clearActiveConveyorBatch();
                      window._pausedRoundState = null;
                      userSettings.category = chosenCat;
                      userSettings.preferredMethod = 'cards';
                      window._explicitCardsOpened = true;
                      window._trainingRoundJustCompleted = false;
                      saveUserSettings(userSettings);
                      currentWordIndex = 0;
                      renderTrainingTab();
                    } catch (err) {
                      console.warn('Category voice download failed:', err);
                      if (actionsWrap) actionsWrap.style.display = 'flex';
                      downloadBtn.disabled = false;
                      cancelBtn.style.display = 'block';
                      if (descEl) descEl.style.display = 'block';
                      downloadBtn.textContent = strings.retryBtn;
                    }
                  });
                  return;
                }

                // If already downloaded:
                window._isCategorySelectOpen = false;
                window._showHubScreen = false;
                favoritePracticeWords = null;
                clearActiveConveyorBatch();
                window._pausedRoundState = null;
                userSettings.category = chosenCat;
                userSettings.preferredMethod = 'cards';
                window._explicitCardsOpened = true;
                window._trainingRoundJustCompleted = false;
                saveUserSettings(userSettings);
                currentWordIndex = 0;
                renderTrainingTab();
              });
            });
          }

          const continueCardsBtn = content.querySelector('#go-continue-cards-btn');
          if (continueCardsBtn) {
            continueCardsBtn.addEventListener('click', () => {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._activePracticeCollectionId = null;
              window._activePracticeCollectionTitle = null;
              window._showHubScreen = false;
              window._trainingRoundJustCompleted = false;

              // Ensure batch is active or initialize fresh batch
              getActiveConveyorBatch(categoryWords, getUserProgress(), favList);
              const curCards = getQueueForCards(categoryWords, getUserProgress(), favList);
              const curQuiz = getQueueForQuiz(categoryWords, getUserProgress(), favList);
              const curPairs = getQueueForPairs(categoryWords, getUserProgress(), favList);
              const curTest = getQueueForTest(categoryWords, getUserProgress(), favList);

              const paused = window._pausedRoundState;
              const queueByMethod = { cards: curCards, quiz: curQuiz, pairs: curPairs, input: curTest };

              if (paused && paused.category === selectedCategory && queueByMethod[paused.method] && queueByMethod[paused.method].length > 0) {
                userSettings.preferredMethod = paused.method;
                currentWordIndex = Math.min(paused.wordIndex || 0, Math.max(0, queueByMethod[paused.method].length - 1));
              } else if (curCards.length > 0) {
                userSettings.preferredMethod = 'cards';
                currentWordIndex = 0;
              } else if (curQuiz.length > 0) {
                userSettings.preferredMethod = 'quiz';
                currentWordIndex = 0;
              } else if (curPairs.length > 0) {
                userSettings.preferredMethod = 'pairs';
                currentWordIndex = 0;
              } else if (curTest.length > 0) {
                userSettings.preferredMethod = 'input';
                currentWordIndex = 0;
              } else {
                // If all queues are empty, clear and create fresh batch to start with cards
                clearActiveConveyorBatch();
                window._pausedRoundState = null;
                getActiveConveyorBatch(categoryWords, getUserProgress(), favList);
                userSettings.preferredMethod = 'cards';
                currentWordIndex = 0;
              }

              saveUserSettings(userSettings);
              renderTrainingTab();
            });
          }

          const goBtn = content.querySelector('#go-next-mode-btn');
          if (goBtn) {
            goBtn.addEventListener('click', () => {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._activePracticeCollectionId = null;
              window._activePracticeCollectionTitle = null;
              if (nextMode === 'select_category') {
                renderCategorySelectorScreen();
                return;
              }
              window._showHubScreen = false;
              if (nextMode === 'cards') {
                window._explicitCardsOpened = true;
              } else {
                window._explicitCardsOpened = false;
              }
              window._trainingRoundJustCompleted = false;
              userSettings.preferredMethod = nextMode;
              saveUserSettings(userSettings);
              currentWordIndex = 0;
              renderTrainingTab();
            });
          }

          const repeatFavsBtn = content.querySelector('#go-repeat-favs-btn');
          if (repeatFavsBtn) {
            repeatFavsBtn.addEventListener('click', () => {
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              const tabBtn = document.querySelector('.nav-tab[data-tab="favorites"]');
              if (tabBtn) {
                tabBtn.click();
              } else {
                renderTab('favorites');
              }
            });
          }
          return;
        }

        let trainEl = content.querySelector('#training');
        if (!trainEl) {
          content.innerHTML = '<div id="training"></div>';
        }
        // Calculate remaining unfinished words in this round to detect if second word exists
        const unfinishedInQueue = activeWords.filter((w) => {
          const p = userProgress[w.id] || userProgress[String(w.id)];
          if (!p) return true;
          if (currentMethod === 'quiz') return (p.quizCorrect || 0) < 5 && !p.roundQuizDone && !isWordMastered(p);
          if (currentMethod === 'pairs') return (p.pairsCorrect || 0) < 1 && !p.roundPairsDone;
          if (currentMethod === 'input') return ((p.inputCorrect || 0) < 1 || p.needsTestRepeat) && !p.roundTestDone && !isWordMastered(p);
          return true;
        });
        const isSingleRemainingWord =
          unfinishedInQueue.length <= 1 ||
          (currentMethod === 'input' && testQueue.length <= 1) ||
          (currentMethod === 'quiz' && quizQueue.length <= 1);

        if (isFavPracticeActive && currentWordIndex >= activeWords.length) {
          if (window.__favsAutoplayRunning) {
            // Endless loop mode for background player: wrap to first word and continue
            currentWordIndex = 0;
            renderTrainingTab();
            return;
          }
          try { pushUserDataToCloud(null, null, true); } catch (e) {}
          playFanfareSound();
          if (window._favPracticeCompletedNonCardWord && currentMethod !== 'cards') {
            window._favPracticeCompletedNonCardWord = false;
            try {
              AdService.showCollectionsExitInterstitial().catch(() => {});
            } catch (e) {}
          }
          favoritePracticeWords = null;
          favoritePracticeMethod = 'cards';
          window._activePracticeCollectionId = null;
          window._activePracticeCollectionTitle = null;
          currentWordIndex = 0;
          activeTab = 'favorites';
          window._activeTab = 'favorites';
          const tabs = document.querySelectorAll('.nav-tab');
          tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'favorites'));
          renderTab('favorites', true);
          return;
        }

        if (!isFavPracticeActive && currentMethod === 'input' && currentWordIndex >= activeWords.length) {
          if (testQueue.length === 0 || unfinishedInQueue.length === 0) {
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            window._trainingRoundJustCompleted = true;
            window._showHubScreen = true;
            currentWordIndex = 0;
            renderTrainingTab();
            return;
          } else {
            currentWordIndex = 0;
          }
        }

        if (!isFavPracticeActive && currentMethod === 'quiz' && currentWordIndex >= activeWords.length) {
          if (quizQueue.length === 0 || unfinishedInQueue.length === 0) {
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            window._trainingRoundJustCompleted = true;
            window._showHubScreen = true;
            currentWordIndex = 0;
            renderTrainingTab();
            return;
          } else {
            currentWordIndex = 0;
          }
        }

        const currentWord = activeWords[currentWordIndex % activeWords.length];

        const isFav =
          Boolean(currentWord) &&
          (favSet.has(String(currentWord.id)) ||
            (currentWord.word && favSet.has(String(currentWord.word).toLowerCase().trim())));

        const availableModes = isFavPracticeActive
          ? { cards: true, quiz: true, pairs: true, input: true }
          : {
              cards: currentMethod === 'cards',
              quiz: currentMethod === 'quiz',
              pairs: currentMethod === 'pairs',
              input: currentMethod === 'input',
            };

        if (!window._showHubScreen && !isFavPracticeActive) {
          window._pausedRoundState = {
            category: selectedCategory,
            method: currentMethod,
            wordIndex: currentWordIndex,
          };
        }

        renderTrainingCard(currentWord, allWords, {
          currentMethod,
          selectedCategory,
          categories,
          activeWords,
          currentWordIndex,
          isLastWord: currentWordIndex >= activeWords.length - 1 || isSingleRemainingWord,
          isSingleRemaining: isSingleRemainingWord,
          learningCount,
          dailyGoal,
          availableModes,
          isFavPractice: isFavPracticeActive,
          favCollectionTitle: isFavPracticeActive ? (window._activePracticeCollectionTitle || getCollectionTitle(getActiveCollectionId())) : '',
          onCategoryBadgeClick: () => {
            renderCategorySelectorScreen();
          },
          onMethodChange: (newMethod) => {
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            window.__favsAutoplayRunning = false;
            releaseScreenWakeLock();
            stopNativeBackgroundPlayback();
            if (window.__favsAutoplayTimer) clearTimeout(window.__favsAutoplayTimer);
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
              try { window.speechSynthesis.cancel(); } catch (e) {}
            }
            if (window.trackScreen) {
              window.trackScreen('training_' + newMethod, 'TrainingMode');
            }
            if (window.trackEvent) {
              window.trackEvent('training_mode_select', { mode: newMethod });
            }
            if (isFavPracticeActive) {
              favoritePracticeMethod = newMethod;
              if (newMethod !== 'cards') {
                try {
                  AdService.preloadInterstitial().catch(() => {});
                } catch (e) {}
              }
            } else {
              userSettings.preferredMethod = newMethod;
              saveUserSettings(userSettings);
              if (newMethod === 'quiz') {
                try {
                  AdService.preloadInterstitial().catch(() => {});
                } catch (e) {}
              }
            }
            currentWordIndex = 0;
            renderTrainingTab();
          },
          onCategoryChange: (newCategory) => {
            try { pushUserDataToCloud(null, null, true); } catch (e) {}
            window.__favsAutoplayRunning = false;
            releaseScreenWakeLock();
            stopNativeBackgroundPlayback();
            if (window.__favsAutoplayTimer) clearTimeout(window.__favsAutoplayTimer);
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
              try { window.speechSynthesis.cancel(); } catch (e) {}
            }
            if (window.trackEvent) {
              window.trackEvent('category_change', { category: newCategory });
            }
            favoritePracticeWords = null;
            favoritePracticeMethod = 'cards';
            clearActiveConveyorBatch();
            window._pausedRoundState = null;
            userSettings.category = newCategory;
            saveUserSettings(userSettings);
            currentWordIndex = 0;
            renderTrainingTab();
          },
          isFavorite: isFav,
          onFavoriteToggle: handleFavoriteToggle,
          canGoPrev: currentWordIndex > 0,
          onPrev: () => {
            if (currentWordIndex > 0) {
              currentWordIndex -= 1;
              renderTrainingTab();
            }
          },
          onNext: (opts = {}) => {
            incrementGuestTrainingCount();
            updateHeaderUser();

            if (isFavPracticeActive && currentMethod !== 'cards') {
              window._favPracticeCompletedNonCardWord = true;
            }

            if (window.trackEvent) {
              window.trackEvent('word_studied', {
                method: currentMethod,
                is_favorite_practice: Boolean(isFavPracticeActive),
              });
            }

            if (currentMethod === 'input' && (isSingleRemainingWord || unfinishedInQueue.length <= 1)) {
              window._trainingRoundJustCompleted = true;
            }

            if (opts && opts.repeatSoon) {
              // Re-insert hard word 3 positions later so the user repeats it soon in this session
              const insertPos = Math.min(currentWordIndex + 3, activeWords.length);
              activeWords.splice(insertPos, 0, currentWord);
            }

            if (currentMethod === 'cards' && !isFavPracticeActive) {
              currentWordIndex = 0;
            } else if (currentMethod === 'pairs' && !isFavPracticeActive) {
              currentWordIndex = 0;
            } else {
              currentWordIndex += 1;
            }
            renderTrainingTab();
          },
        });
      }

      let tabHistory = ['training'];

      async function renderTab(tabName, skipHistoryPush = false) {
        if (!skipHistoryPush && tabName) {
          if (tabName === 'training') {
            tabHistory = ['training'];
          } else if (tabHistory[tabHistory.length - 1] !== tabName) {
            tabHistory.push(tabName);
          }
        }
        // Interstitial strictly upon EXITING Collection practice after completing at least 1 word in non-Cards mode,
        // NEVER when entering Collections, NEVER when entering Stats (where Banner is shown), and NEVER without practicing a non-Cards word.
        // Capped at: max 2 times per day, not more than once per hour.
        const isFavPracticeActiveOnTabSwitch = Boolean(favoritePracticeWords && favoritePracticeWords.length > 0);
        if (
          ((activeTab === 'favorites' && tabName && tabName !== 'favorites') ||
           (activeTab === 'training' && (isFavPracticeActiveOnTabSwitch || window._activePracticeCollectionId) && tabName !== 'training')) &&
          window._favPracticeCompletedNonCardWord
        ) {
          window._favPracticeCompletedNonCardWord = false;
          if (tabName !== 'stats') {
            try {
              AdService.showCollectionsExitInterstitial().catch(() => {});
            } catch (e) {}
          }
        }
        // Interstitial upon early exit from Quiz, Pairs, or Test in training round
        // (Never for Cards, Never when entering Stats where Banner is shown, 60m cooldown, unlimited daily frequency)
        if (activeTab === 'training' && !window._showHubScreen && !isFavPracticeActiveOnTabSwitch && !window._activePracticeCollectionId && tabName !== 'training' && tabName !== 'stats') {
          if (currentTrainingMethod === 'quiz' || currentTrainingMethod === 'pairs' || currentTrainingMethod === 'input') {
            try {
              AdService.showTrainingEarlyExitInterstitial().catch(() => {});
            } catch (e) {}
          }
        }
        if (activeTab === 'favorites' && tabName === 'training') {
          favoritePracticeWords = null;
          favoritePracticeMethod = 'cards';
          window._activePracticeCollectionId = null;
          window._activePracticeCollectionTitle = null;
        }
        activeTab = tabName;
        window._activeTab = tabName;
        if (window.trackScreen) {
          window.trackScreen(tabName, 'MainTab');
        }
        const navTabs = document.querySelectorAll('.nav-tab');
        navTabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === tabName));
        const content = document.querySelector('#app-content');

        // Banner management: show strictly in Stats (no audio conflict)
        if (tabName === 'stats') {
          try { AdService.showBottomBanner(); } catch (e) {}
        } else {
          try { AdService.hideBottomBanner(); } catch (e) {}
        }

        try {
          updateMondayTickerTabVisibility(tabName);
        } catch (e) {}

        if (tabName !== 'training') {
          try { pushUserDataToCloud(null, null, true); } catch (e) {}
          favoritePracticeWords = null;
          favoritePracticeMethod = 'cards';
          window._activePracticeCollectionId = null;
          window._activePracticeCollectionTitle = null;
          window.__favsAutoplayRunning = false;
          releaseScreenWakeLock();
          stopNativeBackgroundPlayback();
          if (window.__favsAutoplayTimer) clearTimeout(window.__favsAutoplayTimer);
          if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
          }
        }

        if (tabName !== 'favorites') {
          window._isInsideCollectionCards = false;
          window._currentOpenCollectionId = null;
        }

        if (tabName === 'training') {
          await renderTrainingTab();
        } else if (tabName === 'stats') {
          await renderStatsView(allWords, '#app-content');
        } else if (tabName === 'favorites') {
          const startPracticeHandler = async (practiceWords, colId = null, colTitle = null) => {
            window._explicitCardsOpened = true;
            window._trainingRoundJustCompleted = false;
            window._showHubScreen = false;
            window._isInsideCollectionCards = false;
            window._currentOpenCollectionId = null;

            const targetId = colId || 'my_favorites';
            window._activePracticeCollectionId = targetId;
            window._activePracticeCollectionTitle = colTitle || getCollectionTitle(targetId);
            window._favPracticeCompletedNonCardWord = false;

            const practiceList = (practiceWords && practiceWords.length > 0)
              ? practiceWords
              : getCollectionWords(targetId, allWords);

            if (practiceList && practiceList.length > 0) {
              favoritePracticeWords = [...practiceList];
              favoritePracticeMethod = 'cards';
            } else {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
            }
            currentWordIndex = 0;

            if (window.trackEvent) {
              window.trackEvent('collection_practice_start', {
                collection_id: targetId,
                words_count: practiceList ? practiceList.length : 0,
              });
            }

            activeTab = 'training';
            window._activeTab = 'training';
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'training'));
            await renderTab('training', true);
          };

          const openCardsHandler = (colId) => {
            const words = getCollectionWords(colId, allWords);
            const title = getCollectionTitle(colId);
            window._isInsideCollectionCards = true;
            window._currentOpenCollectionId = colId;

            if (window.trackScreen) {
              window.trackScreen('collection_cards', 'CollectionCards', { collection_id: colId });
            }
            if (window.trackEvent) {
              window.trackEvent('collection_view', { collection_id: colId, words_count: words.length });
            }
            renderFavoritesView(words, '#app-content', {
              collectionId: colId,
              collectionTitle: title,
              allWords,
              onBack: () => {
                window._isInsideCollectionCards = false;
                window._currentOpenCollectionId = null;
                renderTab('favorites');
              },
              onRefresh: () => openCardsHandler(colId),
              onFavoriteToggle: handleFavoriteToggle,
              onRemoveFavorite: (id) => handleFavoriteToggle(id, false),
              onClearAllFavorites: () => {
                favoriteIds.clear();
              },
              onStartFavoritePractice: (words) => {
                window._isInsideCollectionCards = false;
                window._currentOpenCollectionId = null;
                startPracticeHandler(words, colId, title);
              },
            });
          };

          if (window._isInsideCollectionCards && window._currentOpenCollectionId) {
            openCardsHandler(window._currentOpenCollectionId);
            return;
          }

          window._isInsideCollectionCards = false;
          window._currentOpenCollectionId = null;
          renderCollectionsHubView(allWords, '#app-content', {
            onStartPractice: startPracticeHandler,
            onOpenCardsView: openCardsHandler,
          });
        } else if (tabName === 'leaderboard') {
          try {
            await renderLeaderboardView('#app-content', {
              onUserChange: async () => {
                updateHeaderUser();
                await loadData();
              },
            });
          } catch (leadErr) {
            console.error('Failed to render leaderboard:', leadErr);
          }
        } else if (tabName === 'dictionary') {
          renderDictionaryView(allWords, '#app-content', {
            favoriteIds: Array.from(favoriteIds),
            onFavoriteToggle: handleFavoriteToggle,
          });
        } else if (tabName === 'settings') {
          await renderSettingsView(
            '#app-content',
            async () => {
              updateHeaderUser();
              await loadData();
            },
            allWords
          );
        }
      }

      let _tabUpdateDebounceTimer = null;
      function scheduleTabUpdate(tabName = activeTab, delay = 60) {
        if (window._isAppInitializing) return;
        if (_tabUpdateDebounceTimer) clearTimeout(_tabUpdateDebounceTimer);
        _tabUpdateDebounceTimer = setTimeout(() => {
          _tabUpdateDebounceTimer = null;
          if (!window._isCategorySelectOpen) {
            renderTab(tabName);
          }
        }, delay);
      }

      async function init() {
        window._isAppInitializing = true;
        window._explicitCardsOpened = false;
        window._trainingRoundJustCompleted = false;
        initPrizePodiumListener();
        preloadNextWotdVideo();

        // 1. Instant local cache restore (0ms)
        try {
          const cacheVer = localStorage.getItem('myduo_words_cache_ver');
          const cachedRaw = localStorage.getItem('myduo_cached_words');
          if (cachedRaw && cacheVer === 'v386_clean_translations') {
            const parsed = JSON.parse(cachedRaw);
            if (Array.isArray(parsed) && parsed.length >= 6886) {
              allWords = parsed;
            }
          }
        } catch (e) {}

        try {
          const localSettings = localStorage.getItem('myduo_user_settings');
          if (localSettings) {
            userSettings = { ...userSettings, ...JSON.parse(localSettings) };
          }
        } catch (e) {}

        try {
          if (typeof syncPendingWidgetFavorites === 'function') {
            await syncPendingWidgetFavorites();
          }
        } catch (e) {}

        try {
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
        } catch (e) {}

        window.addEventListener('myduo:auth_changed', async (e) => {
          if (window._isAppInitializing) return;
          const user = e.detail?.user || getCurrentUser();
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
          updateHeaderUser();
          if (user && user.id) {
            try {
              if (window.AndroidAnalyticsBridge && typeof window.AndroidAnalyticsBridge.setUserId === 'function') {
                window.AndroidAnalyticsBridge.setUserId(String(user.id));
              }
            } catch (e) {}
            try {
              await fetchUserDataFromCloud(user.id);
            } catch (e) {}
            pushUserDataToCloud(user.id, null, false);
          }
          await loadData();
          if (!window._isCategorySelectOpen) {
            renderTab(activeTab);
          }
        });

        function syncFavoritesToAndroidWidget() {
          try {
            if (!window.AndroidWidgetBridge || typeof window.AndroidWidgetBridge.syncFavorites !== 'function') return;
            const targetCol = (typeof getActiveCollectionId === 'function') ? getActiveCollectionId() : 'my_favorites';
            syncCollectionToAndroidWidget(targetCol, allWords);
          } catch (e) {
            console.warn('[Widget] syncFavorites error:', e);
          }
        }
        window.syncFavoritesToAndroidWidget = syncFavoritesToAndroidWidget;

        // Reconcile favorites toggled on home screen widget whenever user returns to app
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            if (typeof syncPendingWidgetFavorites === 'function') {
              syncPendingWidgetFavorites();
            }
          }
        });
        window.addEventListener('focus', () => {
          if (typeof syncPendingWidgetFavorites === 'function') {
            syncPendingWidgetFavorites();
          }
        });

        try {
          if (window.AndroidWidgetBridge && typeof window.AndroidWidgetBridge.syncUserRank === 'function') {
            const cachedRank = parseInt(localStorage.getItem('myduo_cached_rank') || '0', 10);
            if (cachedRank > 0) {
              window.AndroidWidgetBridge.syncUserRank(cachedRank);
            }
          }
        } catch (e) {}

        window.addEventListener('myduo_favorites_updated', (e) => {
          const favs = e.detail || getUserFavorites();
          favoriteIds = new Set(favs.map(String));
          try {
            const curWotd = getGlobalWordOfTheDay(allWords, cloudWordOfTheDayId);
            if (curWotd) {
              const wotdFavNow = favoriteIds.has(String(curWotd.id));
              document.querySelectorAll('#wotd-fav-front, #wotd-fav-back').forEach((b) => {
                b.classList.toggle('is-active', wotdFavNow);
                b.classList.toggle('is-off', !wotdFavNow);
              });
            }
          } catch (err) {}
          syncFavoritesToAndroidWidget();
          if (window._isAppInitializing) return;
          if (window._isInsideCollectionCards) return;
          if (!window._isCategorySelectOpen && (activeTab === 'favorites' || activeTab === 'dictionary')) {
            renderTab(activeTab);
          }
        });

        window.addEventListener('myduo:progress_updated', () => {
          if (window._isAppInitializing) return;
          if (activeTab === 'training' && window._showHubScreen) {
            updateHeaderUser();
            return;
          }
          scheduleTabUpdate(activeTab);
        });

        window.addEventListener('myduo:cloud_synced', async () => {
          if (window._isAppInitializing) return;
          updateHeaderUser();
          const favList = getUserFavorites();
          favoriteIds = new Set(favList.map(String));
          syncFavoritesToAndroidWidget();
          if (activeTab === 'training' && window._showHubScreen) {
            return;
          }
          scheduleTabUpdate(activeTab);
        });

        window.addEventListener('myduo:lang_changed', () => {
          const activeLang = getInterfaceLanguage();
          userSettings.interfaceLang = activeLang;
          if (allWords && Array.isArray(allWords)) {
            allWords.forEach((w) => {
              if (w) {
                if (w.translations && w.translations[activeLang]) {
                  w.translation = w.translations[activeLang];
                }
                if (w.all_notes && typeof w.all_notes === 'object') {
                  w.notes = w.all_notes[activeLang] || '';
                }
              }
            });
          }
          const drawer = document.querySelector('#burger-drawer');
          if (drawer) {
            const tabsDef = [
              { tab: 'training', key: 'training' },
              { tab: 'leaderboard', key: 'leaderboard' },
              { tab: 'dictionary', key: 'dictionary' },
              { tab: 'favorites', key: 'favorites' },
              { tab: 'stats', key: 'stats' },
              { tab: 'settings', key: 'settings' }
            ];
            tabsDef.forEach(({ tab, key }) => {
              const tabEl = drawer.querySelector(`.nav-tab[data-tab="${tab}"]`);
              if (tabEl) {
                const textEl = tabEl.querySelector('.drawer-item-text');
                if (textEl) textEl.textContent = t(key);
                tabEl.title = t(key);
              }
            });
            const feedbackBtn = drawer.querySelector('#drawer-feedback-btn');
            if (feedbackBtn) {
              feedbackBtn.innerHTML = `
                <span class="drawer-feedback-icon">💡</span>
                <span class="drawer-feedback-title">${t('feedback_title')}</span>
              `;
            }

            const closeBtn = drawer.querySelector('#drawer-close-btn');
            if (closeBtn) {
              closeBtn.ariaLabel = t('word_notes_close') || 'Close';
            }
          }
          updateHeaderUser();
          syncFavoritesToAndroidWidget();
          renderTab(activeTab);
        });

        // 2. Immediate zero-latency UI mount (renders instantly)
        renderAppLayout(
          (tabName) => {
            if (tabName === 'training') {
              const isFavPracticeActiveOnTrainingClick = Boolean(favoritePracticeWords && favoritePracticeWords.length > 0);
              if (isFavPracticeActiveOnTrainingClick || window._activePracticeCollectionId) {
                if (window._favPracticeCompletedNonCardWord) {
                  window._favPracticeCompletedNonCardWord = false;
                  try {
                    AdService.showCollectionsExitInterstitial().catch(() => {});
                  } catch (e) {}
                }
              } else if (activeTab === 'training' && !window._showHubScreen) {
                if (currentTrainingMethod === 'quiz' || currentTrainingMethod === 'pairs' || currentTrainingMethod === 'input') {
                  try {
                    AdService.showTrainingEarlyExitInterstitial().catch(() => {});
                  } catch (e) {}
                }
              }
              favoritePracticeWords = null;
              window._showHubScreen = true;
            }
            if (tabName === 'favorites') {
              window._isInsideCollectionCards = false;
              window._currentOpenCollectionId = null;
            }
            renderTab(tabName);
          },
          async () => {
            updateHeaderUser();
            await loadData();
            renderTab(activeTab);
          },
          () => {
            // Click on Logo / Brand -> Exit any practice / mode and return cleanly to Main Hub / Training
            try {
              const isFavPracticeRunning = Boolean(favoritePracticeWords && favoritePracticeWords.length > 0);
              if (activeTab === 'favorites' || isFavPracticeRunning || window._activePracticeCollectionId) {
                if (window._favPracticeCompletedNonCardWord) {
                  window._favPracticeCompletedNonCardWord = false;
                  try {
                    AdService.showCollectionsExitInterstitial().catch(() => {});
                  } catch (e) {}
                }
              } else if (activeTab === 'training' && !window._showHubScreen && (currentTrainingMethod === 'quiz' || currentTrainingMethod === 'pairs' || currentTrainingMethod === 'input')) {
                try {
                  AdService.showTrainingEarlyExitInterstitial().catch(() => {});
                } catch (e) {}
              }
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._activePracticeCollectionId = null;
              window._activePracticeCollectionTitle = null;
              window._showHubScreen = true;
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              const tabs = document.querySelectorAll('.nav-tab');
              tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'training'));

              renderTab('training');
            } catch (err) {
              console.error('Error in logo click callback:', err);
            }
          }
        );

        // Check if this is the very first start (before registration/first launch)
        const hasLaunched = localStorage.getItem('myduo_has_launched');
        const user = getCurrentUser();
        if (!hasLaunched && (!user || user.id === 'guest')) {
          localStorage.setItem('myduo_has_launched', '1');
          activeTab = 'settings';
        } else {
          activeTab = 'training';
          window._showHubScreen = true;
        }

        // 3. Load initial data and render complete DOM before hiding splash screen
        const splashMinTimePromise = new Promise((r) => setTimeout(r, 600));

        try {
          await loadData();
        } catch (err) {
          console.warn('Initial loadData error:', err);
        }

        try {
          await renderTab(activeTab);
          updateHeaderUser();
        } catch (err) {
          console.error('Initial tab render error:', err);
        } finally {
          window._isAppInitializing = false;
          try {
            await splashMinTimePromise;
          } catch (e) {}
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (typeof window.hideAppSplashScreen === 'function') {
                window.hideAppSplashScreen();
              }
              try {
                syncFavoritesToAndroidWidget();
              } catch (e) {}
            });
          });
        }

        // 4. Native Android Back Button & Gesture Navigation handler
        window.handleAndroidBackButton = function() {
          try {
            // Priority 1: Close burger drawer if open
            const drawer = document.querySelector('#burger-drawer');
            const drawerOverlay = document.querySelector('#drawer-overlay');
            if ((drawer && drawer.classList.contains('open')) || (drawerOverlay && drawerOverlay.classList.contains('open'))) {
              if (drawer) drawer.classList.remove('open');
              if (drawerOverlay) drawerOverlay.classList.remove('open');
              return true;
            }

            // Priority 2: Close any open modal dialogs or overlays
            const modalSelectors = [
              '#privacy-policy-modal-overlay',
              '#doc-scanner-modal-overlay',
              '#add-word-modal-overlay',
              '#word-notes-modal-overlay',
              '#auth-modal',
              '#avatar-picker-modal',
              '#share-modal-overlay',
              '#share-dialog-overlay',
              '#top100-congrats-modal',
              '#prize-podium-modal',
              '#cat-voice-download-modal',
              '#settings-overlay',
              '#mic-explainer-modal',
              '#widget-config-bottom-sheet',
              '.widget-sheet-backdrop',
              '.scanner-modal-overlay',
              '.word-notes-modal-overlay',
              '.share-modal-overlay',
              '.speech-diag-modal',
              '.prize-podium-backdrop',
              '.modal-backdrop',
              '.modal-overlay'
            ].join(', ');

            const candidates = Array.from(document.querySelectorAll(modalSelectors));
            const openModals = candidates.filter((el) => {
              if (!el || !el.isConnected) return false;
              if (el.tagName === 'TEMPLATE' || el.id === 'modal-template') return false;
              if (el.id === 'burger-drawer' || el.id === 'drawer-overlay') return false;
              const style = window.getComputedStyle(el);
              if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') {
                return false;
              }
              return true;
            });

            // Keep only root modal elements (not child elements that matched a selector)
            const rootModals = openModals.filter((el) => !openModals.some((other) => other !== el && other.contains(el)));

            if (rootModals.length > 0) {
              const topModal = rootModals[rootModals.length - 1];
              const closeBtn = topModal.querySelector(
                '#privacy-back-btn, #privacy-close-btn, ' +
                '#scanner-close-btn, .scanner-close-btn, ' +
                '#add-word-close-btn, #add-word-cancel-btn, ' +
                '#word-notes-close-btn, .word-notes-modal-close, ' +
                '#close-avatar-modal-btn, .modal-close-btn, ' +
                '#share-modal-close-btn, .share-modal-close, ' +
                '#top100-close-btn, #prize-continue-btn, #cat-modal-cancel-btn, #close-settings-btn, ' +
                '#diag-close-btn, #mic-explainer-allow-btn, #btn-close-widget-sheet, ' +
                '#col-actions-close-btn, #col-btn-cancel, #add-words-close-btn, #add-words-cancel-btn, #col-lists-close-btn, #col-lists-sheet-close, ' +
                '.modal-close, .close-btn, [data-action="close"], [aria-label="Close"], [aria-label="Закрыть"], [aria-label="Отмена"], [aria-label="Fechar"], [aria-label="Закрити"], [aria-label="Cancelar"]'
              );
              if (closeBtn && typeof closeBtn.click === 'function') {
                closeBtn.click();
              } else {
                topModal.remove();
              }
              return true;
            }

            // Priority 3: If Category Selection view is open, close it and return to Training Hub
            if (window._isCategorySelectOpen) {
              window._isCategorySelectOpen = false;
              renderTrainingTab();
              return true;
            }

            // Priority 4: If inside practice / exercise mode or practicing favorites, return to hub (or to favorites if started from there)
            const isFavPracticeRunning = Boolean(favoritePracticeWords && favoritePracticeWords.length > 0);
            if (activeTab === 'training' && (!window._showHubScreen || isFavPracticeRunning)) {
              if (isFavPracticeRunning || window._activePracticeCollectionId) {
                if (window._favPracticeCompletedNonCardWord) {
                  window._favPracticeCompletedNonCardWord = false;
                  try {
                    AdService.showCollectionsExitInterstitial().catch(() => {});
                  } catch (e) {}
                }
              } else if (currentTrainingMethod === 'quiz' || currentTrainingMethod === 'pairs' || currentTrainingMethod === 'input') {
                try {
                  AdService.showTrainingEarlyExitInterstitial().catch(() => {});
                } catch (e) {}
              }
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._activePracticeCollectionId = null;
              window._activePracticeCollectionTitle = null;
              window._showHubScreen = true;
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              if (isFavPracticeRunning && tabHistory.length > 1 && tabHistory[tabHistory.length - 1] === 'favorites') {
                tabHistory.pop();
                const tabs = document.querySelectorAll('.nav-tab');
                tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === 'favorites'));
                renderTab('favorites', true);
              } else {
                renderTrainingTab();
              }
              return true;
            }

            // Priority 4.5: If viewing a collection's cards inside Favorites/Collections, return to the Collections Hub grid
            const favBackBtn = document.querySelector('#fav-view-back-btn');
            if (activeTab === 'favorites' && (favBackBtn || window._isInsideCollectionCards)) {
              window._isInsideCollectionCards = false;
              window._currentOpenCollectionId = null;
              if (favBackBtn && typeof favBackBtn.click === 'function') {
                favBackBtn.click();
              } else {
                renderTab('favorites');
              }
              return true;
            }

            // Priority 5: If on secondary tabs, return to previous page in history in depth, up to the main Training tab
            if (activeTab !== 'training') {
              favoritePracticeWords = null;
              favoritePracticeMethod = 'cards';
              window._showHubScreen = true;
              window._explicitCardsOpened = false;
              window._trainingRoundJustCompleted = false;
              currentWordIndex = 0;

              // Pop current tab
              if (tabHistory.length > 1 && tabHistory[tabHistory.length - 1] === activeTab) {
                tabHistory.pop();
              }
              const previousTab = (tabHistory.length > 0) ? tabHistory[tabHistory.length - 1] : 'training';
              const targetTab = (previousTab && previousTab !== activeTab) ? previousTab : 'training';

              if (targetTab === 'training') {
                tabHistory = ['training'];
              }

              const tabs = document.querySelectorAll('.nav-tab');
              tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === targetTab));
              renderTab(targetTab, true);
              return true;
            }

            // Priority 6: Already on the Main Hub with nothing open -> return false (triggers native toast / exit)
            return false;
          } catch (e) {
            console.error('Error handling back button:', e);
            return false;
          }
        };

        // Also wire to Capacitor App plugin if dynamically loaded
        if (window.Capacitor?.Plugins?.App) {
          window.Capacitor.Plugins.App.addListener('backButton', () => {
            const handled = window.handleAndroidBackButton();
            if (!handled) {
              window.Capacitor.Plugins.App.exitApp();
            }
          });
        }
      }

      init();
    </script>
  </body>
</html>
